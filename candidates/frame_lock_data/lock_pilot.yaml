# cross-substrate convergence list stays at 9; no tier advances.
# This lock records PREDICTIONS ONLY -- no synergy number is computed here.
# ======================================================================

# ---------------- HEADER (protocol fields 0, 1, 15) -------------------

submission_id: frame_lock_pilot_controlled_groundtruth
version: "1.0.0-pilot"
tier: 3
status: WORKING_DRAFT_pilot_for_Cowork_Pav_ratification
