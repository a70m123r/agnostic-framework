# BEFORE any synergy / MDL number is computed. It pins the frame, the
# category C_frame, W_A/W_B/S and the span, the coding scheme, the
# DERIVED resolution band, the tau_eff rule, the 9f-bis non-additivity
# witness, and a CALLED-SHOT predicted verdict for each of the 5 cases.
#
# SCOPE (honest): controlled ground-truth weight tensors (numpy), KNOWN
