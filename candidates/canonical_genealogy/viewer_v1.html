  function ovlNowExt(key){ return arr(ovl(key).now_extension); }

  // =====================================================================
  // model build
  // =====================================================================
  function gatherYears(spec){
    var ys=[];
    function push(s){ allYears(s).forEach(function(y){ ys.push(y); }); }
    var w=spec.weld||{};
    var wr=whenRange(w.when); if(wr.from)ys.push(wr.from); if(wr.to)ys.push(wr.to); wr.dates.forEach(function(y){ys.push(y);});
    arr(w.dormancy_intervals).forEach(function(d){ push(d.from); push(d.to); });
    if(w.revival){ push(w.revival.when); }
    arr(w.sub_welds).forEach(function(s){ push(s.when); });
    arr(spec.actors).forEach(function(a){ push(a.when); });
    var roots=spec.roots||{};
    arr(roots.people_0).forEach(function(p){ push(p.when); });
    arr(roots.sub_wrappers).forEach(function(s){ push(s.when); push(s.who_called_it); });
    arr(spec.forcing_events).forEach(function(f){ push(f.when); });
    arr(spec.harvest&&spec.harvest.descendants).forEach(function(d){ push(d.what); push(d.name); });
    arr(spec.child&&spec.child.status_trajectory).forEach(function(s){ push(s.when); });
    var lc2=(w.lifecycle||{}); arr(lc2.phase_trajectory).forEach(function(p){ push(p.from); push(p.to); });
    return ys;
  }

  function computeSize(role, node, spec){
    if(role==='child'){
      var u=(spec.child&&spec.child.utility)||{};
      var aff=arr(u.action_spaces_unlocked).length;
      var desc=arr(spec.harvest&&spec.harvest.descendants).length;
      var sw=arr(spec.weld&&spec.weld.sub_welds).length;
      var sp=num(spec.weld&&spec.weld.surprise_confidence,0.5);
      return 6 + aff*1.4 + desc*1.6 + sw*0.8 + sp*3;
    }
    var c=num(node.confidence,0.6);
    var base = role==='parent'?4.5 : role==='descendant'?3.6 : role==='cultural'?3.0 :
               role==='aspace'?2.8 : role==='relative'?2.4 : role==='candidate'?3.2 : 2.6;
    return base + c*3;
  }

  function inCertainCore(name, spec){
    var cc = arr(spec.fuzzy_layer&&spec.fuzzy_layer.certain_core).join(' | ').toLowerCase();
    if(!cc) return 0;
    var toks = String(name||'').toLowerCase().split(/[^a-z]+/).filter(function(t){return t.length>4;});
    var hit=0; toks.forEach(function(t){ if(cc.indexOf(t)>=0) hit++; });
    return toks.length? clamp(hit/Math.min(3,toks.length),0,1):0;
  }

  function computeSolidity(role, node, spec){
    var fl = node.frame_layer||{};
    var kernel = num(fl.physical_membership, role==='child'?0.1:0.25);
    var conf = num(node.confidence, role==='child'?num(spec.child&&spec.child.confidence,0.7):0.6);
    var canon = clamp(0.45*conf + 0.55*inCertainCore(node.name, spec) + (conf>=0.9?0.15:0), 0,1);
    var artefact, protocol;
    if(role==='child'){
      var hv=spec.harvest||{};
      artefact = (arr(hv.descendants).length+arr(hv.cultural_harvest).length)>0 ? 0.85 : 0.3;
      var adopt = (spec.child&&spec.child.adoption)||null;
      var adopted = adopt && /adopt|standard|institutionali/i.test(String(adopt.state||''));
      var hasAff = arr(spec.child&&spec.child.utility&&spec.child.utility.action_spaces_unlocked).length>0;
      protocol = adopted ? 0.92 : (hasAff ? 0.85 : 0.3);
    } else if(role==='descendant'){ artefact=0.6; protocol=0.45; }
    else if(role==='parent'){ artefact=0.4; protocol=0.45; }
    else if(role==='cultural'){ artefact=0.55; protocol=0.4; }
    else if(role==='aspace'){ artefact=0.5; protocol=0.55; }
    else if(role==='relative'){ artefact=0.3; protocol=0.25; }
    else { artefact=0.3; protocol=0.3; }
    var classes=[kernel,canon,artefact,protocol];
    var mean=(classes[0]+classes[1]+classes[2]+classes[3])/4;
    var spanBonus = Math.min(canon,Math.max(artefact,protocol));
    return clamp(0.6*mean + 0.4*spanBonus, 0.05, 1);
  }

  // Resolve a structured "born" event from a lifecycle entry: prefer conceived->formulated.
  function lifeBorn(life, fallback){
    if(!life) return fallback;
    var b = fracYear(life.born) || fracYear(life.conceived) || fracYear(life.founded) || fracYear(life.formulated);
    return b!=null? b : fallback;
  }
  function lifeDeath(life){
    if(!life) return null;
    return fracYear(life.died) || fracYear(life.dissolved) || null;
  }

  function buildModel(key){
    var spec = SPECS[key];
    var ov = ovl(key);
    var ys = gatherYears(spec);
    // include now_extension years so the range always reaches NOW
    ovlNowExt(key).forEach(function(e){ var y=fracYear(e.when); if(y!=null) ys.push(y); });
    var rmin = ys.length? Math.min.apply(null,ys):1850;
    var rmax = ys.length? Math.max.apply(null,ys):2026;
    rmin = clamp(rmin-2, 1600, 2030);
    rmax = clamp(Math.max(rmax, rmin+10, NOW), rmin+10, 2035);   // ALWAYS extend to NOW (ask #4)

    var w = spec.weld||{};
    var wr = whenRange(w.when);
    var weldStart = wr.from!=null? wr.from : (wr.dates.length? wr.dates[0] : rmin);
    var weldFireNum = wr.to!=null ? wr.to : (wr.dates.length? wr.dates[wr.dates.length-1] : (wr.from!=null?wr.from:rmax));
    var childStatus = lc((spec.child&&spec.child.status)||'');
    var weldOpen = (wr.to==null) || !!wr.openHint ||
      /open[- ]?conjecture|contested|frontier|never[- ]?consummated|unresolved|still open|no end/.test(childStatus);
    var weldFire = weldOpen ? weldStart : weldFireNum;

    var nodes=[]; var byId={};
    function add(n){ nodes.push(n); if(n.id) byId[n.id]=n; return n; }

    var childRaw = spec.child||{};
    var childId = childRaw.id || 'child';
    // child idea lifecycle (conceived/formulated/named) from overlay
    var childLife = ovlLifecycle(key, [childId, childRaw.name]);
    var child = add({
      id: childId, role:'child', name: childRaw.name||'(child)', kernel: childRaw.kernel,
      frame: childRaw.frame, frame_layer: childRaw.frame_layer,
      confidence: num(childRaw.confidence,0.7), born: weldFire, layer:'latent',
      size: computeSize('child',childRaw,spec), solidity: computeSolidity('child',childRaw,spec),
      life: childLife
    });

    // ---- THEORY DNA ----
    var dna = ovlTheoryDNA(key);
    var dnaParents = dna? (dna.parents||{}) : {};
    function dnaShareFor(p){
      // p: parent node. lookup by id then name in theory_dna.parents
      var keys=[p.id, p.name];
      for(var i=0;i<keys.length;i++){ if(keys[i]!=null && dnaParents[keys[i]]) return dnaParents[keys[i]]; }
      return null;
    }

    // ---- PARENTS ----
    // Prefer parents_full (the granular lobes) when present; else the 2 abstract weld.parents.
    var parentNodes=[];
    var pf = arr(w.parents_full);
    if(pf.length){
      pf.forEach(function(p,i){
        var id=p.id||('pf-'+i);
        if(byId[id]) return;
        var d = dnaParents[id]||dnaParents[p.name];
        var pl = ovlLifecycle(key,[id,p.name]);
        var n=add({ id:id, role:'parent', name:p.name, kernel:p.kernel, frame:p.frame, frame_layer:p.frame_layer,
          confidence:num(p.confidence,0.8), born:weldStart, layer:'latent',
          size:computeSize('parent',p,spec), solidity:computeSolidity('parent',p,spec),
          parent_kind:p.parent_kind||'content',
          loadShare: d? num(d.load_bearing_share,null):null,
          shareConf: d? num(d.confidence, num((dna&&dna.confidence),0.5)):null,
          dnaBasis: d? d.basis:null, life:pl });
        parentNodes.push(n);
      });
    } else {
      arr(w.parents).forEach(function(p,i){
        var id = p.id || ('parent-'+i);
        var d = dnaParents[id]||dnaParents[p.name];
        var pl = ovlLifecycle(key,[id,p.name]);
        var n=add({ id:id, role:'parent', name:p.name||('parent '+i), kernel:p.kernel, frame:p.frame,
          frame_layer:p.frame_layer, confidence:num(p.confidence,0.8), born:weldStart, layer:'latent',
          size:computeSize('parent',p,spec), solidity:computeSolidity('parent',p,spec),
          parent_kind:'content',
          loadShare: d? num(d.load_bearing_share,null):null,
          shareConf: d? num(d.confidence, num((dna&&dna.confidence),0.5)):null,
          dnaBasis: d? d.basis:null, life:pl });
        parentNodes.push(n);
      });
    }

    // ---- ROOTS ----
    arr(spec.roots&&spec.roots.sub_wrappers).forEach(function(s,i){
      var yr = firstYear(s.when)||firstYear(s.who_called_it)||weldStart;
      var sl = ovlLifecycle(key,[s.id, s.name]);
      add({ id:s.id||('root-'+i), role:'root', name:s.name, kernel:s.kernel, frame:s.frame,
        frame_layer:s.frame_layer, confidence:num(s.confidence,0.75), born:lifeBorn(sl,yr), layer:'latent',
        size:computeSize('root',s,spec), solidity:computeSolidity('root',s,spec),
        who:s.who_called_it, depth:num(s.depth,1), life:sl });
    });

    // ---- DESCENDANTS (harvest, latent band) ----
    arr(spec.harvest&&spec.harvest.descendants).forEach(function(d,i){
      var hd = ovlHarvestDate(key,[d.id, d.name, 'descendants['+i+']']);
      var em = hd? fracYear(hd.emerged): null;
      var yr = em!=null? em : (firstYear(d.what)||firstYear(d.name)||(weldFire+(i+1)*3));
      add({ id:d.id||('desc-'+i), role:'descendant', name:d.name, kernel:d.what, frame:d.frame,
        frame_layer:d.frame_layer, confidence:num(d.confidence,0.8), born:Math.max(yr,weldFire), layer:'latent',
        size:computeSize('descendant',d,spec), solidity:computeSolidity('descendant',d,spec),
        harvestKind:'descendant', emerged:em, consolidated:hd?fracYear(hd.consolidated):null,
        harvestNote: hd?hd._note:null, hidx:i });
    });

    // ---- CULTURAL HARVEST (harvest band) ----
    arr(spec.harvest&&spec.harvest.cultural_harvest).forEach(function(c,i){
      var dom=lc(c.domain||'other');
      var hd = ovlHarvestDate(key,['cultural_harvest['+i+']','cultural_harvest.'+dom,'cultural_harvest['+dom+']']);
      var em = hd? fracYear(hd.emerged): null;
      var yr = em!=null? em : (weldFire + (i+1)*4);
      add({ id:'cult-'+i, role:'cultural', name:(cultStyle(dom).label+' harvest'), kernel:c.what,
        frame:c.frame, confidence:num(c.confidence,0.7), born:Math.max(yr,weldFire), layer:'latent',
        size:computeSize('cultural',c,spec), solidity:computeSolidity('cultural',c,spec),
        harvestKind:'cultural', domain:dom, emerged:em, consolidated:hd?fracYear(hd.consolidated):null,
        harvestNote: hd?hd._note:null, hidx:i });
    });

    // ---- ACTION SPACES UNLOCKED (harvest band — the feedback affordances) ----
    var aspaces = arr(childRaw.utility&&childRaw.utility.action_spaces_unlocked);
    aspaces.forEach(function(txt,i){
      var hd = ovlHarvestDate(key,['action_spaces_unlocked['+i+']']);
      var em = hd? fracYear(hd.emerged): null;
      var yr = em!=null? em : (weldFire + (i+1)*5);
      add({ id:'aspace-'+i, role:'aspace', name:'action-space · '+snip(txt,40), kernel:txt,
        frame:childRaw.frame, confidence:hd?num(hd.confidence,0.6):0.6, born:Math.max(yr,weldFire), layer:'latent',
        size:computeSize('aspace',{confidence:0.6},spec), solidity:computeSolidity('aspace',{},spec),
        harvestKind:'aspace', emerged:em, consolidated:hd?fracYear(hd.consolidated):null,
        harvestNote: hd?hd._note:null, hidx:i });
    });

    // ---- NOW-EXTENSION events (2024-2026, harvest/event/revival/decay) ----
    var nowItems=[];
    ovlNowExt(key).forEach(function(e,i){
      var yr=fracYear(e.when); if(yr==null) yr=NOW;
      nowItems.push({ id:'now-'+i, name:snip(e.what,46), what:e.what, when:e.when,
        kind:e.kind||'event', confidence:num(e.confidence,0.7), born:yr });
    });

    // ---- CANDIDATES ----
    arr(w.candidate_children).forEach(function(c,i){
      add({ id:c.id||('cand-'+i), role:'candidate', name:c.name||('candidate '+i), kernel:c.kernel||c.note,
        frame:c.frame, confidence:num(c.confidence,0.4), born:weldFire, layer:'latent',
        size:computeSize('candidate',c,spec), solidity:0.35, candidate:true });
    });

    // ---- RELATIVES (incl. rivals w/ fade fates) ----
    arr(spec.relatives&&spec.relatives.edges).forEach(function(r,i){
      var yr = firstYear(r.note)||firstYear(r.name)|| Math.round((weldStart+weldFire)/2);
      var fate = ovlRivalFate(key,[r.id, r.name]);
      add({ id:r.id||('rel-'+i), role:'relative', name:r.name, kernel:r.note, frame:r.frame,
        frame_layer:r.frame_layer, confidence:num(r.confidence,0.6), born:yr, layer:'latent',
        size:computeSize('relative',r,spec), solidity:computeSolidity('relative',r,spec),
        relation:r.relation||'cousin',
        fate: fate? lc(fate.fate): null, fateWhen: fate?fate.when:null, fateConf: fate?num(fate.confidence,0.6):null });
    });

    // ---- EDGES ----
    var edges=[];
    nodes.forEach(function(n){
      if(n===child) return;
      if(n.role==='parent'){ edges.push({a:n,b:child,kind:'parent',w:1.0}); }
      else if(n.role==='root'){ edges.push({a:n,b:child,kind:'attract',w:0.6}); }
      else if(n.role==='descendant'||n.role==='cultural'||n.role==='aspace'){ edges.push({a:child,b:n,kind:'harvest',w:0.7}); }
      else if(n.role==='candidate'){ edges.push({a:child,b:n,kind:'repel',w:0.8}); }
      else if(n.role==='relative'){
        if(n.relation==='rival'){ edges.push({a:n,b:child,kind:'repel',w:1.0,adversarial:true}); }
        else { edges.push({a:n,b:child,kind:'attract',w:0.3}); }
      }
    });

    var subWelds = arr(w.sub_welds).map(function(s){ return {name:s.name, year:firstYear(s.when), conf:num(s.confidence,0.7)}; })
                    .filter(function(s){return s.year;});
    var lc3 = w.lifecycle||{};
    var phases = arr(lc3.phase_trajectory).map(function(p){
      return {phase:p.phase, membership:num(p.membership,0.6), from:firstYear(p.from), to:(p.to==null?null:firstYear(p.to)), note:p.note};
    }).filter(function(p){return p.from!=null;});
    var weldTypes = arr(lc3.weld_type).map(function(t){return {type:t.type, weight:num(t.weight,0.5)};});
    var dormancy = arr(w.dormancy_intervals).map(function(d){ return {from:firstYear(d.from), to:firstYear(d.to)||rmax, why:d.why}; })
                    .filter(function(d){return d.from!=null;});

    // ---- ACTORS (with lifecycles) ----
    var actors=[]; var actorById={};
    function addActor(a){ actors.push(a); if(a.id) actorById[a.id]=a; return a; }
    if(arr(spec.actors).length){
      arr(spec.actors).forEach(function(a,i){
        var id=a.id||('act-'+i);
        var life = ovlLifecycle(key,[id,a.name]);
        var born = lifeBorn(life, firstYear(a.when)||weldStart);
        addActor({ id:id, name:a.name, kind:a.kind||'individual', role:a.role,
          frame_layer:a.frame_layer, born:born, died:lifeDeath(life), when:a.when, where:a.where,
          culture:a.culture, confidence:num(a.confidence,0.8), life:life,
          carrier_of:arr(a.carrier_of), inhabitant_of:arr(a.inhabitant_of) });
      });
    } else {
      arr(spec.roots&&spec.roots.people_0).forEach(function(p,i){
        var rel=lc(p.relation||p.role||'');
        var carry=[];
        if(/welder|originat|champion/.test(rel)){ carry.push({wrapper:childId, role:'champions', strength:0.8, confidence:p.confidence}); }
        var life = ovlLifecycle(key,[p.who]);
        var bornFromWhen = firstYear(p.when)||weldStart;
        addActor({ id:'p0-'+i, name:p.who, kind: /project|lab|institut|govern|state|company|univ/.test(rel)?'institution':'individual',
          role:p.role, frame_layer:{layer:'physical',physical_membership:1,latent_membership:0.1},
          born: lifeBorn(life,bornFromWhen), died:lifeDeath(life), when:p.when, where:p.where, culture:p.culture,
          confidence:num(p.confidence,0.8), life:life, carrier_of:carry, inhabitant_of:[] });
      });
    }

    var stems=[];
    actors.forEach(function(a){
      a.carrier_of.forEach(function(c){
        var target = byId[c.wrapper];
        if(!target){
          var lw=lc(c.wrapper||'');
          target = nodes.filter(function(n){return n.name && lw && (lc(n.name).indexOf(lw)>=0||lw.indexOf(lc(n.name).slice(0,12))>=0);})[0];
        }
        if(target){ stems.push({actor:a, node:target, strength:num(c.strength,0.6), conf:num(c.confidence,0.7), role:c.role||'carries' }); }
      });
    });

    var forcing = arr(spec.forcing_events).map(function(f,i){
      return { id:f.id||('fe-'+i), name:f.name, kind:f.kind, direction:f.direction||'pull',
        year:firstYear(f.when), when:f.when, mechanism:f.mechanism,
        acted_on:arr(f.acted_on).map(function(t){return {target:t.target, effect:t.effect, strength:num(t.strength,0.5)};}) };
    }).filter(function(f){return f.year;});

    return {
      key:key, spec:spec, ov:ov, nodes:nodes, byId:byId, actors:actors, actorById:actorById, stems:stems, edges:edges,
      child:child, parents:parentNodes, range:[rmin,rmax], weldFire:weldFire, weldStart:weldStart, weldOpen:weldOpen,
      subWelds:subWelds, phases:phases, weldTypes:weldTypes, dormancy:dormancy,
      seamAgreed:(w.S_structure? w.S_structure.agreed : null),
      topWeldType:(weldTypes.slice().sort(function(a,b){return b.weight-a.weight;})[0]||null),
      forcing:forcing, surpriseConf:num(w.surprise_confidence,0.5),
      dna:dna, nowItems:nowItems,
      // agnostic-units normalization frames (per-specimen [min,max]) for confidence & size
      normFrames:computeNormFrames(nodes)
    };
  }

  // Agnostic-units normalization (ask #5,#6): per-specimen [min,max] frames so a value renders as
  // a frame-relative ratio in [0,1], disclosed. We frame confidence and size separately.
  function computeNormFrames(nodes){
    var cs=[], ss=[];
    nodes.forEach(function(n){ if(n.confidence!=null) cs.push(n.confidence); if(n.size!=null) ss.push(n.size); });
    function mm(a){ if(!a.length) return [0,1]; var lo=Math.min.apply(null,a),hi=Math.max.apply(null,a); if(hi-lo<1e-6)hi=lo+1; return [lo,hi]; }
    return {conf:mm(cs), size:mm(ss)};
  }
  function ratio(v, frame){ if(v==null) return 0; return clamp((v-frame[0])/(frame[1]-frame[0]),0,1); }

  // ---------- state ----------
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var tip = document.getElementById('tip');
  var W=0,H=0,DPR=1;
  var M=null;                        // current single-specimen model
  var GLOBAL=null;                   // global multi-specimen model (built lazily)
  var mode='single';                 // 'single' | 'global'
  var year=NOW, playing=false;
  var layerFilter='both';            // both | latent | physical | harvest
  var observer='all';
  var depth=1.0;                     // 0=child only ... 1=full roots+harvest (ask #3)
  var magK=0.55, mirThresh=0.62;
  var hover=null;
  var cam={x:0,y:0,s:1, tx:0,ty:0,ts:1};
  var pulses=[];
  var fireFlash={t:0};
  var globalOff={};                  // per-specimen on/off in global view

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.max(1,Math.round(W*DPR));
    cv.height = Math.max(1,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // THREE bands now (ask #1): harvest (top) / latent (mid) / physical (bottom)
  function harvestBand(){ return {top:H*0.06, bot:H*0.30, mid:H*0.18}; }
  function latBand(){     return {top:H*0.34, bot:H*0.60, mid:H*0.47}; }
  function physBand(){    return {top:H*0.66, bot:H*0.93, mid:H*0.80}; }

  function yearX(y){
    var r=M.range; var pad=70;
    return pad + (clamp(y,r[0],r[1])-r[0])/(r[1]-r[0]) * (W-2*pad);
  }

  function bandForNode(n){
    if(n.role==='child'||n.role==='parent') return latBand();
    if(n.harvestKind) return harvestBand();
    if(n.frame_layer&&n.frame_layer.layer==='physical') return physBand();
    return latBand();
  }

  function seedPositions(){
    var hb=harvestBand(), lb=latBand(), pb=physBand();
    M.nodes.forEach(function(n,i){
      n.x = yearX(n.born); n.tx=n.x;
      var band = bandForNode(n);
      n.y = band.top + (i*37 % (band.bot-band.top));
      n.vx=0; n.vy=0; n.op=0;
      // absorption animation state (ask #8)
      n.absorbT = 0;             // 0 = free, 1 = fully drawn into child membrane
    });
    M.actors.forEach(function(a,i){
      a.x = yearX(a.born); a.tx=a.x;
      a.y = pb.top + (i*29 % (pb.bot-pb.top));
      a.vx=0; a.vy=0; a.op=0;
    });
    // give parents a stable lobe angle around the child for absorption layout
    M.parents.forEach(function(p,i){ p.lobeAngle = -Math.PI/2 + (i+0.5)/Math.max(1,M.parents.length)*Math.PI*2; });
  }

  function selectSpecimen(key){
    mode='single';
    M = buildModel(key);
    resize();
    seedPositions();
    year = NOW;                         // ALWAYS open at NOW (ask #4)
    syncScrub();
    buildLegend();
    document.querySelectorAll('#pickers .pick').forEach(function(b){ b.classList.toggle('on', b.dataset.k===key); });
    document.getElementById('globalBtn').classList.remove('on');
    cam.tx=W/2; cam.ty=H/2; cam.ts=1; cam.x=cam.tx; cam.y=cam.ty; cam.s=cam.ts;
    document.querySelector('#phase').textContent = phaseCaption();
  }

  function phaseCaption(){
    if(!M) return '';
    var wt = M.topWeldType? ' · weld_type: '+M.topWeldType.type+' ('+M.topWeldType.weight.toFixed(2)+')':'';
    if(M.weldOpen) return 'OPEN frontier weld — never consummated; rivals do NOT fade (frontier keeps all alive)'+wt+'.';
    return 'Roots ↓ · weld · harvest ↑ — scrub time; opens at NOW (2026-06)'+wt+'.';
  }

  // ---------- forces ----------
  function mass(n){ var s=num(n.size,4); return 1 + Math.pow(s, 1+magK*1.3)/Math.pow(20,1+magK*1.3)*8; }
  function radOf(n){ var base=clamp(8 + Math.sqrt(num(n.size,4))*4.2, 9, 70);
    if(n.role==='child'&&M&&!mode){} return base; }

  // depth gate: hide far-from-child layers as depth shrinks; also drops low-confidence first.
  function depthVisible(n){
    if(n.role==='child') return true;
    // layer distance from child: parent=1, root/descendant/cultural/aspace=2, relative/candidate=2
    var dist = (n.role==='parent')?0.34 : (n.role==='root')?0.85 : (n.harvestKind?0.7 : 0.9);
    if(depth < dist) return false;
    // relevance cutoff: as depth drops, low-confidence nodes drop first
    var relCut = (1-depth)*0.85;
    if(num(n.confidence,0.6) < relCut) return false;
    return true;
  }

  function visibleNode(n){
    if(!depthVisible(n)) return false;
    if(layerFilter==='physical') return false;
    if(layerFilter==='latent' && n.harvestKind) return true;
    if(layerFilter==='harvest' && !n.harvestKind && n.role!=='child') return false;
    return year >= n.born - 1.5;
  }
  function visibleActor(a){
    if(layerFilter==='latent'||layerFilter==='harvest') return false;
    if(depth < 0.85) return false;     // actors are the outermost physical layer
    if(num(a.confidence,0.6) < (1-depth)*0.85) return false;
    return year >= a.born - 1.5;
  }

  function resolveForcingTargets(id){
    if(!M || id==null) return [];
    if(M.byId[id]) return [M.byId[id]];
    if(M.actorById[id]) return [M.actorById[id]];
    var s=String(id);
    if(/^weld/.test(s) || /^sw-/.test(s)) return M.child? [M.child] : [];
    if(/^(par|pf)-/.test(s)) return M.nodes.filter(function(n){return n.role==='parent';});
    return [];
  }

  // absorption progress for a parent at the current year (ask #8)
  function absorbProgress(p){
    if(M.weldOpen) return 0;                   // open welds never absorb
    var t = (year - M.weldFire)/4;             // ramp over ~4 yrs after fire
    return clamp(t,0,1);
  }

  function step(dt){
    if(!M) return;
    var fs = clamp(dt*60, 0.3, 2.2);
    var hb=harvestBand(), lb=latBand(), pb=physBand();
    var nodes=M.nodes, child=M.child;

    // update absorption state for parents
    M.parents.forEach(function(p){ p.absorbT = lerp(p.absorbT, absorbProgress(p), 0.12); });

    nodes.forEach(function(n){
      if(n.role==='parent' && n.absorbT>0.02){
        // drawn into child: target = child position + lobe offset (scaled by 1-absorbT)
        var rc = radOf(child);
        var off = rc*0.55*(1-n.absorbT*0.6);
        n.tx = child.x + Math.cos(n.lobeAngle)*off;
        n.vx += (n.tx - n.x)*0.10*fs;
        n.vy += (child.y + Math.sin(n.lobeAngle)*off - n.y)*0.10*fs;
        return;
      }
      n.tx = yearX(n.born);
      n.vx += (n.tx - n.x)*0.06*fs;
      var band = bandForNode(n);
      var ymid = band.mid;
      n.vy += (ymid - n.y)*0.006*fs;
      if(n.y<band.top) n.vy += (band.top-n.y)*0.05*fs;
      if(n.y>band.bot) n.vy += (band.bot-n.y)*0.05*fs;
    });
    // pairwise separation (cap work for 60fps)
    for(var i=0;i<nodes.length;i++){
      var a=nodes[i]; if(!visibleNode(a)) continue;
      if(a.role==='parent'&&a.absorbT>0.5) continue;
      for(var j=i+1;j<nodes.length;j++){
        var b=nodes[j]; if(!visibleNode(b)) continue;
        if(b.role==='parent'&&b.absorbT>0.5) continue;
        var dx=a.x-b.x, dy=a.y-b.y; var d2=dx*dx+dy*dy; if(d2<1) d2=1;
        var d=Math.sqrt(d2);
        var mind = (radOf(a)+radOf(b))*0.9 + 12;
        if(d<mind){
          var f = (mind-d)/d * 0.06 * (mass(a)+mass(b))*0.5 * fs;
          a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
        }
      }
    }
    M.edges.forEach(function(e){
      var a=e.a,b=e.b; if(!visibleNode(a)||!visibleNode(b)) return;
      if(a.role==='parent'&&a.absorbT>0.5) return;
      if(b.role==='parent'&&b.absorbT>0.5) return;
      var dx=b.x-a.x, dy=b.y-a.y; var d=Math.sqrt(dx*dx+dy*dy)||1;
      var coupling = e.w * (0.4 + magK) * (mass(a)*mass(b))/ ( (mass(a)+mass(b)) );
      if(e.kind==='attract'||e.kind==='parent'||e.kind==='harvest'){
        var rest = e.kind==='harvest'?70 : e.kind==='parent'?60 : 90;
        var f=(d-rest)/d * 0.012 * coupling * fs;
        a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
      } else {
        var rep = (e.adversarial?1.6:1.0) * 1200 * coupling / (d*d) * fs;
        a.vx-=dx/d*rep; a.vy-=dy/d*rep; b.vx+=dx/d*rep; b.vy+=dy/d*rep;
      }
    });
    M.forcing.forEach(function(f){
      if(Math.abs(year-f.year)>4) return;
      var sign = f.direction==='squeeze'?1: (f.direction==='pull'?-1:0);
      if(sign===0) return;
      var ox=child?child.x:W/2, oy=child?child.y:H/2;
      f.acted_on.forEach(function(t){
        resolveForcingTargets(t.target).forEach(function(n){
          if(year < (n.born||0) - 2) return;
          var dx=n.x-ox, dy=n.y-oy, d=Math.sqrt(dx*dx+dy*dy)||1;
          var f2 = sign * num(t.strength,0.4) * 0.5 * fs;
          n.vx += dx/d*f2; n.vy += dy/d*f2;
        });
      });
    });
    nodes.forEach(function(n){
      n.vx*=0.82; n.vy*=0.82;
      n.vx=clamp(n.vx,-6,6); n.vy=clamp(n.vy,-6,6);
      n.x+=n.vx; n.y+=n.vy;
    });
    var acts=M.actors;
    acts.forEach(function(a){ a.tx=yearX(a.born); a.vx+=(a.tx-a.x)*0.08*fs; a.vy+=(pb.mid-a.y)*0.004*fs;
      if(a.y<pb.top)a.vy+=(pb.top-a.y)*0.06*fs; if(a.y>pb.bot)a.vy+=(pb.bot-a.y)*0.06*fs; });
    for(var k=0;k<acts.length;k++){ var A=acts[k]; if(!visibleActor(A))continue;
      for(var l=k+1;l<acts.length;l++){ var B=acts[l]; if(!visibleActor(B))continue;
        var ddx=A.x-B.x, ddy=A.y-B.y, dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
        if(dd<34){ var ff=(34-dd)/dd*0.05*fs; A.vx+=ddx*ff;A.vy+=ddy*ff;B.vx-=ddx*ff;B.vy-=ddy*ff; }
      }
    }
    acts.forEach(function(a){ a.vx*=0.8;a.vy*=0.8; a.x+=clamp(a.vx,-5,5); a.y+=clamp(a.vy,-5,5); });

    cam.x=lerp(cam.x,cam.tx,0.08); cam.y=lerp(cam.y,cam.ty,0.08); cam.s=lerp(cam.s,cam.ts,0.08);
    nodes.forEach(function(n){ n.op = lerp(n.op, targetOpacity(n), 0.12); if(!(n.op>0.015)) n.op=0; });
    acts.forEach(function(a){ a.op = lerp(a.op, targetActorOpacity(a), 0.12); if(!(a.op>0.015)) a.op=0; });
    for(var p=pulses.length-1;p>=0;p--){ pulses[p].t+=dt; if(pulses[p].t>1.6) pulses.splice(p,1); }
    if(fireFlash.t>0) fireFlash.t-=dt;
  }

  function dormancyDim(){
    if(!M) return 1;
    var f=1;
    M.dormancy.forEach(function(d){
      if(year>=d.from && (d.to==null||year<=d.to)) f=Math.min(f,0.35);
    });
    return f;
  }
  function observerFactor(n){
    if(observer==='all') return 1;
    var fr = arr(n.frame).map(function(x){return lc(x);});
    return fr.indexOf(observer)>=0 ? 1 : 0.42;
  }

  // ---- RIVAL FADE (ask #7) ----
  // Decay a defeated rival as the weld hardens. Reads overlay rival_fates; else disclosed default.
  function rivalFade(n){
    if(n.role!=='relative' || n.relation!=='rival') return 1;
    if(M.weldOpen) return 1;                         // frontier keeps rivals alive (qm overlay note)
    var hardenAt = M.weldFire;
    if(year < hardenAt) return 1;
    var yrs = year - hardenAt;
    var fate = n.fate;
    if(fate==='persists'){ return clamp(1 - yrs/120, 0.55, 1); }        // stays dim but present
    if(fate==='niche'){    return clamp(1 - yrs/25, 0.32, 1); }          // fades to a niche floor
    if(fate==='absorbed'){ return clamp(1 - yrs/18, 0.22, 1); }          // absorbed -> ghost
    if(fate==='faded'){    return clamp(1 - yrs/15, 0.10, 1); }          // fully fades to outline
    // disclosed DEFAULT (no overlay fate): fade to ghost over ~15y after hardening
    return clamp(1 - yrs/15, 0.12, 1);
  }

  // entity death dim (ask #2): after death, fade actor/idea to outline (handled in draw for actors)
  function deathDim(born, died){
    if(died==null) return 1;
    if(year < died) return 1;
    return clamp(1 - (year-died)/12, 0.30, 1);       // fade to a 0.30 outline floor over ~12y
  }

  function targetOpacity(n){
    if(!visibleNode(n)) return 0;
    var sol = clamp(n.solidity,0.05,1) * observerFactor(n);
    if(n.role==='child') sol *= dormancyDim();
    if(n.role==='relative' && n.relation==='rival') sol *= rivalFade(n);
    var ramp = clamp((year-(n.born-1.5))/3, 0, 1);
    var op = clamp(0.18 + sol*0.85, 0, 1) * ramp;
    if(n.role==='parent' && n.absorbT>0.5){ op *= (1 - (n.absorbT-0.5)*1.4); op=clamp(op,0,1); } // dissolve into child
    var effSol = sol;
    if(effSol < (1-mirThresh) && hover!==n){
      var kk = clamp(effSol/(1-mirThresh),0,1);
      op *= (0.12 + 0.88*kk);
    }
    if(hover===n) op=Math.max(op,0.95);
    return op;
  }
  function targetActorOpacity(a){
    if(!visibleActor(a)) return 0;
    var base = 0.85;
    if(layerFilter==='physical') base=0.95;
    var ramp = clamp((year-(a.born-1.5))/3,0,1);
    return base*ramp*deathDim(a.born,a.died)*(hover===a?1.15:1);
  }

  // ---------- draw ----------
  function frame(){
    var now=performance.now();
    var dt=Math.min(0.05,(now-(frame._last||now))/1000); frame._last=now;
    if(mode==='global'){ stepGlobal(dt); renderGlobal(); requestAnimationFrame(frame); return; }
    if(M){
      if(playing){ year += dt*(M.range[1]-M.range[0])/16; if(year>=M.range[1]){year=M.range[1];togglePlay(false);} syncScrub(); }
      if(frame._py!=null && !M.weldOpen && M.weldFire!=null){ if(frame._py<M.weldFire && year>=M.weldFire){ fireFlash.t=1.4; } }
      frame._py = year;
      step(dt);
      render();
    }
    requestAnimationFrame(frame);
  }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    if(!M) return;
    drawBands();
    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(cam.s,cam.s); ctx.translate(-cam.x,-cam.y);
    drawFeedbackArcs();
    drawStems();
    drawEdges();
    drawForcing();
    drawAbsorption();     // ask #8: parent lobes/stubs inside child
    drawNodes();
    drawActors();
    drawNowItems();       // ask #4
    drawWeldFlash();
    ctx.restore();
    drawNowMarker();      // ask #4: NOW line
    drawScrubLine();
    drawTheoryDNABar();   // ask #8
    updateRatio();        // ask #5
  }

  function drawBands(){
    var hb=harvestBand(), lb=latBand(), pb=physBand();
    ctx.save();
    var gh=ctx.createLinearGradient(0,hb.top,0,hb.bot);
    gh.addColorStop(0,'rgba(70,90,60,0.12)'); gh.addColorStop(1,'rgba(70,90,60,0.03)');
    ctx.fillStyle=gh; ctx.fillRect(0,hb.top,W,hb.bot-hb.top);
    var g1=ctx.createLinearGradient(0,lb.top,0,lb.bot);
    g1.addColorStop(0,'rgba(40,55,90,0.10)'); g1.addColorStop(1,'rgba(40,55,90,0.02)');
    ctx.fillStyle=g1; ctx.fillRect(0,lb.top,W,lb.bot-lb.top);
    var g2=ctx.createLinearGradient(0,pb.top,0,pb.bot);
    g2.addColorStop(0,'rgba(90,70,40,0.05)'); g2.addColorStop(1,'rgba(90,70,40,0.12)');
    ctx.fillStyle=g2; ctx.fillRect(0,pb.top,W,pb.bot-pb.top);
    ctx.fillStyle='rgba(180,190,210,0.5)'; ctx.font='10px Segoe UI';
    ctx.fillText('HARVEST ↑  (descendants / cultural spill / action-spaces unlocked — the net latent→physical outcome)', 12, hb.top-4);
    ctx.fillText('LATENT  (parents → weld → child / theories)', 12, lb.top-4);
    ctx.fillText('PHYSICAL ↓  (actors / institutions / forcing)', 12, pb.top-4);
    ctx.restore();
  }

  function blob(x,y,r,color,op,fuzz,glow){
    if(!(op>0.012)) return; // NaN-safe: !(NaN>x) is true, so a NaN op can never draw (NaN alpha would silently inherit the previous fillStyle)
    ctx.save();
    var spread = r*(1+fuzz*1.4);
    var g=ctx.createRadialGradient(x,y,0,x,y,spread);
    g.addColorStop(0, rgba(color, op*(0.85)));
    g.addColorStop(0.45, rgba(color, op*0.45*(1-fuzz*0.5)));
    g.addColorStop(1, rgba(color,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,spread,0,7); ctx.fill();
    if(fuzz<0.45){ ctx.beginPath(); ctx.fillStyle=rgba(color,op); ctx.arc(x,y,r*0.42,0,7); ctx.fill(); }
    if(glow>0){ ctx.strokeStyle=rgba('#fff', op*glow*0.5); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y,spread*0.7,0,7); ctx.stroke(); }
    ctx.restore();
  }

  // ask #1: a subtle FEEDBACK arc from harvest items back DOWN into the physical band
  // (the action-space-expanding loop: harvest re-enters the world and re-arms the action space).
  function drawFeedbackArcs(){
    var pb=physBand();
    M.nodes.forEach(function(n){
      if(n.harvestKind!=='aspace' || n.op<=0.10) return;
      var x0=n.x, y0=n.y, x1=M.child? M.child.x : x0, y1=pb.top+8;
      ctx.save();
      ctx.globalAlpha = clamp(n.op*0.5,0,0.5);
      ctx.strokeStyle=rgba(ASPACE_COL,0.5); ctx.lineWidth=1; ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(x0,y0);
      ctx.bezierCurveTo(x0+40, y0+60, x1-40, y1-60, x1, y1);
      ctx.stroke(); ctx.setLineDash([]);
      // arrowhead into physical band
      ctx.fillStyle=rgba(ASPACE_COL,0.6);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-3,y1-6); ctx.lineTo(x1+3,y1-6); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
  }

  function drawNodes(){
    M.nodes.forEach(function(n){
      if(n.op<=0.01) return;
      if(n.role==='parent' && n.absorbT>0.5) return;   // absorbed parents drawn by drawAbsorption
      var r=radOf(n);
      var fuzz = 1 - clamp(n.confidence,0,1);
      var col = frameColor(n.frame);
      if(n.role==='relative' && n.relation==='rival') col='#d2504a';
      if(n.candidate) col='#d28a4a';
      if(n.harvestKind==='cultural') col=cultStyle(n.domain).col;
      if(n.harvestKind==='aspace') col=ASPACE_COL;
      var glow=0;
      if(n.role==='child'){ glow = M.surpriseConf*0.55; }
      blob(n.x,n.y,r,col,n.op,fuzz,glow);
      // cultural-harvest icon
      if(n.harvestKind==='cultural' && n.op>0.2){
        ctx.fillStyle=rgba('#0c0f16', n.op); ctx.font='11px Segoe UI'; ctx.textAlign='center';
        ctx.fillText(cultStyle(n.domain).icon, n.x, n.y+4); ctx.textAlign='left';
      }
      // rival ghost outline once faded
      if(n.role==='relative'&&n.relation==='rival'&&rivalFade(n)<0.4){
        ctx.save(); ctx.globalAlpha=clamp(n.op+0.15,0,0.6); ctx.setLineDash([3,3]);
        ctx.strokeStyle=rgba('#d2504a',0.7); ctx.lineWidth=1; ctx.beginPath(); ctx.arc(n.x,n.y,r*0.9,0,7); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
      if((r>15 || hover===n) && n.op>0.25){
        ctx.fillStyle=rgba('#e8edf6', clamp(n.op,0,1));
        ctx.font=(n.role==='child'?'bold 12px':'11px')+' Segoe UI';
        ctx.textAlign='center';
        ctx.fillText(snip(n.name, n.role==='child'?42:26), n.x, n.y+r+13);
        ctx.textAlign='left';
      }
    });
  }

  // ask #8: ENCOMPASS / ABSORPTION. parents become lobes inside the child membrane,
  // scaled by load_bearing_share, with STUBS (receptor-hook spikes) poking through.
  function drawAbsorption(){
    var child=M.child; if(!child) return;
    var anyAbsorbing = M.parents.some(function(p){return p.absorbT>0.05;});
    if(!anyAbsorbing) return;
    var rc = radOf(child);
    // draw the child's membrane ring (encompassing)
    ctx.save();
    var memOp = clamp(child.op,0,1);
    M.parents.forEach(function(p){
      if(p.absorbT<=0.05) return;
      var t=p.absorbT;
      var share = (p.loadShare!=null)? p.loadShare : (1/Math.max(1,M.parents.length))*0.7;
      var lobeR = clamp(rc * (0.30 + share*0.9), 6, rc*0.85);   // lobe size scaled by load-bearing share
      // lobe sits inside the membrane along its angle
      var off = rc*0.45*(1 - t*0.5);
      var lx = child.x + Math.cos(p.lobeAngle)*off;
      var ly = child.y + Math.sin(p.lobeAngle)*off;
      var col = frameColor(p.frame);
      var op = clamp(child.op*0.85*t,0,0.85);
      // lobe blob (inside)
      var g=ctx.createRadialGradient(lx,ly,0,lx,ly,lobeR);
      g.addColorStop(0,rgba(col,op*0.9)); g.addColorStop(0.6,rgba(col,op*0.4)); g.addColorStop(1,rgba(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,ly,lobeR,0,7); ctx.fill();
      // STUB poking out through the membrane (receptor-hook / procedural root persists)
      var sx = child.x + Math.cos(p.lobeAngle)*rc;
      var sy = child.y + Math.sin(p.lobeAngle)*rc;
      var ex = child.x + Math.cos(p.lobeAngle)*(rc + 10 + share*16);
      var ey = child.y + Math.sin(p.lobeAngle)*(rc + 10 + share*16);
      ctx.strokeStyle=rgba(col, clamp(child.op*t,0,0.9)); ctx.lineWidth=clamp(2+share*4,2,6);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.fillStyle=rgba(col, clamp(child.op*t,0,0.9)); ctx.beginPath(); ctx.arc(ex,ey,clamp(2+share*3,2,5),0,7); ctx.fill();
      // tiny stub label
      if(t>0.6 && child.op>0.4){
        ctx.fillStyle=rgba('#cdd6e8',clamp(child.op*0.8,0,0.8)); ctx.font='9px Segoe UI';
        ctx.textAlign=(Math.cos(p.lobeAngle)<0?'right':'left');
        ctx.fillText(snip(p.name,18), ex+(Math.cos(p.lobeAngle)<0?-3:3), ey+3); ctx.textAlign='left';
      }
    });
    // membrane ring on top
    ctx.globalAlpha=memOp*0.5; ctx.strokeStyle=rgba(frameColor(child.frame),0.7); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(child.x,child.y,rc,0,7); ctx.stroke();
    ctx.restore();
  }

  function drawActors(){
    M.actors.forEach(function(a){
      if(a.op<=0.01) return;
      var col=KIND_COL[a.kind]||'#cdd6e8';
      var big = (a.kind==='government'||a.kind==='institution'||a.kind==='company'||a.kind==='state'||a.kind==='university');
      var s = big?13:9;
      var dead = (a.died!=null && year>=a.died);
      ctx.save();
      ctx.globalAlpha=a.op;
      if(dead){ ctx.strokeStyle=rgba(col,a.op); ctx.lineWidth=1.4; roundRect(a.x-s,a.y-s,s*2,s*2,3); ctx.stroke(); }
      else { ctx.fillStyle=col; roundRect(a.x-s, a.y-s, s*2, s*2, 3); ctx.fill(); }
      ctx.globalAlpha=a.op*0.9; ctx.fillStyle=dead?rgba(col,a.op):'#0c0f16'; ctx.font='9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText(initials(a.name), a.x, a.y+3);
      ctx.globalAlpha=a.op; ctx.fillStyle=rgba('#aab4cc',a.op); ctx.font='9.5px Segoe UI';
      if(a.op>0.45) ctx.fillText(snip(a.name,18), a.x, a.y+s+11);
      ctx.textAlign='left'; ctx.restore();
    });
  }

  function drawStems(){
    M.stems.forEach(function(st){
      var n=st.node, a=st.actor;
      if(n.op<=0.05 || a.op<=0.05) return;
      if(year < (a.born-1)) return;
      var op = Math.min(n.op,a.op)*st.conf*0.7;
      ctx.save();
      ctx.strokeStyle=rgba('#9fb3d8', op);
      ctx.lineWidth = clamp(st.strength*3,0.5,3.5);
      ctx.beginPath(); ctx.moveTo(n.x,n.y);
      var mx=(n.x+a.x)/2;
      ctx.bezierCurveTo(mx,n.y+30, mx,a.y-30, a.x,a.y); ctx.stroke();
      ctx.restore();
    });
  }

  function drawEdges(){
    M.edges.forEach(function(e){
      var a=e.a,b=e.b;
      if(a.op<=0.04||b.op<=0.04) return;
      // ask #7 FIX: parent->child weld edge stays VISIBLE & BRIGHT through the weld-fire window,
      // not gated purely on the still-ramping child opacity.
      if(e.kind==='parent'){
        var near = M.weldOpen? 0 : clamp(1-Math.abs(year-M.weldFire)/8,0,1);
        var baseOp = Math.min(a.op,b.op);
        var op = Math.max(baseOp*0.5, near*0.9);
        ctx.save();
        ctx.strokeStyle=rgba(near>0.3?'#bfe0ff':'#5d7bb0', op);
        ctx.lineWidth = 1 + near*2.4;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        if(near>0.5){  // bright spark at fire
          ctx.strokeStyle=rgba('#ffffff', (near-0.5)*1.2*op); ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
        ctx.restore();
        return;
      }
      ctx.save();
      if(e.kind==='attract'||e.kind==='harvest'){
        ctx.strokeStyle=rgba(e.kind==='harvest'?'#5e9c78':'#5d7bb0', Math.min(a.op,b.op)*0.3);
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      } else {
        var rivOp = Math.min(a.op,b.op)*0.5;
        ctx.strokeStyle=rgba(e.adversarial?'#d2504a':'#c98a4a', rivOp);
        ctx.setLineDash([5,4]); ctx.lineWidth=1.3;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    });
  }

  function drawForcing(){

    if(!M.child) return;

      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,radOf(c)*2.6,0,7); ctx.fill();

  // ask #5: sharp/fuzzy meter as AGNOSTIC-UNITS frame-relative ratio (normalized certain-mass)
  function updateRatio(){
    var vis = M.nodes.filter(function(n){return n.op>0.06;});
    var sharp=0, total=0;
    vis.forEach(function(n){
      var rConf = ratio(n.confidence, M.normFrames.conf);   // frame-relative ratio in [0,1]
      var rMass = ratio(n.size, M.normFrames.size) + 0.15;  // floor so tiny nodes still count
      total += rMass;
      sharp += rMass * rConf;
    });
    var pct = total? Math.round(sharp/total*100):0;
    var el=document.getElementById('ratio');
    el.innerHTML = '<b>sharp / fuzzy</b> <span class="note">('+vis.length+' on screen)</span>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="note">'+pct+'% agnostic-ratio certain-mass</div>'+
      '<div class="note dim" id="ratioTip">frame-relative ratio (per-specimen [min,max] norm); '+
      'NOT MDL/gain_v2 bits — none exist for these specimens. blobs are gaussian splats, not wavelets.</div>';
  }

  // =====================================================================
  // GLOBAL VIEW (ask #6): all 7 specimens as swimlanes on one absolute-year axis
  // =====================================================================
  function buildGlobal(){
    var models={};
    ORDER.forEach(function(k){ models[k]=buildModel(k); if(globalOff[k]===undefined) globalOff[k]=false; });
    var amin=4000,amax=0;
    ORDER.forEach(function(k){ var r=models[k].range; if(r[0]<amin)amin=r[0]; if(r[1]>amax)amax=r[1]; });
    amax=Math.max(amax,NOW);
    GLOBAL={models:models, range:[amin,amax]};
  }
  function globalLanes(){
    var on=ORDER.filter(function(k){return !globalOff[k];});
    var top=H*0.08, bot=H*0.93;
    var lanes={}; var n=on.length||1;
    on.forEach(function(k,i){ lanes[k]={ y0: top + i/n*(bot-top), y1: top + (i+1)/n*(bot-top) }; });
    return {lanes:lanes, on:on};
  }
  function gYearX(y){ var r=GLOBAL.range; var pad=110; return pad + (clamp(y,r[0],r[1])-r[0])/(r[1]-r[0])*(W-2*pad); }

  function stepGlobal(dt){
    if(!GLOBAL) buildGlobal();
    cam.x=lerp(cam.x,cam.tx,0.08); cam.y=lerp(cam.y,cam.ty,0.08); cam.s=lerp(cam.s,cam.ts,0.08);
  }

  function renderGlobal(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    if(!GLOBAL) buildGlobal();
    var L=globalLanes();
    // grid: decade ticks
    ctx.save();
    ctx.strokeStyle='rgba(40,50,74,0.6)'; ctx.fillStyle='rgba(139,151,173,0.7)'; ctx.font='9px Segoe UI';
    var r=GLOBAL.range; var step=(r[1]-r[0])>240?50:20;
    for(var yy=Math.ceil(r[0]/step)*step; yy<=r[1]; yy+=step){
      var x=gYearX(yy); ctx.beginPath(); ctx.moveTo(x,H*0.05); ctx.lineTo(x,H*0.95); ctx.stroke();
      ctx.fillText(yy, x-10, H*0.045);
    }
    ctx.restore();
    // NOW line
    var nx=gYearX(NOW);
    ctx.save(); ctx.strokeStyle='rgba(127,214,192,0.7)'; ctx.lineWidth=1.6; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(nx,H*0.05); ctx.lineTo(nx,H*0.95); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#7fd6c0'; ctx.font='bold 10px Segoe UI'; ctx.fillText('NOW '+NOW_LABEL, nx+4, H*0.05); ctx.restore();

    L.on.forEach(function(k){
      var lane=L.lanes[k]; var m=GLOBAL.models[k];
      var midY=(lane.y0+lane.y1)/2;
      var laneH=lane.y1-lane.y0;
      // lane label + frame chip
      ctx.save();
      ctx.fillStyle='rgba(20,26,38,0.5)'; ctx.fillRect(0,lane.y0+1,W,laneH-2);
      ctx.fillStyle='#cdd6e8'; ctx.font='bold 11px Segoe UI'; ctx.fillText(LABELS[k]||k, 8, midY-laneH*0.28);
      ctx.restore();
      // weld-span bar
      var x0=gYearX(m.weldStart), x1=gYearX(m.weldOpen?NOW:m.weldFire);
      ctx.save();
      ctx.strokeStyle='rgba(127,179,255,0.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x0,midY); ctx.lineTo(x1,midY); ctx.stroke();
      ctx.restore();
      // nodes: each plotted at born-year x, normalized size/opacity (agnostic ratio)
      m.nodes.forEach(function(n){
        if(observer!=='all'){ var fr=arr(n.frame).map(lc); if(fr.indexOf(observer)<0) return; }
        // depth gate applies globally
        if(n.role!=='child'){
          var dist=(n.role==='parent')?0.34:(n.role==='root')?0.85:(n.harvestKind?0.7:0.9);
          if(depth<dist) return;
          if(num(n.confidence,0.6) < (1-depth)*0.85) return;
        }
        var x=gYearX(n.born);
        var rNorm = ratio(n.size, m.normFrames.size);          // NORMALIZED size (ask #6)
        var rr = 2 + rNorm*7;
        var yy2 = midY + ((n.born*7)%(laneH*0.7)) - laneH*0.35;
        if(n.role==='child') yy2=midY+laneH*0.02;
        var col = frameColor(n.frame);
        if(n.role==='relative'&&n.relation==='rival') col='#d2504a';
        if(n.harvestKind==='cultural') col=cultStyle(n.domain).col;
        if(n.harvestKind==='aspace') col=ASPACE_COL;
        var opN = 0.25 + ratio(n.confidence, m.normFrames.conf)*0.7;   // NORMALIZED opacity
        // rival fade in absolute time
        if(n.role==='relative'&&n.relation==='rival'&&!m.weldOpen && NOW>m.weldFire){ opN *= 0.45; }
        if(n.role==='child') rr=Math.max(rr,7);
        ctx.save(); ctx.globalAlpha=clamp(opN,0,1);
        ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,yy2,rr,0,7); ctx.fill();
        if(n.role==='child'){ ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.2; ctx.stroke(); }
        ctx.restore();
      });
      // NOW-extension ticks
      m.nowItems.forEach(function(e){
        var x=gYearX(e.born);
        var col={harvest:'#46c07a',event:'#7fb3ff',revival:'#e0a838',decay:'#d2504a'}[e.kind]||'#7fb3ff';
        ctx.save(); ctx.globalAlpha=0.8; ctx.fillStyle=col;
        ctx.fillRect(x-1.5, lane.y1-7, 3, 5); ctx.restore();
      });
    });
    // header note
    ctx.save(); ctx.fillStyle='rgba(139,151,173,0.85)'; ctx.font='10px Segoe UI';
    ctx.fillText('GLOBAL — all specimens on shared absolute-year axis; sizes/opacities NORMALIZED per-specimen to agnostic ratios (disclosed). depth + observer apply globally. toggle chips below.', 8, H*0.985);
    ctx.restore();
  }

  // ---------- picking / tooltip ----------
  function pickAt(mx,my){
    if(mode==='global') return pickGlobal(mx,my);
    var wx=(mx-W/2)/cam.s+cam.x, wy=(my-H/2)/cam.s+cam.y;
    var best=null,bd=1e9;
    M.nodes.forEach(function(n){ if(n.op<=0.04)return; var dx=n.x-wx,dy=n.y-wy,d=Math.sqrt(dx*dx+dy*dy);
      if(d<radOf(n)+6 && d<bd){bd=d;best=n;} });
    M.actors.forEach(function(a){ if(a.op<=0.04)return; var dx=a.x-wx,dy=a.y-wy,d=Math.sqrt(dx*dx+dy*dy);
      if(d<16 && d<bd){bd=d;best=a;} });
    return best;
  }
  function pickGlobal(mx,my){
    var L=globalLanes(), best=null, bd=1e9;
    L.on.forEach(function(k){
      var m=GLOBAL.models[k], lane=L.lanes[k], laneH=lane.y1-lane.y0, midY=(lane.y0+lane.y1)/2;
      m.nodes.forEach(function(n){
        var x=gYearX(n.born);
        var yy2 = (n.role==='child')? midY+laneH*0.02 : midY + ((n.born*7)%(laneH*0.7)) - laneH*0.35;
        var dx=x-mx, dy=yy2-my, d=Math.sqrt(dx*dx+dy*dy);
        if(d<8 && d<bd){ bd=d; best=n; best._spec=k; }
      });
    });
    return best;
  }

  function lifeStrip(life){
    if(!life) return '';
    var bits=[];
    if(life.conceived) bits.push('conceived '+life.conceived);
    if(life.born) bits.push('born '+life.born);
    if(life.founded) bits.push('founded '+life.founded);
    if(life.formulated) bits.push('formulated '+life.formulated);
    if(life.named) bits.push('named '+life.named);
    if(life.died) bits.push('died '+life.died);
    if(life.dissolved) bits.push('dissolved '+life.dissolved);
    if(!bits.length) return '';
    return '<div class="k" style="margin-top:3px;color:#9fd6c0">lifecycle: '+esc(bits.join('  →  '))+'</div>'+
      (life._note?'<div class="k">'+esc(snip(life._note,160))+'</div>':'');
  }

          '<div class="k">conf '+ (n.confidence!=null?n.confidence.toFixed(2):'?')+
          ' · size '+num(n.size,0).toFixed(1)+' · solidity '+clamp(n.solidity,0,1).toFixed(2)+
          ' · born '+Math.round(n.born)+(n._spec?(' · ['+(LABELS[n._spec]||n._spec)+']'):'')+'</div>'+
          (arr(n.frame).length?'<div class="k">frame: '+esc(arr(n.frame).join(', '))+'</div>':'')+
          lifeStrip(n.life)+
          (n.dnaBasis?'<div class="k" style="color:#cbd">DNA basis: '+esc(snip(n.dnaBasis,160))+'</div>':'')+
          (n.harvestNote?'<div class="k">'+esc(snip(n.harvestNote,160))+'</div>':'');
      }
      tip.innerHTML=html;
      var tx=mx+14, ty=my+14;
      if(tx>W-340)tx=mx-340; if(ty>H-120)ty=my-120;
      tip.style.left=tx+'px'; tip.style.top=ty+'px';
    } else tip.style.display='none';
  });
  cv.addEventListener('mouseleave', function(){ hover=null; tip.style.display='none'; });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function rgba(hex,a){
    if(hex[0]==='#'){ var h=hex.slice(1); if(h.length===3)h=h.replace(/./g,function(c){return c+c;});
      var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
      return 'rgba('+r+','+g+','+b+','+clamp(a,0,1)+')'; }
    return hex;
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function initials(name){ var p=String(name||'').replace(/[^A-Za-z &]/g,'').split(/[\s&]+/).filter(Boolean);
    return ((p[0]||'?')[0]+ (p[1]?p[1][0]:'')).toUpperCase(); }

  function updateYearLabel(){ document.getElementById('yr').textContent=Math.round(year); }
  function syncScrub(){ if(!M) return; var s=(year-M.range[0])/(M.range[1]-M.range[0])*100; document.getElementById('scrub').value=s; updateYearLabel(); }

  // ---------- controls ----------
  document.getElementById('scrub').addEventListener('input', function(){
    if(!M) return; year = M.range[0] + this.value/100*(M.range[1]-M.range[0]); updateYearLabel();
  });
  function togglePlay(v){ playing = (v==null)? !playing : v;
    document.getElementById('play').innerHTML = playing? '&#10073;&#10073; Pause' : '&#9654; Play';
    document.getElementById('play').classList.toggle('on',playing);
  }
  document.getElementById('play').addEventListener('click', function(){ if(M && year>=M.range[1]) {year=M.range[0];} togglePlay(); });
  document.getElementById('mag').addEventListener('input', function(){ magK=this.value/100; });
  document.getElementById('mir').addEventListener('input', function(){ mirThresh=this.value/100; });
  document.getElementById('depth').addEventListener('input', function(){ depth=this.value/100;
    document.getElementById('depthVal').textContent=(depth<0.34?'child':depth<0.7?'+parents':depth<0.85?'+harvest':'full')+' ('+Math.round(depth*100)+'%)'; });
  document.getElementById('observer').addEventListener('change', function(){ observer=this.value; });
  document.querySelectorAll('header .tog[data-layer]').forEach(function(b){
    b.addEventListener('click', function(){ layerFilter=b.dataset.layer;
      document.querySelectorAll('header .tog[data-layer]').forEach(function(x){x.classList.toggle('on',x===b);}); });
  });
  document.getElementById('nowBtn').addEventListener('click', function(){ if(M){ year=NOW; syncScrub(); } });
  document.getElementById('globalBtn').addEventListener('click', function(){
    if(mode==='global'){ document.getElementById('gchips').style.display='none';
      document.getElementById('ratio').style.display='block';
      selectSpecimen(ORDER.indexOf('maxwell')>=0?'maxwell':ORDER[0]); }
    else enterGlobal();
  });

  (function(){
    var pk=document.getElementById('pickers');
    ORDER.forEach(function(k){ var b=document.createElement('button'); b.className='pick'; b.dataset.k=k;
      b.textContent=LABELS[k]||k; b.onclick=function(){ selectSpecimen(k); }; pk.appendChild(b); });
    document.querySelector('header .tog[data-layer="both"]').classList.add('on');
  })();

  function boot(){
    resize();
    if(ORDER.length && !M){ selectSpecimen(ORDER.indexOf('maxwell')>=0?'maxwell':ORDER[0]); }
    document.getElementById('depthVal').textContent='full (100%)';
    requestAnimationFrame(frame);
  }
  if(document.readyState==='complete' || document.readyState==='interactive'){ boot(); }
  else { window.addEventListener('DOMContentLoaded', boot); }
})();
/*APP_END*/
</script>
