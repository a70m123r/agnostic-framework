ternational high-energy theory","relation":"child-A (string) originators","confidence":0.9},{"who":"Amitabha Sen, Abhay Ashtekar, Ted Jacobson, Carlo Rovelli, Lee Smolin","role":"Ashtekar 'new variables' (1986, on Sen 1981) + the loop representation + discrete area/volume (1994-95) — founders of the CANONICAL / LQG child. NOTE: Rovelli is ALSO the field's main HISTORIAN (source of this specimen's backbone) — a reflexivity worth flagging (the narrator is a partisan of one child).","when":"1981-1995","where":"India / USA / France / etc.","culture":"international gravitational physics","relation":"child-B (LQG) originators (Rovelli also = historian, reflexivity flag)","confidence":0.9},{"who":"Juan Maldacena & Leonard Susskind","role":"Holographic principle / AdS/CFT (Maldacena 1997) / ER=EPR (Maldacena-Susskind 2013) — the harvest GRANDCHILD that overgrew its parent program. Maldacena 1997 is among the most-cited papers in theoretical physics.","when":"1993-2013","where":"Argentina / USA (Princeton / Stanford)","culture":"international high-energy theory","relation":"descendant-originators (the grandchild)","confidence":0.9}]},"harvest":{"_comment":"UP, in the LATENT + CULTURAL frame. NOTE the inversion characteristic of a frontier weld: the harvest is LUSH even though the child is unborn — the search spawned a whole forest of descendant programs and one grandchild (holography) that arguably outgrew the parents, all WITHOUT a settled W_C. A weld can be barren at the trunk and fertile in the canopy.","descendants":[{"name":"String theory -> superstrings -> M-theory","what":"The dominant COVARIANT child: the 5 superstring theories unified by dualities into M-theory (Witten 1995). The by-headcount-largest program — but accused of dropping background-independence and of being unfalsifiable (see whig-vs-revisionist discrepancy).","frame":["space","time","knowledge"],"confidence":0.7,"_confidence_note":"Confidence here = 'this is a real, serious descendant program', NOT 'this is the correct child' (which is contested)."},{"name":"Loop quantum gravity -> spin foam models + loop quantum cosmology","what":"The CANONICAL child: discrete quantum geometry (granular space, discrete area/volume), with spin foams as its covariant form and loop quantum cosmology (bouncing-universe scenarios) as its cosmological wing.","frame":["space","time","knowledge"],"confidence":0.68},{"name":"Sum-over-histories line: causal dynamical triangulations (CDT), causal set theory, Euclidean / Hartle-Hawking quantum cosmology","what":"The third lineage: path-integral-over-geometries descendants — CDT (Ambjorn-Loll), causal sets (Sorkin et al.), and the no-boundary 'wave function of the universe' (Hartle-Hawking 1983).","frame":["space","time","knowledge"],"confidence":0.6},{"name":"Holographic principle -> AdS/CFT -> 'spacetime emergent from entanglement' (THE richest grandchild)","what":"Born FROM the black-hole-entropy face of S: holographic principle ('t Hooft 1993, Susskind 1995) -> AdS/CFT correspondence (Maldacena 1997) -> Ryu-Takayanagi, ER=EPR (Maldacena-Susskind 2013) -> celestial holography. A descendant that arguably OUTGREW the parent program and now feeds BACK into quantum-information and condensed-matter physics. The single most successful thing the search produced.","frame":["space","knowledge","time"],"confidence":0.8,"_confidence_note":"Higher confidence (0.8) than the candidate children themselves, because AdS/CFT is a CONCRETE, calculationally-validated correspondence (a realized unification), not a candidate-for-the-final-child."},{"name":"Effective field theory of gravity (Donoghue) — the modest, AGREED descendant","what":"Treats GR as a low-energy EFT and computes leading quantum corrections without resolving the UV. The part of the weld that DOES work and is UNCONTROVERSIAL across all camps — the quiet success amid the contested grand programs.","frame":["space","knowledge"],"confidence":0.85,"_confidence_note":"Highest descendant confidence: EFT-of-gravity is uncontested and computationally validated; everyone agrees it is correct as far as it goes."},{"name":"Quantum-gravity phenomenology (adjacent field seeded, born ~1997)","what":"The attempt to make the frontier EMPIRICAL: Planck-scale Lorentz-violation tests, gamma-ray-burst photon timing, tabletop entanglement-of-gravity experiments (Bose-Marletto-Vedral 2017 proposal).","frame":["space","time","knowledge"],"confidence":0.65}],"cultural_harvest":[{"domain":"scifi","what":"WORMHOLES (Einstein-Rosen bridges — the 'ER' of ER=EPR) as the central device of Carl Sagan's 'Contact' (1985, with Kip Thorne consulting) and Christopher Nolan's 'Interstellar' (2014, Thorne again — the black-hole 'Gargantua' render became an actual physics paper)."},{"domain":"scifi","what":"The SIMULATION / HOLOGRAPHIC-UNIVERSE trope ('reality is a projection from a lower-dimensional boundary') diffused from the holographic principle into popular culture, fiction, and philosophy-of-mind speculation."},{"domain":"art","what":"Planck-scale 'spacetime foam' and 'granular space' imagery (Wheeler's 'quantum foam'; the LQG spin-network mesh) recur in science-art visualizations and museum installations as the visual shorthand for 'the smallest scale'."},{"domain":"other","what":"The very phrase 'Theory of Everything' (popularized around the string program) became a cultural target — book/film 'The Theory of Everything', and the framing of physics as a quest for one final unifying equation."}]},"relatives":{"_comment":"WIDE edges (OPTIONAL group, flagged in SCHEMA.md §5). Cousins / influences / siblings / rivals spanning the physical AND latent. For QG, the most important WIDE edges are the RIVAL CANDIDATE CHILDREN themselves — which is exactly the anomaly: in a settled convergence the children are descendants (UP); here the 'children' behave like RIVALS (WIDE), because none is THE child. This mis-placement is a symptom of the missing rival-children variable.","edges":[{"name":"Asymptotic safety (Weinberg's program)","relation":"cousin","frame":["space","knowledge"],"confidence":0.6,"note":"A fourth candidate line: gravity may be non-perturbatively renormalizable via a UV fixed point. A cousin-weld over the same seam S, keeping QFT methods but seeking a non-trivial fixed point."},{"name":"Twistor theory (Penrose)","relation":"cousin","frame":["space","knowledge"],"confidence":0.55,"note":"Penrose's alternative geometric substrate; a cousin-line that re-encodes spacetime in twistor space, later feeding amplitude methods (twistor strings, amplituhedron)."},{"name":"Noncommutative geometry (Connes)","relation":"cousin","frame":["space","knowledge"],"confidence":0.5,"note":"A cousin approach in which spacetime coordinates fail to commute at the Planck scale — another way to grant geometry quantum structure."},{"name":"Semiclassical gravity (Rosenfeld -> Mattingly)","relation":"rival","frame":["space","knowledge"],"confidence":0.45,"note":"The DISSENTING rival that denies the weld is needed at all: quantum matter coupled to CLASSICAL spacetime. If correct, there IS no child — W_C is a category error. The falsifier-of-the-weld. (See discrepancies.)"},{"name":"Electroweak / strong-force unification (the prior unifications)","relation":"sibling","frame":["knowledge"],"confidence":0.8,"note":"The SETTLED siblings: EM+weak -> electroweak (Glashow-Weinberg-Salam) and the strong force in the Standard Model are the welds that DID consummate, against which gravity's stubborn non-fusion stands out. The contrast is the point: same kind of unification ambition, opposite outcome."},{"name":"LCAO / Molecular Orbital Theory (Phase-1 convergence #1)","relation":"cousin","frame":["space","knowledge"],"confidence":0.7,"note":"STRUCTURAL cousin across the Phase-1 DB: LCAO is the SETTLED orbital-superposition weld (two orbitals -> one MO, closed-form). QG is the UNsettled superposition-of-frameworks weld at the spacetime substrate. LCAO shows what a consummated version of this kind of weld looks like; QG is its frontier mirror. This is the cleanest link back to the extends-target."}]},"fuzzy_layer":{"_comment":"The trunk/frontier partition. For THIS specimen the partition is unusually inverted: the PARENTS and the SEAM are certain core, but the CHILD — normally the trunk's crown — is itself in the frontier (it is a conjecture). So the certain core is the LOWER half of the tree (parents + seam + deep shared roots), and the frontier is BOTH the deep people-roots AND the entire would-be canopy (the child + rival children). A conjecture = a low-confidence weld drawn but not confirmed; here the whole child IS that conjecture.","certain_core":["W_A = General Relativity (parent, 0.99) — experimentally confirmed.","W_B = Quantum Mechanics / QFT (parent, 0.99) — most precisely tested theory in physics.","The seam S exists and is genuine (Planck scale / graviton / black-hole entropy S=A/4 / singularities) — agreed across all camps (0.9).","Black-hole entropy S=A/4 (Bekenstein-Hawking) is a real, hard, shared constraint (0.93).","GR is perturbatively non-renormalizable ('t Hooft-Veltman 1973; Goroff-Sagnotti 1985-86) — a confirmed no-go (0.9).","The field-level dormancy 1970-1983 and the 1984-94 two-sided revival are well-documented (0.85).","SOME reconciliation/effective description is needed in regime S — even dissenters agree quantum matter and gravity must be jointly describable somehow (effective field theory of gravity works) (0.85).","The action principle and symmetry/group theory are shared deep roots of BOTH parents (0.8-0.85)."],"frontier":["THE CHILD ITSELF: 'quantum gravity' as a single settled W_C — a ~90-year-old open conjecture; may never consolidate or may be the wrong question (0.4). The crown of the tree is in the frontier — the specimen's signature.","Which candidate is the right child (string vs LQG vs causal sets vs asymptotic safety vs ...) — unresolved; sociologically loaded (0.3-0.7 spread, no winner).","Whether the weld is even NEEDED (semiclassical-gravity dissent) — a live minority position that there is no child (0.45).","Bronstein as 'first quantum-gravitist' — contested priority, recently reconstructed history (0.8 but disputed).","The exact span of the spin-network dormancy (1964 vs 1971 start; ~20 vs ~25 years) — date conflict across sources (0.7).","Deep tooling roots (spin networks, CFT/Calabi-Yau, knot theory, TQFT becoming load-bearing) — medium confidence, lineage-specific (0.7-0.75).","Quantum-gravity phenomenology yielding any empirical signal — aspirational frontier (0.5-0.65).","The Wikidata structured influence-graph for QG — NOT cleanly harvested this pass (only adjacents confirmed); a provenance gap (low confidence in the structured-graph backbone)."]},"discrepancies":[{"_comment":"THE central framework-vs-record tension and the single most valuable row in the specimen.","what":"The schema renders parents -> ONE child W_C, but the real record has TWO-plus RIVAL proposed children over the SAME two parents and the SAME seam S — string/M-theory (covariant line), loop quantum gravity (canonical line), and the sum-over-histories descendants (causal sets, CDT, spin foams), plus asymptotic safety, twistors, noncommutative geometry. They are NOT sub-welds of one pushout; they DISAGREE about what the child even is and call each other's child the wrong question. The schema has NO slot for 'a weld with multiple competing, mutually-rejecting candidate outputs and no winner'.","sources_in_conflict":["SEP 'Quantum Gravity'","Rovelli gr-qc/0006061 (canonical-line partisan)","Schwarz arXiv:1201.0981 (string-line participant)","'Contested Boundaries: The String Theory Debates' (MIT Press)"],"type":"framework-vs-record-tension","why_interesting":"Exposes the schema's missing CONTESTED-WELD / RIVAL-CHILDREN variable. The 9 settled convergences each had ONE child; QG is the control case where the same two parents + same S produce a FORK, not a fusion. Recommends adding {candidate_children[], unresolved:true, contest_axis} to the weld. QG is the cleanest case making this blind spot visible.","confidence_impact":"Caps child-confidence at ~0.4 (there is no single child to be confident in); RAISES the value of the specimen as a schema-stress-test."},{"_comment":"Which parent dominates the weld is itself the fault line.","what":"The DIRECTION of the weld is disputed. Covariant/string line = QFT-method applied TO gravity (perturbative graviton on a fixed background; W_B's machinery SWALLOWS W_A) and is accused by the other camp of NOT being background-independent. Canonical/LQG line = GR's background-independence is PRIMARY and QM is rebuilt on it (W_A SWALLOWS W_B). SEP: 'there is no firm definition of background independence on the table... two camps almost certainly talking past each other.'","sources_in_conflict":["SEP 'Quantum Gravity' (background-independence section)","Rovelli gr-qc/0006061","string-theory literature (Schwarz 1201.0981)"],"type":"contested-genealogy","why_interesting":"The shared sub-object S is AGREED, but the DIRECTION of the weld (which parent's kernel is kept vs reformed) is disputed — a variable the SYMMETRIC two-parent schema flattens. Suggests a weld needs a 'dominance_axis' / 'which_parent_reformed' field.","confidence_impact":"Splits the would-be child into direction-dependent variants; keeps frame_of_weld engaging {meaning} (the dispute is partly definitional)."},{"_comment":"Priority / origin of the FIELD — genuinely multi-origin.","what":"Rovelli (gr-qc/0006061) dates first awareness to Einstein 1916 (quantum effects must modify GR), Klein 1927 (QG modifies space-time concepts), Rosenfeld early-1930s (first technical papers). But the 'cube of theories' framing is credited to Gamow-Ivanenko-Landau (1928), DEVELOPED by Bronstein (1935 dissertation, 1936 papers). 'Graviton' first named ~1934 (Blokhintsev-Galperin). NO single founder.","sources_in_conflict":["Rovelli gr-qc/0006061","Wikipedia 'Quantum gravity'","Wikipedia 'Matvei Petrovich Bronstein'","Oriti 'Bronstein hypercube' arXiv:1803.02577"],"type":"priority-dispute","why_interesting":"The people-(0) ROOT is genuinely multi-origin and the canonical originator is contested — exactly the fuzzy deep-root frontier the schema predicts (low-confidence who-called-it at the base). Confirms the schema's expectation that confidence should fade in the deep roots.","confidence_impact":"Holds Bronstein/founder confidence at ~0.8; validates the certain-core->frontier gradient by example."},{"_comment":"Contested DORMANCY for an EXTERNAL/physical-frame reason.","what":"Matvei Bronstein's mid-1930s work (quantization of weak gravity; the realization that GR's mass-density bound forces rejecting Riemannian geometry and 'our ordinary concepts of space and time') was largely neglected for decades — partly because he was EXECUTED by the Soviet NKVD in Feb 1938 at age 32 (nephew of Trotsky). Reconstructed only recently (Stachel; Gorelik & Frenkel biography). Rovelli: in Russia remembered by some as 'smarter than Landau'.","sources_in_conflict":["Wikipedia 'Matvei Petrovich Bronstein'","Rovelli gr-qc/0006061","Gorelik & Frenkel biography (cited via Wikipedia)"],"type":"dormancy-contested","why_interesting":"A real-record example of a ROOT node going dormant for EXTERNAL (political/biographical, physical-frame) reasons, NOT internal-to-the-idea reasons — a dormancy cause the schema's 'why' field should TAG by frame (people-(0) deaths/purges can sever a lineage). Distinct in KIND from the field-level dormancy (knowledge-frame no-go theorems) and the spin-network dormancy (tool-orphaning).","confidence_impact":"Motivates a dormancy.why_frame tag (physical vs knowledge frame); does not move child-confidence but enriches the root layer."},{"_comment":"Naming/attribution conflict on the canonical line's keystone equation.","what":"DeWitt long called it the 'Einstein-Schrodinger equation' and attributed it to Wheeler; Wheeler called it the 'De ince the mid-1980s 'first/second superstring revolutions'; Witten (1995): 'the mathematics of the next millennium will be dominated by string theory.' Revisionist counter-narrative (Smolin 'The Trouble with Physics' 2006; Woit 'Not Even Wrong' 2006): unfalsifiable landscape, no Planck-scale predictions, SUSY non-appearance at the LHC. Rovelli (2016): 'the string planet is infinitely less arrogant than ten years ago.'","sources_in_conflict":["Witten (pro-string)","Smolin 'The Trouble with Physics'","Woit 'Not Even Wrong'","Rovelli gr-qc/0006061 and later remarks","'Contested Boundaries' (MIT Press HPS)"],"type":"whig-vs-revisionist","why_interesting":"The 'which proposed child is winning' judgment is SOCIOLOGICALLY loaded and has PARTIALLY REVERSED over time — a reminder that 'status' on a frontier weld is observer- and era-relative, not a view-from-nowhere fact. This is precisely why frame_of_weld here engages {meaning}: the weld's adjudication is happening in the social/meaning frame.","confidence_impact":"Keeps any single candidate-child's 'winning' confidence soft and era-relative; justifies the meaning-frame tag on the weld."}],"sources":[{"name":"Stanford Encyclopedia of Philosophy — 'Quantum Gravity'","type":"encyclopedia","url":"https://plato.stanford.edu/entries/quantum-gravity/","what_used_for":"Backbone for the conceptual structure: the seam S, background-independence dispute, the two-camps-talking-past framing, semiclassical dissent, problem of time.","reliability":0.95,"_reliability_comment":"high — peer-reviewed philosophy-of-physics reference."},{"name":"Rovelli, 'Notes for a brief history of quantum gravity', arXiv:gr-qc/0006061","type":"scholarly-history","url":"https://arxiv.org/pdf/gr-qc/0006061","what_used_for":"The field periodization (prehistory / classical age / middle ages / renaissance), dormancy-revival arc, spin-network and Bronstein stories, dates.","reliability":0.9,"_reliability_comment":"high but PARTISAN — scholarly history by a founde <script type="application/json" id="spec-keynesian" data-key="keynesian">{"_template_doc":"CANONICAL WRAPPER-GENEALOGY SPECIMEN — v2 render, one merge event as a rooted genealogy that STOPS AT THE PRESENT. Spec: ../SCHEMA_v2.md. Tier-3 exploratory data-harvest for Cowork+Pav ratification — NOT canon, NOT a promotion, convergence list stays 9. This specimen is a WORKED EXAMPLE / CALIBRATION INSTRUMENT chosen to HAMMER the five new v2 dimensions (D1 lifecycle+type; D2 actors-as-institutions/governments; D3 physical/latent layer filter; D4 exogenous forcing events; D5 graded-by-default), NOT a 10th convergence. The Keynesian case is the batch's crisis-pulled, government-adoption, multi-cycle-dormancy-and-reinterpretation specimen. Every node/edge carries SOFT confidence in [0,1] + a frame_layer (D3); welds carry a graded lifecycle+type (D1); actors carry carrier_of/inhabitant_of (D2); exogenous forces live in forcing_events[] (D4); graded membership is the default (D5). bits_note QUALITATIVE ONLY. Sources web-checked (see sources[]); framework-vs-record tensions flagged in discrepancies[].","schema_version":"0.2-canonical-genealogy","specimen_id":"keynesian-economics","_status":"Tier-3 WORKING specimen — exploratory data-harvest, surfaced for Cowork+Pav ratification. NOT canon, NOT a tier promotion, does NOT grow the convergence list (stays 9). All confidences are SOFT scores in [0,1]; bits are qualitative only. This is the CRISIS-PULLED + STATE-MOBILIZED + MULTI-CYCLE-DORMANCY worked example, used to STRESS-TEST v2's D1-D5 (the weld's whole lifecycle is paced by EXTERNAL crises — Depression births it, WWII consolidates it, stagflation buries it, the GFC and COVID exhume it twice into structurally different objects).","extends":{"_comment":"Linkage back to the Phase-1 wrapper CLASS this merge-event specimen instantiates (SCHEMA_v2.md §5). Same graph, deeper zoom. A SOCIAL-SCIENCE / economics instance of the parents-produce-W_C wrapper-overlap pattern; NOT itself a 10th ime — born, hardened, pronounced dead in the 1970s, and re-born as structurally DIFFERENT objects in 2008 and 2020 (child as a single stable wrapper ~0.55, mirroring R9 from a new direction); (b) the second parent ('classical economics') being substantially a STRAWMAN Keynes constructed (caps the clean two-parent rendering, ~0.6); (c) the durable taught object (IS-LM) being forged by the synthesizers, not Keynes (a re-attribution, ~0.8); (d) the weld's NECESSITY being disputed by a new-classical school that captured the discipline for a generation (~0.78). High-confidence core, honestly-fuzzy frontier — and the fuzz here is TEMPORAL (the child's identity drifts across decades) more than depth-wise.","schema_capabilities":{"_comment":"(D3+D5) Declared render capabilities. Static block — announces what a v2 render supports.","layer_filter":{"_comment":"(D3) The render is FILTERABLE on the physical/latent axis; actors are the bridge. Hand-checkable here: PHYSICAL view = Keynes, the Cambridge Circus, HM Treasury, the US Federal Government, the Fed/IMF/G20, the Great Depression/WWII/stagflation/GFC/COVID events. LATENT view = the General Theory child, the classical apparatus + underconsumption parents, the multiplier/liquidity-preference seam, the descendant schools (synthesis, post-Keynesian, monetarism, new-classical, New Keynesian, MMT).","supported":true,"axes":["physical","latent"],"bridge_via":"actors","note":"A render may show the PHYSICAL view (actors, institutions, places, events) OR the LATENT view (ideas, theories, sub-wrappers); every node declares frame_layer; actors straddle and connect the two."},"graded_membership":{"_comment":"(D5) Fuzzy edges by design — graded membership is the pervasive default. Heavily exercised here: the 'classical' parent is a graded straddle between a real wrapper and Keynes's caricature; 'Keynesianism' is a graded family of four mutually-critical wrappers; each forcing event's influence is a graded strength.","supported":true,"default":"graded","applies_to":["node membership","weld extent (sub_welds)","actor role-strength (carrier/inhabitant)","forcing-event influence (acted_on.strength)","frame-layer straddle (physical/latent membership)","lifecycle phase membership","weld_type weight"],"note":"Every boundary is a membership/confidence in [0,1]; the certain core is just where membership ~1.0. Crisp = the membership happens to be ~0/1."}},"child":{"_comment":"W_C — the emergent wrapper born in this merge. The trunk node. Corresponds to one Phase-1 wrapper_classes[] row, zoomed in. Its instability OVER TIME is the specimen's signature (see status_trajectory + discrepancies).","id":"child-keynesian-macro","name":"Keynesian macroeconomics / aggregate-demand management (demand-determined output with a state residual-demand-maker)","kernel":"The redefinition of the economy as an aggregate SYSTEM whose total output and employment are DEMAND-determined and can stably settle BELOW full employment, so that government fiscal/monetary action is needed to close the gap. Net product: 'the economy is a single circular-flow object with an emergent equilibrium that can be STUCK at involuntary unemployment; the state is the residual demand-maker.' It welds (a) the classical/marginalist apparatus Keynes inherited from Marshall/Pigou with (b) the underconsumptionist insight that aggregate demand can be chronically deficient — fused via the proximate seam of the multiplier + liquidity-preference machinery. Born canonically with Keynes's 'General Theory of Employment, Interest and Money' (Feb 1936); but the TAUGHT object (the IS-LM / aggregate-demand model) was actually forged by the synthesizers (Hicks 1937, Hansen, Samuelson 1948/1955) — a re-weld + partial re-attribution.","frame":["time","knowledge","meaning","space"],"_frame_note":"PRIMARY: knowledge (a theoretical/learned-competence render of the economy) + meaning (it reorganized what 'the economy', 'unemployment' and 'the state's role' SIGNIFY — it invented 'macroeconomics' as a level). time (a flow/circular-income dynamic; multiplier rounds over time). SECONDARY: space (national-economy bounded object; the closed-economy assumption, and the cross-country adoption pattern). A wide-frame child like the Modern Synthesis — and, like QG, it touches MEANING because in the absence of a single stable child, 'which Keynesianism is real / is one even needed' is an era-relative, observer-relative judgment.","frame_layer":{"_comment":"(D3) An idea-child — latent ~1.0. But unusually it STRADDLES toward physical because the child is partly CONSTITUTED by a physical institution (the demand-managing state): the theory and the apparatus of government are hard to separate here. Recorded as a small physical membership.","layer":"latent","physical_membership":0.25,"latent_membership":1},"status":"resurrected","_status_enum":"one of: risen | active | dormant | resurrected | stale | open-conjecture. 'resurrected' chosen because the dormancy->resurrection arc (TWICE) is THIS specimen's defining feature; but see status_trajectory — the honest answer is 'active-contested, repeatedly buried-and-exhumed', a state a single enum cannot hold.","status_trajectory":[{"_comment":"(R5) the child as a TRAJECTORY of states across DECADES — pushes R5 PAST Darwin+Mendel: not just hardening/relabeling but a full die-and-REINCARNATE-as-a-different-object cycle, TWICE. status_trajectory here needs to support DISCONTINUOUS re-identification, not just state-relabeling (see gaps).","state":"born-contested (verbal, ambiguous, immediately disputed)","when":"1936-1937","by":"Keynes; first reviewers; Hicks's IS-LM reduction begins the domestication","confidence":0.9},{"state":"hardened/orthodox ('the Age of Keynes' / 'Golden Age of Capitalism')","when":"~1945-1973","by":"the neoclassical synthesis (Hicks/Modigliani/Samuelson) + government institutionalization (Employment Act 1946; Bretton Woods; postwar settlement); pulled by WWII validation","confidence":0.88 ome-determination system — inventing MACROECONOMICS as a level distinct from summed individual markets. Bridge degree high but CONTESTED: post-Keynesians say the synthesis 'unification' was a domestication that betrayed the original; new-classicals say the macro level is a category error (no real unification, just a mislabeling of aggregated micro). A disputed unifier.","compressor":"Collapses a mass of separate intuitions (gluts, hoarding, demand deficiency, unemployment, the trade cycle) into ONE short statement: output and employment are set by aggregate demand, which can settle below full employment because liquidity preference + the marginal efficiency of capital + the multiplier let saving and investment be equated by INCOME adjusting rather than the interest rate. Bits QUALITATIVE ONLY: the joint description (a demand-determined aggregate with an under-employment equilibrium) is plainly shorter than carrying classical full-employment equilibrium AND the under-consumptionists' mechanism-less demand-deficiency as two unreconciled accounts — order-of-magnitude only, no bit value computed (latent embeddings are a LATER step), and on a social/contested substrate at that.","action_spaces_unlocked":["Discretionary fiscal policy (deficit spending to close an output gap) — the core policy affordance; New Deal, the Employment Act 1946, ARRA 2009, CARES 2020 all descend from it","National-income accounting (GDP/GNP as a measurable aggregate) — the statistical apparatus the demand-determined view requires and helped motivate (Kuznets/Stone, wartime)","Counter-cyclical demand management as a standing function of the central bank + treasury (Councils of Economic Advisers, automatic stabilizers)","The IS-LM diagram (Hicks 1937) — the trainable, teachable model that made the theory operational for policy and pedagogy","The Phillips curve trade-off (1958) — an inflation-unemployment policy menu (later the FALSIFIED naive form blamed for the dormancy)","International monetary architecture — Bretton Woods (IMF/World Bank, 1944), Keynes co-architect; the managed-exchange-rate + reserve-currency toolkit","Modern stabilization macro generally — DSGE models with nominal rigidities (New Keynesian) descend from the synthesis-of-the-synthesis"]}},"weld":{"_comment":"The merge itself: parents -> child. The heart of the specimen and the locus of the parents-produce-W_C test. NOTE three load-bearing tensions live here: (1) the W_B 'classical' parent is partly a STRAWMAN Keynes built; (2) the durable taught child (IS-LM) was forged by a MEDIATING welder a layer up, not by Keynes — a re-attribution; (3) the surprise is high-confidence while the child is only moderate-confidence because the child is unstable-OVER-TIME. The whole lifecycle is paced by EXTERNAL forces in forcing_events[] (D4) — see lifecycle (D1) for the weighted index.","id":"weld-general-theory","parents":[{"_role":"W_A","name":"The classical / Marshallian-marginalist apparatus (Marshall's supply-demand + Pigou; Say's-law equilibrium economics)","kernel":"The inherited orthodox price-theory machinery: markets clear, supply creates its own demand (Say's law), the interest rate equilibrates saving and investment, and the economy self-corrects to full employment; involuntary unemployment is transient/frictional. Keynes was TRAINED in this (Marshall's pupil) and built W_C OUT OF its apparatus (he kept much of the marginalist calculus) while attacking its full-employment conclusion. CRITICAL TWIST: Keynes partly RECONSTRUCTED this parent as a single 'classical' bloc (lumping Ricardo, Mill, Marshall, Pigou) and attributed to it an 'always full employment' assumption that arguably no one quite held — a foil partly manufactured to be welded against (see discrepancy #1).","frame":["knowledge","meaning"],"confidence":0.78,"_confidence_note":"The apparatus is real and high-confidence as a body of method; the confidence is capped because the SHARP 'classical school as Keynes characterized it' is substantially his caricature — so 'W_A as the parent Keynes welded against' is part-real, part-constructed.","parent_kind":"content","_parent_kind_note":"Primarily CONTENT (the substantive equilibrium theory) but ALSO method: Keynes inherited the marginalist analytical apparatus (the calculus he reused) from this parent — a content/method straddle."},{"_role":"W_B","name":"The underconsumption / deficient-effective-demand tradition (Malthus's 'effective demand' vs Ricardo; Hobson; the Birmingham School/Attwood; Foster & Catchings)","kernel":"The heretical underground intuition — running from Malthus (who LOST the debate to Ricardo ~1820s) through J.A. Hobson to 1920s American underconsumptionists (Foster & Catchings) — that aggregate demand can be CHRONICALLY deficient: gluts and unemployment are possible because saving need not be automatically re-spent, so the economy can fail to absorb its own output. Had the INSIGHT but no rigorous mechanism; was scorned by classical orthodoxy for ~100 years. The 'content-parent' supplying the demand-deficiency idea Keynes made rigorous.","frame":["knowledge","meaning"],"_frame_note":"knowledge + meaning; a heterodox/heretical body of doctrine. Gains a time-frame only once embedded in the multiplier dynamics (the income-adjustment process).","confidence":0.82,"parent_kind":"content"}],"_parents_comment":"(v1, kept) The clean BINARY projection [W_A, W_B] — the framework's canonical visualization: the marginalist APPARATUS (W_A) turned on the heretics' DEMAND-DEFICIENCY intuition (W_B). ALWAYS present. The honest set is N-ary (see parents_full): Wicksell/Stockholm as a near-identical independent content-parent, and Kahn's multiplier + Keynes's liquidity-preference as the method/instrument welding-operator.","parents_full":[{"_comment":"(R1) the honest N-ary parent set. The binary parents[] above is the declared 2-projection OF this set.","id":"pf-classical","name":"Classical/Marshallian-marginalist apparatus (W_A, as above)","kernel":"Orthodox equilibrium price theory + Say's law + self-correction to full employment; Keynes's inherited apparatus AND his (partly-constructed) foil.","frame":["knowledge","meaning"],"confidence":0.78,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.05,"latent_membership":1}},{"id":"pf-underconsumption","name":"Underconsumption / deficient-effective-demand tradition (W_B, as above)","kernel":"Malthus->Hobson->Foster&Catchings: aggregate demand can be chronically deficient; the heretical content-parent.","frame":["knowledge","meaning"],"confidence":0.82,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.05,"latent_membership":1}},{"id":"pf-wicksell-stockholm","name":"Wicksell / Stockholm-school monetary-disequilibrium tradition (cumulative process; break from the quantity theory)","kernel":"Wicksell's cumulative process (natural vs market rate of interest) and the Stockholm School (Lindahl, Myrdal, Ohlin) ex-ante/ex-post saving-investment analysis — an INDEPENDENT, near-identical content-parent that reached much of the General Theory's territory contemporaneously in the 1930s (and Sweden arguably adopted demand-management FIRST). A multiple-independent-origin content root.","frame":["knowledge","meaning"],"confidence":0.78,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.05,"latent_membership":1}},{"id":"pf-multiplier-liqpref","name":"Kahn's 1931 multiplier + Keynes's liquidity-preference construction (the welding OPERATOR)","kernel":"The ACTIVE welding apparatus that made deficient demand CALCULABLE: Kahn's 1931 employment multiplier (an infinite series of re-spending rounds) + Keynes's own liquidity-preference theory of interest (money demand fixes the rate, so income — not the interest rate — adjusts to equate saving and investment). This is the METHOD/INSTRUMENT parent: it is what turned the W_B intuition into a mechanism inside the W_A apparatus.","frame":["knowledge","time"],"confidence":0.85,"parent_kind":"method","_parent_kind_note":"METHOD/INSTRUMENT — the calculational machinery (multiplier) + the interest-theory device (liquidity preference) that performed the weld; the analogue of Maxwell's d/dt displacement-current operator. The multiplier itself has a contested deep genealogy (pre-Kahn originators — see discrepancy #4).","frame_layer":{"layer":"latent","physical_membership":0.05,"latent_membership":1}}],"mediating_wrapper":{"_comment":"(R1) the agent that PERFORMED the DURABLE weld a layer up — NOT one of the ancestral parents. The population-genetics analogue of this specimen.","name":"The IS-LM / neoclassical-synthesis formalization (Hicks 1937 'Mr Keynes and the Classics'; Modigliani 1944; Samuelson 1948 textbook / 1955 'neoclassical synthesis')","kernel":"The IS-LM aggregate-demand model and its textbook propagation: the mathematized, teachable structure that fused Keynes's verbal General Theory BACK with the classical apparatus into a single determinate system (goods-market IS curve + money-market LM curve). It sits a layer UP from Keynes/Marshall/Malthus and is what actually produced the DURABLE TAUGHT child ('Keynesianism' as economists learned it for 30 years). Exactly analogous to population genetics welding Darwin+Mendel, and to the Maxwellians forging the 4-equation 'Maxwell's equations'.","who_or_what":"John Hicks (1937), Franco Modigliani (1944), Paul Samuelson (1948 textbook; coined 'neoclassical synthesis' 1955), Alvin Hansen (American transmission)","confidence":0.85,"_disowned_note":"DISOWNED-MEDIATOR wrinkle (see gaps): Hicks himself later (~1980s) RENOUNCED IS-LM, and post-Keynesians reject the synthesis as 'bastard Keynesianism' — the mediator was later repudiated by its own author and by a school. A wrinkle beyond R1."},"shared_sub_object_S":"S = the multiplier + liquidity-preference + IS-LM machinery — the formal apparatus where 'savings', 'investment', and 'interest' (from the classical parent) and 'deficient demand' (from the underconsumption parent) become the SAME object expressed as an aggregate INCOME-determination system. The seam is NOT '1936 book meets classical textbook'; it is the move whereby Keynes accepted the classical identity I(r)=S(Y) but REINTERPRETED it so that INCOME (not just the interest rate) adjusts to equate saving and investment. That reinterpretation IS the seam — the layer where the two parents' vocabularies fuse into one calculable system. (The population-genetics analogue: as Hardy-Weinberg gene frequencies are the seam where Darwin's 'variation' and Mendel's 'factor' become one object, the income-determination system is the seam where classical equilibrium and demand-deficiency become one object.)","S_structure":{"_comment":"(R12) S is NON-UNITARY and itself CONTESTED — like Darwin+Mendel's Fisher-Wright-fractured S, NOT like QG's multi-faceted-but-agreed S. agreed:false.","components":["Kahn's 1931 multiplier (re-spending rounds; the income-amplification mechanism)","Keynes's liquidity-preference theory of interest (money-demand fixes the rate; frees income to adjust)","The marginal efficiency of capital (investment as a function of expected return vs the interest rate)","The income-adjustment reinterpretation of the saving=investment identity (the core conceptual seam)","The IS-LM formalization of all the above (Hicks 1937) — itself a CONTESTED component of S"],"internal_conflict":"The IS-LM formalization of S (Hicks) is REJECTED by post-Keynesians as a DISTORTION of the true seam — they hold the real seam is fundamental UNCERTAINTY + liquidity preference (the General Theory ch.12/17), which IS-LM's mechanical equilibrium suppresses. So the seam along which the parents were welded is itself disputed between the synthesis reading (IS-LM determinate equilibrium) and the post-Keynesian reading (uncertainty-driven, non-ergodic). The seam has a rift.","agreed":false},"surprise":"A STABLE under-full-employment equilibrium that NEITHER parent predicts. Classical economics (W_A) says the economy self-corrects to full employment (Say's law); underconsumptionism (W_B) intuited demand could fall short but had no rigorous mechanism. Only the WELD — liquidity preference × marginal efficiency of capital × multiplier — shows the economy can SETTLE and STAY stuck at involuntary unemployment, with no automatic force returning it to full employment. Reachable only from BOTH parents jointly: the marginalist apparatus turned on the heretics' demand-deficiency intuition. SECOND-ORDER surprise: the weld INVENTS macroeconomics as a level distinct from summed individual markets — aggregate demand as a PRIMARY cause, and the PARADOX OF THRIFT (individually-rational saving can be collectively self-defeating, an emergent aggregate property absent in any single agent, exactly like a wrapper-level property not present in the parts). DEEPEST surprise: it makes the STATE the residual demand-maker, converting an economic theory into a permanent REORGANIZATION of the 20th-century state — a meaning-frame shift neither Darwin-of-economics nor the heretics articulated.","surprise_confidence":0.9,"_surprise_confidence_comment":"(v1, R9) ORTHOGONAL to child.confidence (0.72). HIGH (0.9): the synergy (a stable under-employment equilibrium; the paradox of thrift; the invention of macroeconomics) is real and decisive and unreachable from either parent alone — this is well-attested and not seriously disputed even by critics (who dispute its NECESSITY and POLICY, not that the weld produced a genuinely new aggregate level). NOTE the sharp divergence from child.confidence (0.72): a maximally fertile, genuinely-emergent weld whose CHILD is nonetheless unstable-over-time. A SECOND mode of R9's orthogonality, distinct from QG: in QG the child is UNBORN (nothing consolidated); here the child was BORN, hardened, DIED, and was RE-BORN differently — high surprise, but moderate child-confidence because the child is unstable-over-time, not unborn.","surprise_priority":{"_comment":"(R15) the CONJECTURE-IN-A-PARENT: the under-employment / demand-deficiency surprise pre-existed the quantitative weld as a low-confidence guess inside W_B for ~100 years. The economics analogue of Faraday's 1846 light-guess.","first_conjectured_by":"Thomas Malthus (the 'effective demand' / general-glut argument vs Ricardo, ~1820), revived by J.A. Hobson (underconsumption, ~1889-1909) and the 1920s underconsumptionists","when":"~1820 (Malthus), ~1889-1920s (Hobson, Foster & Catchings)","dormant_interval":"~1820-1930s: the demand-deficiency idea lost to Ricardo/Say's-law orthodoxy and lay heretical for ~100 years — a low-confidence weld 'drawn but not confirmed' inside W_B, awaiting the OTHER parent (the marginalist apparatus + the multiplier) to make it calculable. Keynes explicitly rehabilitated Malthus as 'the first of the Cambridge economists' and Hobson as a neglected prophet.","confidence":0.82},"bits_note":"QUALITATIVE ONLY. The joint description is clearly shorter than the two parents carried separately: ONE statement ('output and employment are set by aggregate demand, which can equilibrate below full employment because income adjusts to equate saving and investment') replaces TWO unreconciled accounts (classical full-employment self-correction; mechanism-less demand-deficiency). The synergy is genuine, not additive — the under-employment equilibrium is unreachable from either parent's own vocabulary. NO bit value computed: MDL-in-bits needs latent embeddings (a LATER step per SCHEMA.md §3), and the substrate is social/contested with a child that changes identity over time, making any bit count doubly ill-posed. Not 'principled-null' (the child exists, unlike QG) — just a normal qualitative-for-now assessment.","survived":["The marginalist analytical apparatus (the calculus; supply/demand curves) — kept from W_A","Marginal efficiency of capital; the interest rate; money — classical price-theory pieces RE-PURPOSED into the aggregate system","The demand-deficiency / under-employment INSIGHT — kept from W_B (now mechanized)","The multiplier (Kahn 1931) and liquidity preference — the welding operators, which BECAME the durable core","The saving=investment identity — KEPT but REINTERPRETED (income adjusts, not just the rate) — the seam itself","PARENTS PERSIST AS PROCEDURAL-ROOT STUBS: 'classical/neoclassical price theory' survives literally as the OTHER curve of IS-LM and as the microfoundations the New Keynesians later re-imported — the dormant compiled original W_A° lives on inside the synthesis"],"dropped":["Say's law (supply creates its own demand) — the DROP that is the whole point of the weld","Automatic self-correction to full employment","The classical (loanable-funds) theory of interest as the sole equilibrator of saving and investment (replaced by liquidity preference + income adjustment)","W_B's saltationist/crankish underconsumptionist baggage (the 'gluts from greed' moralizing) — the rigorous core kept, the heretical framing dropped","CONTESTED-dropped-then-revived: the classical MICROFOUNDATIONS — dropped by Keynes (macro as primary), RE-IMPORTED by the New Keynesians (2008-era) and demanded by the new-classicals (the Lucas critique) — so a feature dropped at birth was forced back later, which is part of why the revived child is method-incompatible with the original"],"feature_ledger":[{"_comment":"(R7) the PER-VERSION survived/dropped matrix — needed here because 'Keynesianism' is at least FOUR mutually-critical wrappers (spread across TIME, where QG's were held simultaneously) that keep/drop DIFFERENT features. This is the temporal analogue of QG's candidate-children ledger.","feature":"Microfoundations (the economy reduces to optimizing individual agents)","kept_by":["New Keynesian (DSGE, sticky-price microfoundations)","New-classical/RBC (rivals; microfoundations PRIMARY)"],"dropped_by":["Orthodox/IS-LM synthesis (aggregates primary)","Post-Keynesian (rejects the equilibrium frame)","Original Keynes (macro as a distinct level)"]},{"feature":"Fundamental (non-probabilistic) uncertainty + liquidity preference as the deep seam","kept_by":["Post-Keynesian (Robinson/Minsky; this IS the true seam)","Original Keynes (ch.12/17)"],"dropped_by":["Orthodox/IS-LM synthesis (suppressed into mechanical equilibrium)","New Keynesian (rational expectations + calculable risk)","New-classical (rational expectations)"]},{"feature":"Active discretionary fiscal demand-management (the policy core)","kept_by":["Orthodox/IS-LM synthesis","Post-Keynesian","New Keynesian (in a crisis / at the zero lower bound)","MMT (strongly)"],"dropped_by":["New-classical/RBC (policy-ineffectiveness; the Lucas critique)","Monetarism (rules over discretion; monetary not fiscal)"]},{"feature":"A determinate equilibrium framework (the economy as a solvable system)","kept_by":["Orthodox/IS-LM synthesis","New Keynesian (DSGE)","New-classical (Walrasian equilibrium)"],"dropped_by":["Post-Keynesian (non-ergodic, fundamentally uncertain, no stable equilibrium)"]}],"frame_of_weld":["knowledge","meaning","time"],"_frame_of_weld_comment":"The weld HOLDS in knowledge (it was BUILT as theory — the income-determination system Keynes/Kahn/Hicks constructed), in MEANING (its decisive move is a re-signification: 'unemployment is a system property / the state is the demand-maker' — a meaning-frame reorganization), and in TIME (the multiplier is a dynamic process over re-spending rounds; the child lives as a flow). NOTE this differs from child.frame (which adds space). Critically, the weld also engages MEANING for the QG-like reason: with no single stable child, 'is this a real new object or a relabeling, and is one even needed' is an era-relative judgment (see weld_necessity_confidence + discrepancy #5).","weld_operator":"The MULTIPLIER + LIQUIDITY PREFERENCE as the active frame-ingredients — specifically the income-adjustment mechanism: making INCOME (not the interest rate) the variable that moves to equate saving and investment is the operative move that lets the system settle below full employment. The economics analogue of Maxwell's displacement-current d/dt term: not a passive backdrop but the specific device that does the welding. Without the multiplier (re-spending dynamics) and liquidity preference (freeing the interest rate from the saving=investment job), the two parents sit side-by-side and make nothing — exactly the 'two rocks in space = nothing; through time = strata' test, here 'classical apparatus + demand-deficiency intuition = nothing; through the multiplier = an under-employment equilibrium'.","lod_scale":"Holds at the FIELD/theory grain ('Keynes welded classical equilibrium to demand-deficiency via the multiplier, inventing demand-determined macro'). ZOOM IN and the single weld dissolves into an ordered chain of sub-welds (Malthus-Ricardo glut debate -> Hobson underconsumption -> Wicksell cumulative process -> Kahn 1931 multiplier -> the Cambridge 'Circus' critique of the Treatise 1930-31 -> the General Theory 1936 -> the Hicks/Modigliani/Samuelson synthesis 1937-55). At fine grain it is NOT one weld but a multi-decade cascade with TWO distinct births (Keynes 1936; the synthesis 1937-55) — the weld_chain. Its sub-structure CONFIRMS the weld (it is a coherent chain, like Maxwell/Darwin-Mendel), NOT contradicts it (unlike QG) — the fork in THIS specimen is over TIME (revivals as different objects) and over SCHOOLS, not a simultaneous shattering at first zoom.","sub_welds":[{"_comment":"(R3) ordered chain — one weld at coarse grain is a family of sub-welds zoomed in.","id":"sw-malthus-ricardo","name":"Malthus vs Ricardo on general gluts / effective demand (the W_B seed; Malthus loses, the idea goes dormant)","when":"~1814-1823","confidence":0.8},{"id":"sw-hobson-underconsumption","name":"Hobson's underconsumption + the 1920s underconsumptionists (Foster & Catchings) — W_B revived heretically","when":"~1889-1928","confidence":0.78},{"id":"sw-wicksell-stockholm","name":"Wicksell cumulative process -> Stockholm School (independent near-identical content)","when":"1898-1930s","confidence":0.75},{"id":"sw-kahn-multiplier","name":"Kahn's 1931 multiplier (the welding operator made calculable)","when":"1931","confidence":0.88},{"id":"sw-cambridge-circus","name":"The Cambridge 'Circus' critique of Keynes's Treatise on Money (1930) -> pivot toward effective demand","when":"1930-1931","confidence":0.82},{"id":"sw-general-theory","name":"BIRTH-1: the General Theory (the raw, verbal, contested object)","when":"1936","confidence":0.92},{"id":"sw-synthesis","name":"BIRTH-2: the IS-LM / neoclassical-synthesis formalization (the durable taught object; a re-weld)","when":"1937-1955","confidence":0.85}],"coherence_under_zoom":"confirms","_coherence_under_zoom_comment":"(R3) CONFIRMS — the sub-structure is a coherent ordered chain that supports the weld (like Maxwell and Darwin+Mendel), NOT a simultaneous shattering (unlike QG). The 'fork' in this specimen is DIACHRONIC (the child re-incarnates differently across decades) and SCHOOL-wise (4 rival readings), not a first-zoom contradiction of the weld itself. Worth noting as a contrast: a multi-cycle-dormancy weld can be confirms-under-zoom yet still profoundly unstable over TIME — coherence_under_zoom (a synchronic diagnostic) and lifecycle-stability (a diachronic one) are independent.","when":{"_comment":"(R2) a PROCESS with a duration and several defensible dates; TWO births (the re-weld).","from":"1930","to":"1955","defensible_dates":["1930-1931 (the Cambridge Circus + Kahn's multiplier — conception/first-conjecture)","Feb 1936 (the General Theory — BIRTH-1, the canonical date)","1937 (Hicks 'Mr Keynes and the Classics' — IS-LM, the start of BIRTH-2)","1944 (Modigliani) / 1948 (Samuelson's textbook) / 1955 (Samuelson coins 'neoclassical synthesis') — BIRTH-2 consolidated"]},"dormancy_intervals":[{"_comment":"(v1, R11) PRE-HISTORY DORMANCY of the W_B parent — the demand-deficiency idea was heretical for ~100 years before the Depression revived it. why_frame names the FRAME only; the external cause (the dominance of Ricardian/Say's-law orthodoxy) is intellectual, not a single exogenous event, so no forcing_events entry — this dormancy is knowledge-framed.","from":"~1823","to":"~1930","why":"The underconsumption/effective-demand idea (W_B) lost the debate to Ricardo; Say's law became canon; underconsumptionists were treated as cranks. A ~100-year heretical dormancy of the demand-deficiency parent, ended when the Great Depression created the demand for exactly such a theory.","why_frame":"knowledge"},{"_comment":"(v1, R11) THE MAIN DORMANCY of the CHILD: ~1973-2008. CAUSE-FRAME SPLIT — partly knowledge-frame (stagflation falsified the naive Phillips curve), partly physical/political-frame (a FUNDED ideological movement displaced it from curricula and treasuries). A single 'why' cannot hold both (the Darwin+Mendel / QG cause-frame finding, here in economics). The EXTERNAL events (1970s stagflation; the neoliberal turn) are recorded ONCE in forcing_events[] — this why_frame names only the frames.","from":"1973","to":"2008","why":"Eclipsed by (a) the 1970s stagflation falsifying the naive Phillips-curve form Keynesianism had been reduced to (a refuting FACT), with the Lucas critique (1976) as the theoretical kill-shot; AND (b) the neoliberal/monetarist POLITICAL turn (Chicago funding + Thatcher 1979 / Reagan 1981) actively displacing it from policy and graduate curricula (a funded ideological movement). See forcing_events fe-stagflation and fe-neoliberal-turn.","why_frame":"knowledge, physical/political"}],"revival":{"_comment":"(v1, R10) TWO revivals, BOTH reinterpreted (not same) — a STRONGER form than the binary 'same|reinterpreted' allows (see gaps). Each revival wakes a method-incompatible object under the inherited name. The fuller multi-cycle structure is in dormancy_revival (the rich prose field below) and indexed in lifecycle (D1); this object records the headline.","when":"2008-2009 (revival #1); 2020-2021 (revival #2)","by":"(#1) Krugman/DeLong/Stiglitz + the academic New-Keynesian mainstream + G20/IMF; (#2) the COVID fiscal response + MMT advocates","trigger":"(#1) the 2008 Global Financial Crisis (conditions resembling the 1930s) -> near-instant G20 fiscal stimulus; (#2) the 2020 COVID-19 pandemic -> the largest peacetime fiscal expansion in history. Both are EXTERNAL crisis-pulls (forcing_events fe-gfc, fe-covid).","kind":"reinterpreted","_kind_note":"REINTERPRETED both times, and DIFFERENTLY each time. Revival #1 wakes a NEW-KEYNESIAN object: sticky-price microfoundations inside a neoclassical-equilibrium DSGE frame — closer in METHOD to Keynes's classical opponents than to Keynes. Revival #2 flirts with MMT, a different heterodox object again. 'same|reinterpreted' is too coarse: each resurrection wakes a structurally DIFFERENT, method-incompatible object wearing the same name (see gaps: needs a degree-of-reinterpretation / method-continuity axis)."},"reattribution":{"_comment":"(R10) the canonical NAME attaches partly to the WRONG node — the Maxwell-analogue. Direct sibling of the 'Maxwell's equations were the Maxwellians' finding.","named_after":"John Maynard Keynes ('Keynesian economics', 'the Keynesian Revolution')","actually_produced_by":"The durable TAUGHT object (IS-LM aggregate-demand model) was forged by Hicks (1937), Modigliani (1944) and Samuelson (1948/55) — the mediating welders. Keynes's own General Theory is verbal, ambiguous, and its IS-LM reduction was contested; Hicks himself later RENOUNCED IS-LM; post-Keynesians call the synthesis 'bastard Keynesianism'.","why":"The canonical name attaches to the originator of the RAW, contested form (Keynes 1936), not to the producers of the durable taught STRUCTURE (the synthesizers 1937-55). The weld CHAINS: birth-1 (Keynes) -> a second welding event (the synthesis) producing a structurally different, partly-DISOWNED object. Triple-attests the re-weld + mediating-welder variables and adds a 'disowned-mediator' wrinkle (Hicks repudiated his own weld)."},"weld_chain":[{"_comment":"(R10) the weld CHAINS — birth-1's W_C becomes the input to birth-2.","birth_label":"BIRTH-1: the General Theory (raw, verbal, contested)","weld_ref":"sw-general-theory"},{"birth_label":"BIRTH-2: the IS-LM / neoclassical-synthesis re-weld (the durable taught child; partly disowned)","weld_ref":"sw-synthesis"}],"candidate_children":[],"_candidate_children_comment":"(R6) EMPTY in the QG sense (no SIMULTANEOUS family of mutually-rejecting children at first zoom). The Keynesian child DID resolve (it was born and adopted). HOWEVER — and this is a finding — the schools (orthodox/IS-LM, post-Keynesian, New Keynesian, MMT-adjacent) are FOUR mutually-critical wrappers that disagree about what the child IS, but spread across TIME (successive revivals) rather than held simultaneously, AND they are descendants/reinterpretations rather than never-resolved rivals. They are therefore recorded as harvest.descendants + the feature_ledger + status_trajectory, NOT as candidate_children. A frontier note: 'candidate children spread across time vs held simultaneously' is a mode candidate_children[] does not cleanly capture (see gaps).","unresolved":false,"contest_axis":"","weld_necessity_confidence":0.78,"_weld_necessity_confidence_comment":"(R8) 'is a third even NEEDED?' held at 0.78 (NOT empty/1.0). The weld is almost certainly REAL (the Depression and 2008 are hard to explain agent-by-agent; mass involuntary unemployment is a genuine aggregate fact). But its NECESSITY is genuinely DISPUTED by a serious new-classical / real-business-cycle / Austrian minority that holds macroeconomics is a CATEGORY ERROR — the aggregate is just summed optimizing agents (microfoundations primary; the Lucas-critique position) — a school that CAPTURED the discipline for a generation. So this is the falsifier-of-the-weld, LIVE, not 1.0. (Economics instance of QG's semiclassical-dissent slot, but stronger: the dissent here was the orthodoxy for ~25 years.)","lifecycle":{"_comment":"(D1) the weld's GRADED LIFE as a weighted INDEX over dormancy_intervals/revival/status/weld_chain above — does NOT restate their content. This is the RICHEST lifecycle in the batch (full multi-cycle trajectory). The whole trajectory is PACED BY EXTERNAL FORCES (forcing_events D4) — that pacing is the specimen's headline.","phase_trajectory":[{"_comment":"(D1) GRADED trajectory, NOT an enum; the membership IS the soft value. Phases overlap. This trajectory is unusually LONG and multi-cycle (the defining feature). The 'when' marks the phase; the antagonism STRENGTH lives in pre_weld_relationship (not double-recorded here).","phase":"pre_weld:complementarity-with-suppressed-antagonism","membership":0.85,"from":"~1820","to":"1930","note":"W_B (underconsumption) was a heretical underground tradition that classical orthodoxy (W_A) actively SCORNED for ~100 years (Malthus lost to Ricardo; Say's law was canon) — so the parents were antagonists-BY-STATUS before the weld, not symmetric complementary partners. A complementarity/antagonism straddle (see pre_weld_relationship)."},{"phase":"conception/first_conjecture","membership":0.85,"from":"1930","to":"1933","note":"Kahn's multiplier (1931); the Cambridge 'Circus'; Kalecki and the Stockholm School reaching it independently. The Depression (fe-depression) is the exogenous pull that creates the demand for the theory."},{"phase":"welding(process)","membership":0.95,"from":"1933","to":"1936","note":"Keynes drafts and publishes the General Theory (Feb 1936) — BIRTH-1 of the raw object."},{"phase":"consolidation/hardening (the 'Age of Keynes' / 'Golden Age of Capitalism')","membership":0.9,"from":"1937","to":"1973","note":"BIRTH-2 (the IS-LM/neoclassical synthesis) + government institutionalization; pulled hard by WWII validation (fe-wwii) and the postwar settlement (fe-postwar). The taught child hardens."},{"phase":"dormancy/eclipse","membership":0.8,"from":"1973","to":"2008","note":"Stagflation (fe-stagflation) falsifies the naive Phillips-curve form; the monetarist + new-classical counter-revolution; the neoliberal political turn (fe-neoliberal-turn). 'We are all monetarists now.' Not TOTAL dormancy (it survived inside the synthesis + New Keynesianism), hence membership 0.8 not 1.0."},{"phase":"revival:reinterpreted (#1, GFC)","membership":0.85,"from":"2008","to":"2009","note":"The GFC (fe-gfc) crisis-pull -> instant G20 fiscal stimulus + New-Keynesian DSGE. Reinterpreted: microfounded, integrated with neoclassical equilibrium — method-incompatible with the original."},{"phase":"revival:reinterpreted (#2, COVID)","membership":0.8,"from":"2020","to":"2021","note":"The COVID shock (fe-covid) -> largest peacetime fiscal expansion + MMT flirtation. A second, different reinterpretation."},{"phase":"active-contested (never fully hardened nor fully stale; capacity-to-cycle demonstrated)","membership":0.75,"from":"2021","to":null,"note":"A live, repeatedly-buried-and-exhumed wrapper. Post-pandemic inflation re-opens the stagflation-era critique; rival schools coexist. The canonical economic instance of dormancy + squeeze/pull CYCLING."}],"pre_weld_relationship":{"_comment":"(R14) the SINGLE HOME for the antagonism strength. Distinctive here: a COMPLEMENTARITY-with-suppressed-antagonism — the parents were complementary in CONTENT (apparatus + insight) but antagonistic in STATUS (orthodoxy scorned the heresy for a century). Not a clean single kind.","kind":"complementarity","membership":0.6,"note":"PRIMARY complementarity (the marginalist apparatus and the demand-deficiency insight genuinely complete each other — the weld fuses them) but with a strong SUPPRESSED-ANTAGONISM component (~0.4): W_B was a heretical tradition that W_A's orthodoxy actively scorned for ~100 years (Malthus lost to Ricardo; underconsumptionists were 'cranks'). So unlike Darwin+Mendel's OVERT antagonism (Mendelism as an anti-Darwinian weapon), this is antagonism-by-STATUS/hierarchy, not open warfare — a complementarity/antagonism straddle. Graded: complementarity ~0.6, antagonism ~0.4."},"weld_type":[{"_comment":"(D1) WEIGHTED classification — a weld is SEVERAL types at once; the weight IS the soft value. PRIMARY tags.","type":"crisis-pulled-weld","weight":0.9,"note":"The Great Depression was the SQUEEZE on the old order that PULLED the new theory into existence and into government (fe-depression). The canonical instance of this type — the reason the specimen was chosen."},{"type":"state/war-mobilized-weld","weight":0.8,"note":"WWII deficits (fe-wwii) restored full employment exactly as predicted, VALIDATING the theory and mobilizing it into permanent government machinery (Employment Act, Bretton Woods). The war did for Keynesianism's CONSOLIDATION what the Depression did for its birth."},{"type":"re-weld / re-attribution","weight":0.75,"note":"The durable taught 'Keynesianism' (IS-LM) was forged by Hicks/Samuelson, not written in Keynes's own contested text — a Maxwell-analogue mediator re-weld (see reattribution + weld_chain)."},{"type":"antagonism-then-fusion","weight":0.45,"note":"At the parent level: underconsumption heresy vs classical orthodoxy (status-antagonism for ~100 years) fused by the weld. Weaker/different from Darwin+Mendel's OVERT war — hence 0.45 — because the antagonism was hierarchical scorn, not open battle (see pre_weld_relationship)."},{"type":"unifier-weld","weight":0.5,"note":"It DID unify (price-theory pieces into one aggregate income system; invented macro). But CONTESTED: post-Keynesians call the synthesis-unification a domestication/betrayal, and new-classicals deny the macro level unifies anything real (it's mislabeled micro). A disputed unifier — hence 0.5, not 1.0."},{"type":"dormancy-revival-cycling weld","weight":0.85,"note":"PROPOSED in BATCH_FINDINGS terms but here promoted to a near-primary tag: the multi-cycle die
