ence":0.82,"carrier_of":[{"wrapper":"desc-institutions","role":"institutionalizes","strength":0.85,"when":"1944","confidence":0.82},{"wrapper":"child-keynesian-macro","role":"champions","strength":0.6,"when":"2008-2009","confidence":0.75,"_note":"advocated coordinated global fiscal stimulus in 2008-09 — a striking reversal given its 1980s-90s structural-adjustment (austerity) reputation"}],"inhabitant_of":[{"wrapper":"the postwar international monetary order","layer":"latent","role":"operates_in","strength":0.85,"when":"1944-","confidence":0.82}]},{"id":"act-g20","name":"The G20","kind":"institution","frame_layer":{"layer":"physical","physical_membership":0.9,"latent_membership":0.3},"role":"Institutional VEHICLE of the 2008 revival (coordinated global stimulus)","when":"Nov 2008 (the Washington summit launching coordinated fiscal stimulus)","where":"global (the Washington / London summits)","culture":"the post-crisis international-policy regime","relation":"institutional vehicle (the body through which revival #1 was coordinated)","confidence":0.8,"carrier_of":[{"wrapper":"child-keynesian-macro","role":"institutionalizes","strength":0.75,"when":"2008-2009","confidence":0.8,"_note":"coordinated global fiscal stimulus (from Nov 2008) — the institutional vehicle of the revival"}],"inhabitant_of":[{"wrapper":"the post-crisis international-policy regime","layer":"latent","role":"operates_in","strength":0.8,"when":"2008-","confidence":0.78}]}],"fuzzy_layer":{"_comment":"The LOD/confidence partition made explicit, as a DERIVED human digest of the per-node memberships (D5 — the memberships are ground truth; this two-bin split is a curated reading). certain_core = the trunk (high-confidence); frontier = speculative/conjectural + SCHEMA-STRESS notes. The DISTINCTIVE feature here: the fuzz is largely TEMPORAL — the child's IDENTITY is solid at any instant but drifts across decades, so the frontier includes 'which Keynesianism, when'.","certain_core":["TRUNK (conf ~0.9): a weld happened — the General Theory (Feb 1936) fused a classical/marginalist apparatus to an effective-demand insight via the multiplier + liquidity-preference machinery, producing a demand-determined view of aggregate output/employment with a possible under-employment equilibrium.","The multiplier (Kahn 1931) and liquidity preference (Keynes 1936) are the welding operators; Keynes's multiplier is explicitly 'related to' Kahn's (General Theory ch.10) (conf ~0.9).","The weld INVENTED macroeconomics as a level (aggregate demand as a primary cause; the paradox of thrift) and made the state the residual demand-maker (conf ~0.88) — the surprise.","Government ADOPTION is real and consequential: WWII deficits validated it; the US Employment Act 1946 created the CEA; Keynes co-architected Bretton Woods (IMF/World Bank, 1944) (conf ~0.85).","The durable TAUGHT object was IS-LM, forged by Hicks (1937), Modigliani (1944), Samuelson (1948/55) — a mediating welder a layer up (conf ~0.85).","The 1970s stagflation falsified the naive Phillips-curve form and (with the Lucas critique + the neoliberal political turn) drove a ~1973-2008 dormancy (conf ~0.82).","The 2008 GFC and 2020 COVID triggered crisis-pull REVIVALS (ARRA $787bn; China ~$586bn; CARES $2.2tn) — well-attested external facts (conf ~0.85).","Surprise/synergy (a stable under-employment equilibrium; the paradox of thrift) is high-confidence even though the child is not (conf ~0.9) — the R9 decoupling, here from the 'born-then-reborn-different' direction."],"frontier":["FRONTIER — strawman-parent conjecture (conf ~0.6): that W_A ('classical economics') is a real pre-existing parent as Keynes characterized it. Multiple historians hold he caricatured/manufactured it as a foil (the 'always full employment' assumption no one quite held). The APPARATUS is real; the SHARP foil is part-constructed. = discrepancy #1 (highest-value; motivates a strawman/reconstructed-parent variable + the foil-constructed-weld type).","FRONTIER — the child as a single STABLE wrapper (conf ~0.55): 'Keynesianism' names at least FOUR mutually-critical wrappers (orthodox/IS-LM, post-Keynesian, New Keynesian, MMT-adjacent) spread across TIME; the revived-2008 object differs in method from the original-1936. The child is unstable-over-time. = discrepancies #2, #5, #7.","FRONTIER — the re-attribution (conf ~0.8 on the fact; the wrinkle is the frontier): the durable taught child was forged by the synthesizers, not Keynes; Hicks later DISOWNED IS-LM and post-Keynesians reject the synthesis ('bastard Keynesianism') — a disowned-mediator. = discrepancy #2.","FRONTIER — whether 1936 was a 'revolution' at all (conf ~0.65): contested from BOTH directions (Austrians/IEA: not a real break, the classics weren't wrong; post-Keynesians: a real break immediately betrayed by its popularizers). The child's very existence as a distinct wrapper is frame-dependent. = discrepancy #5.","FRONTIER — the dormancy's cause and extent (conf ~0.6): a CAUSE-FRAME split (stagflation falsification in {knowledge} vs a funded neoliberal political movement in {physical/political}); the '1970s death of Keynes' is partly an ideological narrative (it survived inside the synthesis throughout). = discrepancy #6.","FRONTIER — weld NECESSITY (conf ~0.78): a serious new-classical/RBC/Austrian minority holds macroeconomics is a category error (the aggregate is just summed agents; the Lucas critique). The falsifier-of-the-weld, live. = discrepancy #9.","FRONTIER — multiple-independent-origin / priority (conf ~0.7): Kalecki (1933-35) and the Stockholm School reached the essentials independently and contemporaneously; the multiplier has pre-Kahn originators. The surprise was 'in the air' once the Depression created the pull. = discrepancies #3, #4.","SCHEMA-STRESS (frontier of the MODEL, not the record): the strawman/reconstructed-parent (no slot), the diachronic candidate-children-spread-across-time (candidate_children[] assumes simultaneity), the revived-as-reinterpreted-DIFFERENTLY-each-time (the same|reinterpreted binary is too coarse), the disowned-mediator, and exogenous-forcing-as-the-primary-timeline all sit at the edge of what the v2 schema can hold — see gaps + discrepancies."],"core_boundary_locus":"(R3-adjacent) UNUSUAL: the certain-core/frontier boundary does NOT sit cleanly at the trunk (Maxwell) nor sink below the child (QG) — it runs ALONG THE TIME AXIS. At any single instant the child is fairly solid (the 1948 synthesis, the 2009 New-Keynesian object, are each well-defined); but ACROSS instants the identity drifts (born -> hardened -> dead -> reborn-different x2). So the fuzz is DIACHRONIC: the core is 'the weld happened and reorganized the state'; the frontier is 'which child, when, and is it the same child'. A third locus-type beyond Maxwell's (fuzz-in-roots) and QG's (fuzz-in-canopy): fuzz-along-time. The vertical-position-of-the-boundary thermometer (BATCH_FINDINGS §D) gains a horizontal (temporal) reading here."},"discrepancies":[{"_comment":"THE highest-value discrepancy and NOVEL vs all prior specimens: a parent partly MANUFACTURED by the welder. Proposes a new variable AND a new weld-type (named here BEFORE use, per §6 item 7).","what":"The second parent W_A ('classical economics') was substantially a STRAWMAN that Keynes constructed to be welded against. Multiple historians (IEA; Econlib; post-Keynesians) hold Keynes 'set up an utterly false caricature of classical theory' and falsely attributed an 'always full employment' assumption to it, lumping Marshall, Pigou, Ricardo and others into a single 'classical' bloc that no one quite held.","sources_in_conflict":["IEA 'Keynes versus the classics — the true story' + Econlib 'Keynesian Economics' (the caricature/strawman case)","vs the General Theory's own framing (Keynes's 'classical economists') + the textbook Keynes-vs-classics narrative"],"type":"framework-vs-record-tension","why_interesting":"The prize tension: in a normal weld BOTH parents pre-exist as real wrappers. Here one parent appears partly INVENTED by the welder in order to have something to fuse against — a weld against a reconstructed/fictionalized parent. The schema assumes parents are FOUND, not manufactured by W_C's author. Caps confidence on the clean two-parent rendering (~0.6). -> motivates a NEW variable 'strawman/parent_reconstructed_by_welder' AND a NEW weld-type 'foil-constructed-weld' (both flagged HERE before use, per §6 item 7; rendered at weld.lifecycle.weld_type with weight 0.55).","confidence_impact":"Lowers confidence in the clean two-parent rendering / in 'W_A as Keynes characterized it' to ~0.6; the APPARATUS-as-a-real-root stays high (~0.88). Does not touch surprise_confidence (the synergy is real regardless of how the foil was framed)."},{"what":"The DURABLE, taught 'Keynesianism' (the IS-LM aggregate-demand model) was NOT written by Keynes — it was forged by Hicks (1937), Modigliani (1944) and Samuelson (1948/55). Keynes's own General Theory is verbal, ambiguous, and its IS-LM reduction was contested; Hicks himself later RENOUNCED IS-LM; post-Keynesians call the synthesis 'bastard Keynesianism.'","sources_in_conflict":["Wikipedia 'Neoclassical synthesis' (Hicks 1937 IS-LM; Modigliani 1944; Samuelson coined the term 1955; Hicks's later renunciation)","vs the canonical attribution of 'Keynesian economics' to Keynes","vs post-Keynesians (Robinson) calling the synthesis 'bastard Keynesianism'"],"type":"framework-vs-record-tension","why_interesting":"Direct analogue of the Maxwell re-attribution finding (the Maxwellians forged the surviving 4-equation form). The canonical NAME ('Keynesian') attaches to the originator of the raw, contested form, not to the producers of the durable taught structure. The weld CHAINS: birth-1 (Keynes 1936) -> a second welding event (the synthesis 1937-55) producing a structurally different, partly-disowned object. -> triple-attests the re-weld + mediating-welder variables (R1, R10; rendered at weld.mediating_wrapper + weld.reattribution + weld.weld_chain) and adds a 'disowned-mediator' wrinkle (Hicks repudiated his own weld; see gaps).","confidence_impact":"The re-attribution fact is high (~0.8); it lowers confidence that 'Keynesianism = what Keynes wrote' and supports the mediating-welder rendering. Adds the disowned-mediator wrinkle (not in R1/R10)."},{"what":"Michał Kalecki independently derived the essentials of the General Theory in Polish/French papers (1933, 1934, 1935) BEFORE Keynes, arguably in a more complete and class-conscious form; he declined to claim priority. The Stockholm School (Wicksell lineage; Lindahl, Myrdal, Ohlin) developed numerous Keynesian concepts independently and contemporaneously in the 1930s.","sources_in_conflict":["Wikipedia 'Michał Kalecki' + HET profile + 'Did Kalecki Get There First?' + Robinson 'A Neglected Prophet' (NYRB 1976)","vs the standard Keynes-as-sole-originator narrative"],"type":"priority-dispute","why_interesting":"The surprise (effective demand / deficient-demand equilibrium) was reachable from the parents by at least THREE independent welders nearly simultaneously (Keynes, Kalecki, the Stockholm School) — a multiple-independent-discovery pattern suggesting the weld was 'in the air' once the Depression created the pull. Bears on surprise_priority (R15) and confirms multi-origin is normal (cf. QG's multi-rooted origin). Kalecki-co-priority held ~0.7 (well attested but he never pressed it). Rendered at relatives rel-kaleckian + rel-stockholm and actor act-kalecki.","confidence_impact":"Does not lower the weld's confidence; multiplies the origin-roots and supports the crisis-pull reading (the Depression made the same weld appear in three places at once)."},{"what":"The 'multiplier' had numerous pre-Kahn originators: Dutch mercantilists, Julius Wulff (1896), Nicholas Johannsen (1890s), Alfred de Lissa and others — Kahn (1931) formalized rather than originated it. Keynes also distinguished his 'investment multiplier' from Kahn's 'employment multiplier' ('only a little different').","sources_in_conflict":["Wikipedia 'Multiplier (economics)' / 'Keynesian economics' (pre-Kahn originators)","vs the standard 'Kahn 1931 invented the multiplier' attribution"],"type":"priority-dispute","why_interesting":"The welding-OPERATOR (the multiplier) itself has a contested deep genealogy — a sub-weld priority dispute beneath the main weld. Mirrors Maxwell's surprise-priority (Faraday's 1846 light-guess) at the operator level. Low confidence-impact on the trunk; enriches the roots. Rendered at sub-welds sw-kahn-multiplier + sub_wrapper sub-multiplier.","confidence_impact":"Negligible on the trunk; slightly lowers 'Kahn ORIGINATED the multiplier' (formalized, not originated) while keeping 'Kahn made it the operative welding device' high (~0.88)."},{"what":"Whether the 1936 event was a genuine 'revolution' or an overstated rebranding is contested. Some Austrians/classicals (and the IEA) argue Keynes solved a problem the classics had not actually got wrong; the very term 'Keynesian Revolution' is whig historiography. Conversely post-Keynesians argue the revolution was real but immediately BETRAYED by its popularizers (Hicks, Samuelson).","sources_in_conflict":["IEA / Austrian revisionism (no real break)","vs the standard 'Keynesian Revolution' framing","vs post-Keynesians (a real break, then domesticated)"],"type":"whig-vs-revisionist","why_interesting":"Two-sided: the magnitude of the weld is disputed from BOTH directions (it wasn't a real break / it was a real break that got domesticated). The child is genuinely status-at-a-time and observer-relative — its very EXISTENCE as a distinct wrapper is frame-dependent (in {knowledge} it may be a relabeling; in {meaning}/{politics} it unmistakably reorganized the state). This is WHY frame_of_weld engages {meaning} (the QG-like reason). Rendered at child.status_trajectory + frame_of_weld {meaning}.","confidence_impact":"Lowers confidence that 1936 was a clean single 'revolution' to ~0.65; supports reading the child as observer-/frame-relative."},{"what":"The dormancy is CONTESTED in extent and cause. The 1970s 'death of Keynes' is partly an ideological narrative; Keynesianism survived inside the neoclassical synthesis and New Keynesianism throughout, and the dormancy was driven as much by an exogenous neoliberal POLITICAL movement (Thatcher/Reagan/Chicago funding) as by the stagflation falsification.","sources_in_conflict":["Wikipedia 'Stagflation' / 'Keynesian Revolution' (stagflation as the falsifier)","vs accounts foregrounding the neoliberal political turn (Thatcher/Reagan/Chicago) as the driver","vs the fact of survival-inside-the-synthesis throughout"],"type":"dormancy-contested","why_interesting":"Dormancy has a CAUSE-FRAME split (the Darwin+Mendel / QG finding): partly knowledge-frame (stagflation falsified the Phillips curve) and partly physical/political-frame (a funded ideological movement displaced it from curricula and treasuries). A single 'why' string cannot hold both. Confirms dormancy.why_frame (R11) with an economics instance: a theory can be SUPPRESSED by a political turn as well as by a refuting fact. Rendered at weld.dormancy_intervals[1].why_frame = 'knowledge, physical/political' + forcing_events fe-stagflation + fe-neoliberal-turn.","confidence_impact":"Lowers confidence in the clean 'stagflation killed Keynes' story to ~0.6; the FACT of the eclipse stays high (~0.82); confirms the why_frame split."},{"what":"The child has NO single stable identity across its revivals: revived-2008 ≠ original-1936. The 2008 revival was New-Keynesian (sticky-price microfoundations inside a neoclassical-equilibrium DSGE frame) — closer in METHOD to Keynes's classical opponents than to Keynes; the 2020 revival flirted with MMT, a different heterodox object again.","sources_in_conflict":["Wikipedia 'New Keynesian economics' (microfounded, DSGE, neoclassical assumptions)","vs 'Keynesian economics' as Keynes's own object","vs the MMT literature (2020) as a further different object"],"type":"contested-genealogy","why_interesting":"revived-as-REINTERPRETED, not revived-as-same (R10): each resurrection wakes a structurally different object wearing the same name. The seam S is non-unitary and itself contested (R12) — 'Keynesianism' names at least four mutually-critical wrappers (orthodox/IS-LM, post-Keynesian, New Keynesian, MMT-adjacent) that disagree about what the child IS, much like QG's candidate-children but spread across TIME rather than held simultaneously. Rendered at weld.revival.kind='reinterpreted' + weld.feature_ledger + harvest.descendants + S_structure.agreed=false. -> motivates a degree-of-reinterpretation / method-continuity axis (see gaps).","confidence_impact":"Lowers confidence in the child as a single stable wrapper to ~0.55; supports S_structure.agreed=false and the diachronic-candidate-children frontier note."},{"_comment":"The R9-confirming discrepancy, from a NEW direction vs QG.","what":"surprise_confidence (~0.9) and child_confidence (~0.72) DIVERGE. The synergy (stable under-full-employment equilibrium; the invention of macroeconomics) is real and decisive; but the child as a STABLE, agreed wrapper is low-confidence because it has been pronounced dead and exhumed repeatedly and fractures into rival schools.","sources_in_conflict":["the well-attested synergy (the under-employment equilibrium; the paradox of thrift) at ~0.9","vs the contested, unstable-over-time, school-fractured child at ~0.72"],"type":"framework-vs-record-tension","why_interesting":"Confirms R9 (decouple surprise from child-confidence) from a NEW direction vs QG. In QG the child is UNBORN (high surprise, low child-confidence because nothing consolidated). Here the child was BORN, hardened, DIED, and was RE-BORN differently — high surprise, but lower child-confidence because the child is unstable-OVER-TIME, not unborn. A second, distinct MODE of the same orthogonality: synergy can be real while the child is perpetually-contested rather than merely-unborn. Rendered at weld.surprise_confidence (0.9) vs child.confidence (0.72).","confidence_impact":"Defines the gap between the two axes as the specimen's signature; neither axis moves the other."},{"what":"Is a third wrapper (macroeconomics-as-a-distinct-object) even NEEDED? A serious minority (new-classical / real-business-cycle / Austrian) argues NO — the economy IS just the equilibrium of optimizing individuals (microfoundations primary; 'macroeconomics' a category error, the Lucas-critique position). The Keynesian mainstream and the bare fact of mass involuntary unemployment argue YES (the aggregate has emergent properties — paradox of thrift — absent in any agent).","sources_in_conflict":["new-classical / RBC / Austrian (no child; the aggregate is summed agents; the Lucas critique)","vs the Keynesian mainstream + the fact of mass involuntary unemployment (the aggregate has emergent properties)"],"type":"framework-vs-record-tension","why_interesting":"Confirms weld_necessity_confidence (R8) with an economics instance held at ~0.78: the weld is almost certainly real (the Depression and 2008 are hard to explain agent-by-agent), but its NECESSITY is genuinely disputed by a school that CAPTURED the discipline for a generation — the falsifier-of-the-weld, live, not 1.0. Stronger than QG's semiclassical-dissent slot because here the dissent WAS the orthodoxy for ~25 years. Rendered at weld.weld_necessity_confidence = 0.78 + harvest desc-newclassical + relatives rel-austrian.","confidence_impact":"Holds weld_necessity_confidence at 0.78 (not 1.0); the necessity is the disputed quantity, not the weld's reality."}],"forcing_events":[{"_comment":"(D4) THE defining exogenous forcing of this specimen — the SQUEEZE that pulled the theory into existence and government. This specimen's whole lifecycle is paced by such events (see gaps: external_events may deserve to be the PRIMARY timeline axis for crisis-pulled wrappers).","id":"fe-depression","name":"The Great Depression (1929-33; ~30% GDP fall, ~25% US unemployment)","kind":"economic-crisis","direction":"both","_direction_note":"BOTH: it SQUEEZED the old classical order (discrediting self-correction) AND PULLED the new theory into existence. Recorded as both because the pull on W_C and the squeeze on W_A are the same event's two faces.","acted_on":[{"target":"weld-general-theory","target_kind":"weld","effect":"accelerate","strength":0.95},{"target":"pf-underconsumption","target_kind":"sub_wrapper","effect":"elevate","strength":0.85,"_note":"revived the ~100-year-dormant demand-deficiency parent"},{"target":"pf-classical","target_kind":"sub_wrapper","effect":"suppress","strength":0.7,"_note":"the squeeze on the classical full-employment orthodoxy"}],"when":"1929-1933 (effects through the 1930s)","mechanism":"The catastrophic failure of self-correction discredited classical orthodoxy (the SQUEEZE on W_A) and created the demand for a theory of mass involuntary unemployment, PULLING the General Theory into existence and creating an audience for it. The defining exogenous forcing of this specimen — and the reason three independent welders (Keynes, Kalecki, the Stockholm School) reached the same weld at once.","confidence":0.92},{"id":"fe-wwii","name":"World War II (1939-45; US deficits up to ~$55bn in 1943)","kind":"war","direction":"pull","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"elevate","strength":0.9,"_note":"consolidation phase — real-world validation"},{"target":"act-us-government","target_kind":"actor","effect":"accelerate","strength":0.85,"_note":"mobilized the theory into permanent government machinery"}],"when":"1939-1945","mechanism":"Massive war deficits restored full employment exactly as Keynes predicted, providing a real-world VALIDATION the Depression-era arguments could not. Mobilized the theory into permanent government machinery (planning boards, the Employment Act, Bretton Woods). Keynes's 'How to Pay for the War' (1940) operationalized it (compulsory saving, deferred pay, anti-inflation). The war did for the CONSOLIDATION what the Depression did for the birth.","confidence":0.88},{"id":"fe-postwar","name":"The postwar settlement (Bretton Woods 1944 + US Employment Act 1946 + UK 1944 White Paper)","kind":"politics","direction":"pull","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"elevate","strength":0.85},{"target":"desc-institutions","target_kind":"child","effect":"fund","strength":0.8,"_note":"created the standing institutions (IMF/World Bank, CEA)"},{"target":"act-us-government","target_kind":"actor","effect":"elevate","strength":0.8}],"when":"1944-1946","mechanism":"Political consensus that mass unemployment was politically intolerable converted Keynesianism into the OFFICIAL doctrine of the mixed-economy state (Councils of Economic Advisers, full-employment statutes, the IMF/World Bank). The institutionalization that made the 'Age of Keynes'.","confidence":0.85},{"id":"fe-stagflation","name":"1970s stagflation + 1973/1979 oil shocks","kind":"economic-crisis","direction":"squeeze","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"suppress","strength":0.85,"_note":"drove it into dormancy"},{"target":"desc-phillips","target_kind":"child","effect":"kill","strength":0.9,"_note":"falsified the naive Phillips-curve trade-off"},{"target":"desc-monetarism","target_kind":"child","effect":"elevate","strength":0.8,"_note":"opened the door for the monetarist counter-revolution"}],"when":"1973-1982 (oil shocks 1973, 1979)","mechanism":"Simultaneous high inflation AND high unemployment falsified the naive Phillips-curve trade-off that Keynesianism had been reduced to, destroying its policy credibility and OPENING the door for the monetarist/new-classical counter-revolution. The squeeze that caused the dormancy (the knowledge-frame half of the cause-frame split).","confidence":0.85},{"id":"fe-neoliberal-turn","name":"The neoliberal / monetarist political turn (Thatcher 1979, Reagan 1981; 'we are all monetarists now')","kind":"politics","direction":"squeeze","_kind_note":"kind: politics, with a strong FASHION component (the free-market intellectual fashion + a curricular/funding shift). Logged as politics primarily.","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"suppress","strength":0.85,"_note":"displaced from policy AND graduate curricula for ~25 years"},{"target":"act-chicago","target_kind":"actor","effect":"elevate","strength":0.8},{"target":"act-us-government","target_kind":"actor","effect":"redirect","strength":0.7,"_note":"demand-management dropped from official policy"}],"when":"1979-2008 (peak displacement 1980s-1990s)","mechanism":"A political-ideological movement (free-market fashion + a funding/curricular shift toward Chicago-style economics) actively displaced Keynesian demand-management from policy and graduate curricula for ~25 years — an exogenous fashion/politics squeeze LAYERED ON the intellectual (stagflation) one. The physical/political-frame half of the dormancy's cause-frame split: a theory suppressed by a funded movement, not only by a refuting fact.","confidence":0.8},{"id":"fe-gfc","name":"The 2008 Global Financial Crisis","kind":"economic-crisis","direction":"pull","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"elevate","strength":0.9,"_note":"the first revival; ended the ~35-year dormancy"},{"target":"desc-newkeynesian","target_kind":"child","effect":"elevate","strength":0.8},{"target":"act-g20","target_kind":"actor","effect":"accelerate","strength":0.85,"_note":"G20 coordinated stimulus"},{"target":"act-china","target_kind":"actor","effect":"accelerate","strength":0.8}],"when":"2008-2009","mechanism":"Conditions resembling the 1930s triggered a near-instant return to fiscal stimulus across G20 governments (ARRA $787bn; China ~$586bn; TARP $700bn) and a 'return of Keynes' — the crisis-pull that ended the ~35-year dormancy. Several prominent anti-Keynesians (Feldstein, Posner) publicly converted; ~300 economists (Barro, Prescott, V. Smith, Buchanan) signed against. Revived a REINTERPRETED (New-Keynesian, microfounded) object.","confidence":0.88},{"id":"fe-covid","name":"The 2020 COVID-19 pandemic","kind":"economic-crisis","direction":"pull","_kind_note":"An exogenous HEALTH shock acting as an economic-crisis forcing — arguably its own kind (a pandemic), logged as economic-crisis for its mechanism (a demand/output collapse pulling fiscal expansion).","acted_on":[{"target":"child-keynesian-macro","target_kind":"child","effect":"elevate","strength":0.85,"_note":"the second revival"},{"target":"desc-mmt","target_kind":"child","effect":"elevate","strength":0.7,"_note":"elevated the MMT variant into the policy conversation"}],"when":"2020-2021","mechanism":"An exogenous health shock produced the largest peacetime fiscal expansion in history (CARES Act $2.2tn + four further bills), reviving demand-management AND elevating the heterodox MMT variant — a second crisis-pull, reinforcing the dormancy-revival-cycling pattern. A different reinterpretation again (MMT-adjacent), confirming revived-as-reinterpreted-DIFFERENTLY-each-time.","confidence":0.85},{"id":"fe-coldwar-mccarthy","name":"Cold War / McCarthyism (the Tarshis-textbook red-scare attacks)","kind":"politics","direction":"both","_direction_note":"BOTH: it did not simply squeeze Keynesianism out — it RESHAPED which VERSION survived, pushing toward a domesticated form (a redirect), which is a squeeze on the radical content and a (perverse) pull on the safe synthesis form.","acted_on":[{"target":"desc-synthesis","target_kind":"child","effect":"redirect","strength":0.6,"_note":"pushed toward a politically-safe 'neoclassical synthesis' form"},{"target":"child-keynesian-macro","target_kind":"child","effect":"redirect","strength":0.55,"_note":"diluted the more radical claims"}],"when":"~1947-1955 (the Tarshis textbook attacks 1947; the McCarthy climate early 1950s)","mechanism":"Political pressure (the red-scare attacks on Lorie Tarshis's Keynesian textbook; the climate of McCarthyism) pushed Samuelson/Solow toward a DOMESTICATED 'neoclassical synthesis' that diluted Keynes's more radical claims to make them politically safe — an exogenous force reshaping which VERSION of the child survived (post-Keynesians call the result 'bastard Keynesianism'). A rare example of a forcing event acting on the FORM of a child, not just its rise/fall.","confidence":0.7}],"sources":[{"name":"Wikipedia, 'Keynesian economics'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Keynesian_economics","what_used_for":"predecessors (Malthus/Hobson/underconsumption), key concepts (effective demand, liquidity preference, multiplier related to Kahn 1931), dormancy/revival, schools, Kalecki/Stockholm priority, multiplier deep-genealogy","reliability":0.8,"_reliability_comment":"encyclopedia, well-referenced; multiplier-related-to-Kahn-1931 and Feb 1936 publication web-verified 2026-06-09"},{"name":"Wikipedia, 'The General Theory of Employment, Interest and Money'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/The_General_Theory_of_Employment,_Interest_and_Money","what_used_for":"Feb 1936 publication; the consumption function, aggregate demand, the multiplier (ch.10, related to Kahn 1931), marginal efficiency of capital, liquidity preference, expectations","reliability":0.85,"_reliability_comment":"web-verified 2026-06-09: published Feb 1936; multiplier explicitly related to Kahn 1931 in ch.10"},{"name":"Wikipedia, 'Keynesian Revolution'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Keynesian_Revolution","what_used_for":"institutionalization timeline (Sweden first; Tarshis 1947; Samuelson textbook), Hansen, monetarist counter-revolution timing, the 'revolution'-as-whig-history question","reliability":0.8},{"name":"Wikipedia, '2008-2009 Keynesian resurgence'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/2008%E2%80%932009_Keynesian_resurgence","what_used_for":"government/institution adopters (ARRA $787bn web-verified, China ~$586bn web-verified, UK, G20, IMF), champions (Krugman/DeLong/Shiller) and converts (Feldstein/Posner), opponents (Barro, ~300 economists incl. Buchanan/Prescott/V.Smith), reinterpretation-not-return","reliability":0.8,"_reliability_comment":"web-verified 2026-06-09: ARRA cut to $787bn; China RMB¥4tn/US$586bn announced by the State Council 9 Nov 2008"},{"name":"Wikipedia, 'Neoclassical synthesis'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Neoclassical_synthesis","what_used_for":"Hicks 1937 IS-LM, Modigliani 1944, Samuelson coined the term 1955, stagflation discredit, Hicks's later renunciation (the disowned-mediator)","reliability":0.8},{"name":"Wikipedia, 'How to Pay for the War' (1940)","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/How_to_Pay_for_the_War","what_used_for":"WWII Keynesian wartime fiscal strategy (compulsory saving, deferred pay, anti-inflation) — the consolidation-phase operationalization","reliability":0.8},{"name":"Wikipedia, 'New Keynesian economics'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/New_Keynesian_economics","what_used_for":"late-1970s emergence, menu costs (Mankiw), sticky prices, DSGE integration with neoclassical assumptions — the revival-#1 reinterpreted object","reliability":0.8},{"name":"Wikipedia, 'Stagflation'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Stagflation","what_used_for":"1970s simultaneous inflation+unemployment falsifying the Phillips-curve Keynesian form; monetarist ascendancy — the knowledge-frame half of the dormancy","reliability":0.8},{"name":"Wikipedia 'Michał Kalecki' + HET profile (hetwebsite.net) + 'Did Kalecki Get There First?' (ResearchGate) + Joan Robinson 'A Neglected Prophet' (NYRB 1976)","type":"scholarly-history","url":"https://en.wikipedia.org/wiki/Micha%C5%82_Kalecki","what_used_for":"independent 1933-35 priority; Robinson's advocacy; Kalecki declined to claim priority — the multiple-independent-discovery discrepancy","reliability":0.75,"_reliability_comment":"priority claim genuinely contested in the literature; held ~0.7-0.75"},{"name":"IMF Finance & Development, 'What Is Keynesian Economics?' (Jahan/Mahmud/Papageorgiou, 2014)","type":"scholarly-history","url":"https://www.imf.org/external/pubs/ft/fandd/2014/09/basics.htm","what_used_for":"aggregate-demand core, government-stabilization role, institutional framing","reliability":0.85,"_reliability_comment":"institutional explainer; high reliability for the core doctrine"},{"name":"AEA, 'Keynesianism, Pennsylvania Avenue Style' (J. Econ. Perspectives 1996) + Wikipedia 'Employment Act of 1946'","type":"scholarly-history","url":"https://en.wikipedia.org/wiki/Employment_Act_of_1946","what_used_for":"the 1946 Act created the CEA; govt acceptance of macro-stabilization; Hansen as American disciple","reliability":0.85},{"name":"IEA blog 'Keynes versus the classics — the true story' + Econlib 'Keynesian Economics'","type":"scholarly-history","url":"https://iea.org.uk/blog/keynes-versus-the-classics-%E2%80%93-the-true-story/","what_used_for":"the 'Keynes caricatured/strawmanned the classics' revisionist case (the highest-value framework-vs-record tension, discrepancy #1)","reliability":0.65,"_reliability_comment":"advocacy outlets (free-market), but the historiographical point (Keynes lumped a 'classical' bloc + attributed an always-full-employment assumption) is independently attested; held ~0.65"},{"name":"Reserve Bank of Australia Museum, 'Keynesian Economics in Wartime' + Independent Institute 'World War II and the Triumph of Keynesianism' (R. Higgs)","type":"scholarly-history","url":"https://museum.rba.gov.au/exhibitions/make-your-money-fight/keynesian-economics-in-wartime/","what_used_for":"WWII deficits as validation; the contrarian 'Keynes did <script type="application/json" id="spec-deep_learning" data-key="deep_learning">{"_template_doc":"CANONICAL WRAPPER-GENEALOGY SPECIMEN — v2 — one merge event rendered as a rooted genealogy graph that STOPS AT THE PRESENT. Spec: ../SCHEMA_v2.md. Tier-3 exploratory data-harvest for Cowork+Pav ratification — NOT canon, NOT a promotion, convergence list stays 9. THIS SPECIMEN IS THE MULTI-CYCLE DORMANCY-REVIVAL + INSTITUTIONAL/GOVERNMENT/CORPORATE-ACTOR + COMPUTE/FUNDING/FASHION-FORCING CASE: the connectionist program twice went dormant (AI winters) and twice revived REINTERPRETED, finally CONSUMMATING at 2012 AlexNet when two non-idea INSTRUMENT-parents (GPU compute, ImageNet data) arrived. It is the v2 calibration instrument hammering all five new dimensions D1-D5. Extends the deep-learning / model-merging family already in wrapper_classes_phase1.json (#6 model merging, #7 Allen-Cahn message passing, #9 BES) at a far deeper HISTORICAL zoom. NOT a 10th convergence; a worked example. Every node/edge carries confidence in [0,1] + a zoom/LOD depth + a frame_layer; graded membership is the pervasive default (D5). bits_note QUALITATIVE ONLY. Sources cited in sources[]; discrepancies[] carries the real-record fuzzy frontier.","schema_version":"0.2-canonical-genealogy","specimen_id":"deep-learning","_status":"Tier-3 WORKING specimen — exploratory data-harvest, surfaced for Cowork+Pav ratification. NOT canon, NOT a tier promotion, does NOT grow the convergence list (stays 9). All confidences are SOFT scores in [0,1]; bits are qualitative only. This is the batch's richest MULTI-CYCLE-DORMANCY specimen and its strongest D2 (institutional/government/corporate actors) + D4 (compute/funding/fashion pull-squeeze) case.","extends":{"_comment":"Linkage back to the Phase-1 wrapper CLASS this merge-event specimen instantiates (SCHEMA_v2.md §5). Same graph, deeper zoom. This specimen sits BELOW (historically upstream of) the deep-learning/model-merging family already in the DB: the 2012 e fact, HIGH (~0.9) on the actors/institutions and the forcing events, but the DORMANCY INTERVALS and the priority-attribution are FRONTIER (~0.55-0.75: Haigh's revisionism contests the winter narrative; the Schmidhuber re-attribution dispute is live and bitter). Unlike QG (0.45), the child here is REAL and DOMINANT — the fuzz is in the dormancy-narrative and the credit, not in the existence of the child. weld_necessity_confidence ~0.95 (a third was unambiguously produced); surprise_confidence (0.9) and child-confidence (0.95) are BOTH high here, but the R9 decoupling still bites in TIME: the surprise was demonstrated working ~23 years before the child consolidated.","schema_capabilities":{"_comment":"(D3+D5) Declared render capabilities. Static block — announces what a v2 render supports.","layer_filter":{"_comment":"(D3) The render is FILTERABLE on the physical/latent axis; actors are the bridge.","supported":true,"axes":["physical","latent"],"bridge_via":"actors","note":"A render may show the PHYSICAL view (Rosenblatt, Hinton, DARPA, CIFAR, NVIDIA, ImageNet labor, Toronto/Google/OpenAI) OR the LATENT view (connectionism, backprop, representation learning, deep learning, transformers); every node declares frame_layer; actors straddle and connect the two. This specimen is hand-checkable under each filter — see fuzzy_layer.core_boundary_locus and the per-node frame_layer tags."},"graded_membership":{"_comment":"(D5) Fuzzy edges by design — graded membership is the pervasive default.","supported":true,"default":"graded","applies_to":["node membership","weld extent (sub_welds)","actor role-strength (carrier/inhabitant)","forcing-event influence (acted_on.strength)","frame-layer straddle (physical/latent membership)","lifecycle phase membership","weld_type weight"],"note":"Every boundary is a membership/confidence in [0,1]; the certain core is just where membership ~1.0. Crisp = the membership happens to be ~0/1. Here the dormancy-interval EDGES are deliberately soft (1969-86 and 1995-2006 have fuzzy endpoints; Haigh disputes whether the first 'winter' had crisp edges at all)."}},"child":{"_comment":"W_C — the emergent wrapper born in this merge: DEEP LEARNING as a working, dominant paradigm (the connectionist program vindicated). The trunk node. Unlike QG this trunk is FULL — a real, distinct, hegemonic child — but it took ~70 years and two winters to consolidate.","id":"child-dl","name":"Deep learning (the connectionist program vindicated)","kernel":"Stack many layers of simple differentiable units, train the whole stack end-to-end by gradient descent (backpropagation) on large labeled data with massive parallel compute, and let useful representations EMERGE (distributed, sub-symbolic) rather than be hand-coded. Net product: a general-purpose function approximator + representation learner that, at scale, supersedes hand-engineered features and symbolic rules across vision, speech, language, and games. CRUCIAL contrast with QG: this kernel describes an EXISTING, dominant object, not a sought target — the weld_necessity question is ~1.0 here.","frame":["time","knowledge","meaning","space"],"_frame_note":"knowledge+meaning primary (what intelligence IS — emergent statistical structure vs explicit symbol manipulation, a meaning-frame displacement of the rival paradigm); time (the ~70-year multi-cycle lifecycle is intrinsic to the specimen); space enters literally as the optimization landscape / parameter space that gradient descent searches.","frame_layer":{"_comment":"(D3) An idea-paradigm child — latent ~1.0.","layer":"latent","physical_membership":0.05,"latent_membership":1},"status":"risen","_status_enum":"risen (hardened/hegemonic). Contrast QG's 'open-conjecture': this child unambiguously rose. But the SINGLE enum is lossy — the honest value is the status_trajectory below (dormant-conjecture -> reinterpreted-revival -> dark-ages -> reinterpreted-revival -> risen -> hegemonic). status as a single enum captures only the endpoint.","status_trajectory":[{"_comment":"(R5) the child as a TRAJECTORY of states — the headline multi-cycle feature. This is the strongest status_trajectory in the batch (more cycles than Darwin+Mendel's pluralist->hardened->contested).","state":"dormant-conjecture (latent in the substrate; perceptron a shallow classifier, deep-net conjecture un-adopted)","when":"1969-1986","by":"post-Minsky-Papert neural-net winter","confidence":0.8},{"state":"reinterpreted-revival (single-layer perceptron -> multi-layer backprop net)","when":"1986 (PDP) + 1982 (Hopfield)","by":"Rumelhart-Hinton-Williams; Hopfield","confidence":0.85},{"state":"dark-ages / dormant-again ('Hinton's dark ages'; SVMs/kernel methods fashionable)","when":"~1995-2006","by":"kernel-methods fashion wave","confidence":0.7,"_confidence_note":"Lower confidence: the 'dark ages' label is Hinton's own retrospective framing; the exact span is soft."},{"state":"reinterpreted-revival #2 (shallow backprop -> deep belief nets / deep CNNs)","when":"2006","by":"Hinton (deep belief nets); CIFAR program carrying the flame","confidence":0.82},{"state":"HARDENED / risen (the weld FIRES at three-parent convergence)","when":"2012","by":"AlexNet (Krizhevsky-Sutskever-Hinton)","confidence":0.95},{"state":"hegemonic / active (transformers -> LLMs)","when":"2017 (transformers) -> 2022 (ChatGPT)","by":"Google Brain (Vaswani et al.); OpenAI","confidence":0.95}],"confidence":0.95,"_confidence_comment":"0.95 = confidence the child is a real, distinct, dominant emergent (not a relabel of a parent / not a pile). HIGH and well-attested (deep learning is the dominant paradigm of 2010s-2020s AI). (R9) INDEPENDENT of surprise_confidence — both happen to be high here, but the decoupling shows up in TIME (surprise demonstrated 1989, child consolidated 2012). Compare QG's 0.40 (unborn child); this 0.95 is a consummated weld.","utility":{"_comment":"Pav's three utility legs. Unlike QG these are REALIZED, not promised.","unifier":"REALIZED: deep learning unified vision, speech, language, and game-playing under ONE architecture+training-recipe (differentiable layers + backprop + scale), superseding decades of separate hand-engineered, domain-specific, symbolic pipelines. A single general method replaced many bespoke ones — the deepest methodological unification in modern AI. passesW_CTest: YES (~0.95).","compressor":"QUALITATIVE: a trained deep net compresses an enormous labeled corpus into a fixed parameter set + learned representations; scaling laws (Kaplan 2020) make loss a smooth power-law in compute+data+params, i.e. capability is PREDICTABLE from scale — a striking regularity. BUT no numeric bit value asserted: MDL-on-learned-representations is itself an OPEN PROBLEM (a near-principled-null per R16) — you cannot cleanly MDL-score what the network has compressed. See bits_note.","action_spaces_unlocked":["End-to-end representation learning — the network discovers WHAT to represent, not just how to weight fixed features (the core unlock).","Transfer / pretraining+fine-tuning — features learned on one task transfer to others (ImageNet pretraining; later foundation models).","Sequence modeling at scale -> transformers -> large language models -> ChatGPT-class assistants.","Generative modeling — GANs, diffusion models, neural machine translation, AI-generated art.","Deep reinforcement learning — AlphaGo/AlphaZero, game-playing and control.","Scientific deep learning — AlphaFold (protein structure), and the model-merging/message-passing leaves already in the Phase-1 DB (#6/#7/#9)."]}},"weld":{"_comment":"The merge: parents -> child. THE HEART OF THE SPECIMEN. Here the idea-weld EXISTED by 1986/1989 but only FIRED into a risen child at 2012 when two INSTRUMENT-parents arrived — the apparatus, not the idea, was rate-limiting. This is the schema's cleanest INSTRUMENT-ENABLED-WELD and its strongest multi-cycle DORMANCY case. The honest parent set is ~5 typed parents (2 ancestral content/method + 1 mediating welder + 2 gating instruments); the binary {neural-substrate x optimization-calculus} is a defensible but lossy 2-projection — see parents_full and discrepancies[0].","id":"weld-main","parents":[{"_role":"W_A","name":"Connectionist substrate — artificial neural networks (adjustable-weight nets)","kernel":"Brain-inspired distributed computation: networks of simple units with adjustable connection weights that learn from data. Lineage: McCulloch-Pitts logical neuron (1943) -> Hebb learning (1949) -> Rosenblatt perceptron (1958) -> Fukushima Neocognitron (1980). frame {knowledge,space}.","frame":["knowledge","space"],"confidence":0.95,"parent_kind":"content","_parent_kind_enum":"(R4) content — the substrate / what gets trained."},{"_role":"W_B","name":"Continuous-optimization / differentiable-calculus apparatus (gradient descent via the chain rule)","kernel":"Minimize a differentiable objective by gradient descent, computing gradients via the chain rule (reverse-mode automatic differentiation). Lineage: Ivakhnenko-Lapa GMDH (1965, precursor) -> Linnainmaa reverse-mode autodiff (1970) -> Werbos (1974, applied to nets). frame {knowledge,space}.","frame":["knowledge","space"],"confidence":0.9,"parent_kind":"method","_parent_kind_enum":"(R4) method — the optimization procedure, not content."}],"_parents_comment":"(v1, kept) The clean BINARY projection: {neural-substrate x optimization-calculus}. The framework's canonical visualization. ALWAYS present — but here it is explicitly a LOSSY 2-projection of the 5-parent set in parents_full (the consummation required two INSTRUMENT-parents the dyad omits).","parents_full":[{"_comment":"(R1) the honest N-ary parent set: 2 ancestral (content+method) + 1 mediating welder (separately in mediating_wrapper) + 2 gating instruments. parents[] is the 2-projection of the two ancestral ones.","id":"par-substrate","name":"Connectionist neural-network substrate (W_A)","kernel":"Adjustable-weight brain-inspired nets; McCulloch-Pitts 1943 -> Hebb 1949 -> Rosenblatt 1958 -> Fukushima 1980.","frame":["knowledge","space"],"confidence":0.95,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.1,"latent_membership":1}},{"id":"par-optimization","name":"Continuous-optimization / differentiable-calculus (W_B)","kernel":"Gradient descent via the chain rule; Ivakhnenko 1965 -> Linnainmaa 1970 -> Werbos 1974.","frame":["knowledge","space"],"confidence":0.9,"parent_kind":"method","frame_layer":{"layer":"latent","physical_membership":0.1,"latent_membership":1}},{"id":"par-compute","name":"GPU / CUDA massive parallel COMPUTE (gating instrument-parent #1)","kernel":"General-purpose GPU computing makes the matrix-multiply core of deep nets orders of magnitude cheaper. NVIDIA CUDA 2007; AlexNet trained on two GTX 580 GPUs. WITHOUT this instrument the idea-weld (extant 1986/1989) did not fire into a risen child.","frame":["space","time"],"confidence":0.92,"parent_kind":"instrument","_parent_kind_note":"(R4) instrument AND the GATING / rate-limiting parent (the algorithm waited ~23 years for it) — see gaps (parent_is_gating flag).","frame_layer":{"layer":"physical","physical_membership":0.95,"latent_membership":0.1}},{"id":"par-data","name":"ImageNet large-scale labeled DATA (gating instrument-parent #2)","kernel":"14M+ labeled images (Fei-Fei Li 2009, labeled via Amazon Mechanical Turk crowd labor) — the large-scale supervised signal deep nets need to generalize. The second non-idea instrument that gated the 2012 weld.","frame":["space","time"],"confidence":0.9,"parent_kind":"instrument","frame_layer":{"layer":"physical","physical_membership":0.9,"latent_membership":0.15}}],"mediating_wrapper":{"_comment":"(R1) the agent that PERFORMED the weld, a layer up from the ancestral parents — the Darwin+Mendel population-genetics analogue. Backprop-as-neural-training + the PDP group's connectionist framing recognized that 'neuron weights' and 'the variables you differentiate' are the SAME object.","name":"Backpropagation-as-neural-training + the PDP connectionist framing","kernel":"Rumelhart-Hinton-Williams 1986 (backprop popularized for multi-layer nets) + the PDP group's parallel-distributed-processing framework; with Hopfield 1982 (spin-glass bridge) + the Boltzmann machine (Hinton-Sejnowski/Ackley 1985) as the physics-respectability sub-weld. This is what WELDED W_A and W_B — it is not itself one of the ancestral parents but the mediator that fused them.","who_or_what":"David Rumelhart, Geoffrey Hinton, Ronald Williams + the UCSD PDP Research Group; John Hopfield; Terry Sejnowski","confidence":0.92},"shared_sub_object_S":"S = the differentiable parameterized FUNCTION trained to minimize error — the realization that a neural network IS a composed differentiable function whose weights live in a continuous space gradient descent can search. Concretely: 'neuron weights' (the connectionist substrate's adjustable parameters, W_A) and 'the variables of an objective you differentiate' (the optimization calculus's degrees of freedom, W_B) are the SAME OBJECT; backprop is the chain rule recognizing that identity. The loss landscape / parameter space / chain-rule gradient flow. AT THE 2012 CONSUMMATION the seam WIDENS to a three-way seam: it absorbs the DATA MANIFOLD (ImageNet) and the COMPUTE substrate (GPU SIMD parallelism maps onto the matrix-multiply structure of layers) — algorithm, data geometry, and hardware parallelism coincide. Unlike Darwin+Mendel's fractured S, this S is largely AGREED.","S_structure":{"_comment":"(R12) S is multi-faceted but AGREED (contrast Darwin+Mendel's Fisher-Wright rift). agreed:true. The widening at consummation (algorithm/data/hardware) is the notable structure.","components":["the loss landscape / continuous parameter space","the chain-rule gradient flow (the weld_operator)","(at consummation) the data manifold (ImageNet)","(at consummation) the GPU SIMD/matrix-multiply compute substrate"],"internal_conflict":"","agreed":true},"surprise":"The synergy neither parent predicts alone: that STACKING MANY LAYERS of the simple connectionist unit and training the whole stack by gradient descent yields EMERGENT, hierarchical, distributed REPRESENTATIONS that automatically discover features — making a single general architecture beat decades of hand-engineered, domain-specific, symbolic solutions across vision, speech, language, and games. Neither parent alone reaches it: the neural substrate alone (perceptron) is a SHALLOW classifier that provably cannot compute XOR (Minsky-Papert 1969); the optimization calculus alone is just curve-fitting. Only JOINTLY — a deep differentiable net + backprop gradient flow + (at consummation) enough compute and data — does 'representation learning' appear: the network learns WHAT to represent, not just how to weight fixed features. The DEEPEST surprise is a MEANING-FRAME shift: intelligence-as-explicit-symbol-manipulation (the rival symbolic paradigm's axiom) is displaced by intelligence-as-emergent-statistical-structure-in-a-trained-function. A SECOND-ORDER surprise sits on top: SCALING LAWS (Kaplan 2020) — loss falls as a smooth power law in compute+data+parameters — so the child's capability is PREDICTABLE from scale alone, a regularity neither parent nor even the 1986 welders anticipated. The META-SURPRISE for the schema is the R9 DECOUPLING-IN-TIME: surprise_confidence was already ~0.9 and the synergy was DEMONSTRATED WORKING (LeNet on real handwritten digits, deployed reading bank cheques, 1989) ~23 years BEFORE the child consolidated as the dominant paradigm (2012) — a maximally fertile, repeatedly-demonstrated weld that stayed unborn-as-paradigm through TWO winters for want of the instrument-parents.","surprise_confidence":0.9,"_surprise_confidence_comment":"(v1, R9) HIGH (0.9): the synergy (deep+backprop = emergent representation learner) is real, non-additive, and was DEMONSTRATED, not merely conjectured. ORTHOGONAL to child.confidence — here BOTH are high, but the decoupling bites in TIME: the synergy was a deployed product (1989) ~23 years before the dominant child rose (2012). The most extreme batch case of demonstrated-but-not-adopted (see gaps). Synergy assessed QUALITATIVELY only; no bits fabricated.","surprise_priority":{"_comment":"(R15) the deep-learning surprise pre-existed its 2012 consummation as a working-but-unadopted result inside the substrate — and in a STRONGER state than QG's conjecture-in-a-parent: not merely conjectured, but DEMONSTRATED working and IGNORED (see gaps: 'demonstrated-not-adopted' is stronger than 'conjectured-not-confirmed').","first_conjectured_by":"Ivakhnenko-Lapa (GMDH, 1965; 8-layer net by 1971) and Werbos (1974); DEMONSTRATED at scale-for-its-day by LeCun (LeNet, 1989, deployed on bank cheques)","when":"1965 (conjectured) / 1989 (demonstrated working)","dormant_interval":"~1965-2012 as a paradigm (the synergy worked but was not adopted as dominant for want of compute+data scale)","confidence":0.85},"bits_note":"QUALITATIVE ONLY — and here a NEAR-PRINCIPLED-NULL per R16, for a different reason than QG. The child EXISTS (so it is not undefined-because-unborn), but the compression question ('how many bits does the learned representation save?') is itself an OPEN PROBLEM: MDL-on-learned-representations / the description length of a trained deep net is unresolved (minimum-description-length and deep learning is an active, unsettled research area). Qualitative bit-claims one CAN make: (a) scaling laws (Kaplan 2020; Chinchilla 2022) show loss is a smooth power-law in compute+data+params — a strong regularity suggesting predictable compression-with-scale; (b) a trained net compresses a labeled corpus into a fixed parameter set + reusable representations. But NO numeric bit value is asserted — the clean MDL delta is not cleanly computable here. NO bit values fabricated.","survived":["The adjustable-weight unit (the connectionist neuron) — survived from W_A as the atomic building block of every deep net.","Gradient descent + the chain rule (backprop) — survived from W_B as the universal training procedure.","Distributed / sub-symbolic representation (W_A's philosophy) — survived and was vindicated as the dominant account of what the net learns.","The differentiable composed function as the object of study — the seam S itself, survived as the foundational abstraction (a net IS a differentiable function).","Brain-inspiration as motivation (McCulloch-Pitts/Hebb lineage) — survived rhetorically, though the engineering diverged from biology."],"dropped":["Biological fidelity — modern deep nets dropped most neuroscientific realism (no spikes, backprop is biologically implausible); the brain-inspiration is loose.","The single-layer perceptron's provable limitations (XOR) — dropped by going DEEP (multi-layer + nonlinearity).","Hand-engineered features / symbolic rules (the RIVAL paradigm's core) — dropped wholesale; displaced rather than fused (see weld_type: fusion-by-displacement).","Unsupervised pretraining via deep belief nets (the 2006 revival trigger) — partly dropped after ~2012-14 once large labeled data + better initialization/ReLU/dropout made it unnecessary; a revival-trigger that the consummated child later shed.","Symbolic AI's explicit knowledge representation — dropped as the dominant approach (though neuro-symbolic hybrids persist as a minority)."],"feature_ledger":[{"_comment":"(R7) OPTIONAL — here a LIGHT use: a single consummated child makes flat survived/dropped largely sufficient, but the rival-paradigm contrast (deep-learning vs symbolic AI) is worth one ledger row to show fusion-by-displacement (the rival's feature is dropped, not kept).","feature":"explicit hand-coded features / symbolic rules (the symbolic-AI paradigm's core commitment)","kept_by":["neuro-symbolic hybrids (minority descendants)"],"dropped_by":["mainstream deep learning (the consummated child) — displaced the rival wholesale rather than fusing with it"]}],"frame_of_weld":["knowledge","space","time","meaning"],"_frame_of_weld_note":"knowledge (the identity 'weights = differentiable variables') + space (the parameter/loss landscape the gradient searches) are where the PHYSICS of the weld holds. time is load-bearing here in a way it is not for Maxwell: the weld is a PROCESS spanning ~70 years with two dormancies, and crucially the weld DID NOT FIRE until the instrument-parents arrived in time. meaning enters because the consummation was also a paradigm-displacement (symbolic -> connectionist) adjudicated partly sociologically (funding fashion, AI-winter narratives, the priority/credit disputes).","weld_operator":"The GRADIENT — the d(loss)/d(weights) backward flow (backpropagation / the chain rule). Like Maxwell's d/dt displacement-current term, the weld is welded BY a specific operator — the chain-rule gradient — not merely IN a frame. Static W_A + W_B side by side (a net you cannot train; a calculus with nothing to optimize) make nothing; the gradient is the active ingredient that fuses them.","lod_scale":"Holds at the coarse grain ('neural substrate + gradient descent -> trainable deep net') AND is CONFIRMED by its sub-structure when zoomed in (contrast QG, which shatters). Zooming in reveals an ORDERED CHAIN of sub-welds (perceptron -> Minsky-Papert squeeze -> backprop -> CNN/LeNet -> AlexNet three-element fire -> transformers) each of which BUILDS ON the last rather than rejecting it — the signature of a healthy, eventually-consummated weld. The one twist: the chain has two DORMANCY gaps (the winters) where the weld lay drawn-but-unfired.","sub_welds":[{"_comment":"(R3) the ordered chain of sub-welds; coherence_under_zoom = confirms (each builds on the last). Two of the gaps between sub-welds are dormancies.","id":"sw-perceptron","name":"Perceptron: learnable single-layer neural net (Rosenblatt)","when":"1958","confidence":0.9},{"id":"sw-minsky-papert","name":"Minsky-Papert 'Perceptrons': single-layer XOR impossibility -> winter (a SQUEEZE sub-weld, the anti-weld)","when":"1969","confidence":0.9},{"id":"sw-backprop","name":"Backprop for multi-layer nets (Rumelhart-Hinton-Williams) — the mediating weld fires; + Hopfield 1982 physics bridge","when":"1986 (+1982)","confidence":0.88},{"id":"sw-lenet","name":"LeNet: working CNN on real handwritten digits (LeCun), deployed reading bank cheques — the surprise DEMONSTRATED","when":"1989","confidence":0.88},{"id":"sw-dbn","name":"Deep belief nets (Hinton) — the second revival; deep training made practical","when":"2006","confidence":0.82},{"id":"sw-alexnet","name":"AlexNet: the THREE-ELEMENT fire (deep CNN + GPU/CUDA compute + ImageNet data) — the weld consummates","when":"2012","confidence":0.95},{"id":"sw-transformer","name":"Transformer ('Attention Is All You Need', Google Brain) -> LLMs -> ChatGPT — hegemony","when":"2017 -> 2022","confidence":0.9}],"coherence_under_zoom":"confirms","_coherence_under_zoom_note":"(R3) CONFIRMS — the sub-welds form a coherent build-chain (each step uses the last), the hallmark of a healthy consummated weld, the INVERSE of QG (which contradicts/shatters). The only complication is the two dormancy gaps in the chain; the chain itself is coherent across them (the revived object is reinterpreted but continuous in lineage).","when":{"_comment":"(R2) a PROCESS with a duration and several defensible birth-dates — and a CONSUMMATION date distinct from the idea-weld date. The defining feature: the idea-weld (1986) and the firing (2012) are ~26 years apart because the instruments were rate-limiting.","from":"1943 (McCulloch-Pitts substrate root) / 1958 (perceptron) / 1986 (idea-weld: backprop) ","to":"2012 (consummation: AlexNet) — child then hardens 2017+ ; lineage continues to present","defensible_dates":["1958 (perceptron — the conjecture)","1986 (backprop/PDP — the idea-weld)","1989 (LeNet — the surprise demonstrated working)","2012 (AlexNet — the three-element consummation / firing)","2017 (transformers — hegemony begins)"]},"dormancy_intervals":[{"_comment":"(R11) CYCLE 1. why_frame names only the frame; the external event is in forcing_events (Minsky-Papert + the symbolic-AI funding capture). Endpoints deliberately soft (D5).","from":"1969","to":"1986","why":"Neural-net winter #1: Minsky-Papert 'Perceptrons' (1969) mathematical critique compounded by the symbolic-AI funding capture of the mid-1960s. The hidden-layer training problem was held unsolvable until backprop.","why_frame":"knowledge AND physical/political (a theorem-squeeze compounded by an institutional defunding)"},{"_comment":"(R11) CYCLE 2 — 'Hinton's dark ages'. why_frame = fashion + insufficient-instrument. Endpoints soft.","from":"~1995","to":"~2006","why":"Neural-net winter #2: kernel methods / SVMs became fashionable and outperformed nets on the era's small data + weak compute; nets marginalized/underfunded; only a handful (Hinton, Bengio, LeCun) persist, carried by CIFAR.","why_frame":"meaning (fashion) AND physical (insufficient compute/data instrument not yet ready)"}],"revival":{"_comment":"(v1, R10) TWO revivals, both REINTERPRETED (see weld_chain for the cycle structure; this object records the headline). kind = reinterpreted — the object that revives is never the object that went dormant.","when":"1986 (revival #1) and 2006 (revival #2); CONSUMMATED 2012","by":"Revival #1: Rumelhart-Hinton-Williams (PDP/backprop) + Hopfield (physics bridge). Revival #2: Hinton (deep belief nets), carried through the trough by CIFAR.","trigger":"Revival #1 trigger = backprop solving the hidden-layer training problem Minsky-Papert called unsolvable + Hopfield's statistical-mechanics/spin-glass bridge making nets respectable to physicists. Revival #2 trigger = Hinton's 2006 deep belief nets + the CIFAR program networking the marginalized connectionists; CONSUMMATION trigger = the 2012 arrival of GPU compute + ImageNet data.","kind":"reinterpreted","_kind_note":"(R10) REINTERPRETED, three times over: single-layer perceptron -> gnature of a consummated weld with a contested historiography."},"discrepancies":[{"_comment":"THE central framework-vs-record tension — the three-element consummation directly hits R1+R4.","what":"THE THREE-PARENT CONSUMMATION vs the binary weld. AlexNet 2012 is framed by Wikipedia AND Fei-Fei Li verbatim as 'three fundamental elements converged for the FIRST time': algorithm (deep CNN) + compute (GPU/CUDA) + data (ImageNet). Two of the three (compute, data) are INSTRUMENTS, not content — a parent_kind=instrument case. The clean two-parent (substrate x calculus) weld cannot hold the actual consummation, which required two non-idea instruments to arrive. The weld did NOT fire when the algorithm existed (1989) — it fired only when the two instruments arrived (~2012).","sources_in_conflict":["Wikipedia 'AlexNet' (three-element-convergence framing)","Fei-Fei Li ('three elements converged for the first time')","the clean two-parent framework projection"],"type":"framework-vs-record-tension","why_interesting":"The single biggest framework signal: the historical record's OWN language ('three elements converged') is a direct empirical hit on R1 (N-ary parents) + R4 (parent_kind: instrument). Strongly supports the instrument-enabled-weld type and a 'weld awaits its apparatus' lifecycle. -> motivates parents_full + parent_kind=instrument (R1/R4) AND a parent_is_gating/rate_limiting flag (see gaps). The convergence is well-attested (~0.95); it PROVES the binary projection is lossy here.","confidence_impact":"Does not lower child-confidence (the child is real); RAISES the value of parents_full and the instrument-parent machinery. Forces the 5-parent honest set."},{"_comment":"Re-attribution — the deep-learning analogue of Maxwell's, but FAR hotter (live, bitter).","what":"RE-ATTRIBUTION: 'deep learning' is canonically credited to Hinton/Bengio/LeCun (2018 Turing) and Hopfield/Hinton (2024 Nobel), but the originating techniques were earlier: backprop's reverse-mode = Linnainmaa o-first-ai-winter/","what_used_for":"The dormancy-contested SIGART membership argument (1,241 in 1973, 3,500 by 1978).","reliability":0.85,"_reliability_comment":"peer-reviewed venue; accessed via SEARCH SUMMARIES, full text 403-blocked — argument reconstructed from multiple summaries, held ~0.85 not 1.0 (sourcing caveat, see gaps)."},{"name":"Wikipedia — 'Jurgen Schmidhuber'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/J%C3%BCrgen_Schmidhuber","what_used_for":"The 17-point priority dispute, 88-page report, 'plagiarism' accusation vs Hinton/Bengio/LeCun, LeCun's rebuttal.","reliability":0.75},{"name":"Schmidhuber's own pages (who-invented-backpropagation; critique-turing-award)","type":"primary","url":"https://people.idsia.ch/~juergen/who-invented-backpropagation.html","what_used_for":"The originator-priority counter-narrative (Ivakhnenko, Amari, Linnainmaa, Werbos).","reliability":0.6,"_reliability_comment":"PARTISAN PRIMARY SOURCE — one side of the dispute; held ~0.6 and flagged as one-sided (see gaps)."},{"name":"Wikipedia — 'Alexey Ivakhnenko' & 'Group method of data handling'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Group_method_of_data_handling","what_used_for":"GMDH 1965 'Cybernetic Predicting Devices', first deep multilayer trained nets, 8-layer net by 1971 (the deepest priority root).","reliability":0.8},{"name":"CIFAR — 'Turing Award honours CIFAR pioneers' / 'Canada's foundational role in generative AI'","type":"aggregator","url":"https://cifar.ca/cifarnews/2019/03/27/turing-award-honours-cifar-s-pioneers-of-ai/","what_used_for":"The 2004 Neural Computation and Adaptive Perception program, ~$2.5M/5yr, Hinton director, carrier-through-dormancy.","reliability":0.7,"_reliability_comment":"self-reported (CIFAR's own account) but factual on dates/$."},{"name":"Wikipedia — 'CUDA' + Quartr/Chip Letter on NVIDIA","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/CUDA","what_used_for":"CUDA 2007, GPGPU, the compute instrument that gated AlexNet.","reliability":0.75},{"name":"Wikipedia — 'Attention Is All You Need'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Attention_Is_All_You_Need","what_used_for":"Transformer 2017, Google Brain authors, attention (Bahdanau 2014) lineage, the harvest path to LLMs.","reliability":0.85},{"name":"IEEE Spectrum + Nobelprize.org — 2024 Nobel Prize in Physics","type":"primary","url":"https://www.nobelprize.org/prizes/physics/2024/","what_used_for":"2024 Nobel to Hopfield+Hinton, spin-glass/Ising physics justification, the 'is it physics' + Schmidhuber 'rewards plagiarism' controversy.","reliability":0.85},{"name":"ImageNet creation (Pinecone / Britannica / Zilliz on Fei-Fei Li)","type":"aggregator","url":"https://www.pinecone.io/learn/imagenet/","what_used_for":"ImageNet 2007-2009, 14M images, Amazon Mechanical Turk, Princeton/Stanford.","reliability":0.7},{"name":"CNN lineage (ETHW Milestones:CNN 1989; com-cog-book; Medium histories)","type":"aggregator","url":"https://ethw.org/Milestones:Convolutional_Neural_Networks_(CNN)","what_used_for":"Fukushima Neocognitron 1980 (NHK Japan, Hubel-Wiesel inspired) -> LeCun LeNet 1989 (Bell Labs, MNIST).","reliability":0.7},{"name":"Cybernetics-vs-symbolic schism (Dartmouth 1956; cybernetics Wikipedia; antikythera.org)","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Dartmouth_workshop","what_used_for":"McCarthy distancing from Wiener, symbolic proponents 'gained control of national funding conduits and ruthlessly defunded' neural nets mid-1960s.","reliability":0.7},{"name":"Hopfield/Boltzmann second-wave bridge (Boltzmann machine Wikipedia; IEEE Spectrum)","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Boltzmann_machine","what_used_for":"Hopfield 1982 (spin glass/Ising), Ackley-Hinton-Sejnowski 1985 Boltzmann machine + hidden units.","reliability":0.8},{"name":"Scaling laws / LLM harvest (Kaplan 2020, Chinchilla 2022, GPT/BERT 2018) via sebastianraschka / fabricatedknowledge f and paradigm consolidation (ADOPTION-LAG) is its own variable, STRONGER than conjecture-lag. PROPOSED: a surprise-state value 'demonstrated-not-adopted' + an adoption_lag field. Worked around via surprise_priority (with 'demonstrated working' noted) + discrepancies[4].","INSTITUTIONAL CARRIER-THROUGH-DORMANCY: D2 carrier role is well-supported, but the specific pattern 'a FOUNDATION/STATE deliberately funds a marginalized wrapper through its winter to keep it alive' (CIFAR) is a distinct actor-function worth a NAMED ROLE (flame_keeper / dormancy_patron) beyond generic carrier_of. Worked around via actors[act-cifar].relation='carrier-through-dormancy' + _role_note.","FRAME-OWNERSHIP CONTEST: the 2024 Nobel shows the SAME child claimed by physics / CS / cognitive science — D3's physical/latent straddle plus a WHICH-KNOWLEDGE-FRAME-owns-it dispute. The schema can tag frame[] but has no slot for CONTESTED frame-ownership (which discipline's frame the weld 'belongs' to), relevant where consecration/credit follows frame-ownership. Worked around via discrepancies[7].","SOURCING CAVEAT: the Haigh CACM article full text was 403-blocked; its argument was reconstructed from multiple search summaries (held ~0.85, not 1.0). Schmidhuber's priority claims were read partly from his own partisan pages (held ~0.6, flagged as one-sided primary). No bit-values fabricated (bits_note kept qualitative; on the deep-learning frontier, MDL-on-learned-representations is itself an open problem — a near-principled-null per R16).","WELD-TYPE VOCABULARY EXTENSION: this specimen PROPOSES the new weld-type term 'double-dormancy-revival-weld' (multi-cycle dormancy), proposed in discrepancies[2] before use per §6 item 7 — the core 8-vocabulary has single-cycle types (instrument-enabled, crisis-pulled) but no MULTI-cycle-dormancy type. Used at weight 0.9 in lifecycle.weld_type."]}</script>

tive; placed in fuzzy_layer.frontier)."},{"what":"GERMAN-THREAT illusion: the fear of a Nazi bomb (the chief PULL/justification) was largely groundless — the Uranverein was de-prioritized by Speer in 1942, made a graphite-moderator error, and lost its talent to emigration; Einstein later said he would have 'done nothing' had he known.","sources_in_conflict":["Wikipedia 'German nuclear program during World War II'","Einstein's 1947 Newsweek regret","arXiv histories (Schwab/Turchetta)"],"type":"framework-vs-record-tension","why_interesting":"Forces a refinement on D4 external-events: a pull-event can have a REAL acting force (the fear genuinely drove the program) but a FALSE object (the enemy was a phantom). The 'mechanism' and the 'truth of the trigger' are SEPARABLE — an external_event needs to record not just direction+mechanism but whether the motivating belief was VERIDICAL. The most consequential false-belief-as-driver in the batch. -> motivates a forcing_events.veridical flag (gaps[3]).","confidence_impact":"~0.9 that the fear drove it; ~0.85 that it was misplaced (with honest residual uncertainty about how close Germany 'could' have come)."},{"what":"PRIORITY/CREDIT: the bomb is popularly attributed to Oppenheimer ('father of the atomic bomb') and to Einstein (via the letter), but Einstein did no technical work and called the letter his 'one great mistake'; Szilard conceived the chain reaction, drafted the letter, AND ran the petition against using the bomb; the ~130,000 mostly-anonymous workers (Calutron Girls, segregated Hanford laborers) built it without knowing what it was.","sources_in_conflict":["Wikipedia 'Einstein-Szilard letter'","NPS Manhattan Project NHP (workers)","Atomic Heritage Foundation (women & African-Americans)"],"type":"priority-dispute","why_interesting":"A re-attribution/credit tension analogous to Maxwell's 'named after the wrong node': the canonical names (Einstein, Oppenheimer) attach to a symbolic originator and an integrator, not to the conceiver (Szilard) or the mass labor that physically produced the child. -> suggests the actor model needs to distinguish SYMBOLIC carriers from PRODUCING inhabitants — and that compartmentalized mass labor is a genuine actor-class the people_0 layer omits (gaps[6]). Recorded as a credit dispute, NOT a structural reattribution of the object (so weld.reattribution stays empty).","confidence_impact":"Holds the popular attribution at ~0.5, the distributed reality at ~0.9."},{"what":"DATE/ATTRIBUTION wobble on the letter->action lag: the Einstein-Szilard letter is dated 2 Aug 1939 but was not delivered to FDR until 11 Oct 1939 (by Sachs), and produced only a $6,000 committee that sat largely inert until 1941 — so the popular 'the letter started the Manhattan Project' is a ~2-3 year compression of a slow, near-dormant runway.","sources_in_conflict":["Wikipedia 'Einstein-Szilard letter' (dates)","Wikipedia 'Manhattan Project'","the popular 'the letter started it' narrative"],"type":"date/attribution-conflict","why_interesting":"A clean example of the schema's 'when as an interval not a date' (R2) at the conception phase: the gap between when the weld was DRAWN (Aug-Oct 1939) and when it FIRED (late 1941, post-MAUD + post-Pearl-Harbor) is itself diagnostic — a ~2-year drawn-but-not-firing interval (recorded in dormancy_intervals + the lifecycle dormancy phase). Negligible on substance, but a textbook case for interval-dating the conception->firing lag.","confidence_impact":"Negligible on substance; the ~2-year drawn-but-not-firing interval is recorded at ~0.9."}],"forcing_events":[{"_comment":"(D4) the EXOGENOUS-FORCING 'weather' layer — FIRST-CLASS and LOAD-BEARING here (the antithesis of Maxwell's empty forcing_events). The consummation tempo is attributed MAINLY to these external events. Note the signature D4 finding: a single event (Nazi persecution) has OPPOSITE directions on the two rival lineages, and a pull-event (German-threat fear) can have a real force but enemy (Einstein: 'had I known the Germans would not succeed... I would have done nothing'). A pull-event whose acting FORCE was real but whose OBJECT was a mirage.","confidence":0.9,"_veridicality_note":"(gaps[3]) ~0.9 that the fear DROVE it; ~0.85 that the fear was MISPLACED. This event demonstrates the need for a forcing_events.veridical flag: direction+mechanism are real, the motivating belief is false."},{"id":"fe-emigre-exodus","name":"Nazi racial persecution / the emigre exodus (1933 Civil Service Law; 1938 Anschluss)","kind":"politics","direction":"both","acted_on":[{"target":"act-emigres","target_kind":"actor","effect":"redirect","strength":0.9},{"target":"pf-fission","target_kind":"sub_wrapper","effect":"starve","strength":0.6},{"target":"act-uranverein","target_kind":"lineage","effect":"starve","strength":0.8}],"when":"1933 (Civil Service Law) + Mar 1938 (Anschluss)","mechanism":"The Law for the Restoration of the Professional Civil Service (1933) and the Anschluss (Mar 1938) expelled Jewish and anti-Nazi physicists (Einstein, Szilard, Fermi via his Jewish wife, Teller, Wigner, Bethe, Frisch, Peierls, Bohr), who became the decisive expertise of the Manhattan Project. The SAME political force that STARVED the German weld FED the American one — a single event with OPPOSITE directions on the two rival lineages. The deepest D4 irony of the specimen.","confidence":0.9,"_lineage_relative_note":"(gaps[4]) direction=both because it is LINEAGE-RELATIVE: PULL on the Allied lineage (the emigres became its substrate), SQUEEZE on the Axis lineage (talent exodus). A single event's direction is not global."},{"id":"fe-espionage","name":"Soviet espionage / Klaus Fuchs leak (1942-1945) -> RDS-1 (Aug 1949)","kind":"politics","direction":"both","acted_on":[{"target":"h-deterrence","target_kind":"child","effect":"accelerate","strength":0.8},{"target":"child-bomb","target_kind":"child","effect":"redirect","strength":0.6}],"when":"1942-1949","mechanism":"Fuchs and others passed implosion-bomb design across the secrecy boundary; Western estimates credit it with accelerating the Soviet bomb by ~18-24 months. PULLED the arms race into being / SQUEEZED the US nuclear monopoly out of existence. The exogenous event that converted a single weapon into a bipolar arms race.","confidence":0.9},{"id":"fe-hiroshima","name":"Hiroshima & Nagasaki (6 & 9 Aug 1945) + the surrender of Japan","kind":"war","direction":"pull","acted_on":[{"target":"child-bomb","target_kind":"child","effect":"elevate","strength":0.95}],"when":"6 & 9 Aug 1945","mechanism":"Combat use publicly consummated the weld and locked in the nuclear age; also the locus of the largest MORAL discrepancy (orthodox 'ended the war' vs Alperovitz revisionist 'Japan near surrender, bomb aimed at the USSR'). A pull-event for the child's geopolitical hardening.","confidence":0.95,"_why_contested_note":"~0.95 on occurrence; the WHY is contested (see discrepancies: moral historiography)."},{"id":"fe-postwar-funding","name":"Postwar federal-science-funding settlement (Bush 'Science—The Endless Frontier' Jul 1945 -> AEC 1947 -> NSF 1950)","kind":"funding","direction":"pull","acted_on":[{"target":"h-big-science","target_kind":"child","effect":"fund","strength":0.85},{"target":"h-national-labs","target_kind":"child","effect":"fund","strength":0.85}],"when":"1945-1950","mechanism":"The wartime OSRD model was made permanent: sustained government funding PULLED a whole national-laboratory + university-research complex into existence, the template for Cold-War physics patronage. The weld's organizational form outlived its weapon.","confidence":0.85}],"sources":[{"name":"Wikipedia, 'Manhattan Project'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Manhattan_Project","what_used_for":"institutional chain (Advisory Committee on Uranium->NDRC->OSRD/S-1->Manhattan Engineer District/Groves), dates (MED 13 Aug 1942, Groves 23 Sep 1942, Trinity 16 Jul 1945, Quebec Agreement Aug 1943), scale (~$2bn, ~130,000 peak, three secret cities), contractors (DuPont $1 fee, Stone & Webster), Top Policy Group, Combined Policy Committee.","reliability":0.85},{"name":"Wikipedia, 'Discovery of nuclear fission'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Discovery_of_nuclear_fission","what_used_for":"the physics lineage (Becquerel 1896, Rutherford 1911, Chadwick neutron 1932, Fermi 1934, Ida Noddack 1934), Hahn-Strassmann Dec 1938, Meitner-Frisch liquid-drop ~200 MeV, Frisch naming 'fission' via biologist W. Arnold, Bohr-Wheeler 1 Sep 1939, U-235/U-238 (Bohr), Meitner's refugee flight after the Mar 1938 Anschluss.","reliability":0.85},{"name":"Wikipedia, 'MAUD Committee'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/MAUD_Committee","what_used_for":"Frisch-Peierls memo Mar 1940, first meeting 10 Apr 1940 Royal Society, the two Jul 1941 reports, the ~25 lb / 1,800 tons-TNT estimate, Oliphant's Aug 1941 visit finding Briggs had safed the report, Conant receiving it 3 Oct 1941, spawning Tube Alloys (Anderson, Akers/ICI).","reliability":0.85},{"name":"Wikipedia, 'Einstein-Szilard letter'","type":"encyclopedia","url":"https://en.wikipedia.org/wiki/Einstein%E2%80%93Szilard_letter","what_used_for":"authorship (Szilard w/ Teller & Wigner), signing 2 Aug 1939, delivery by Sachs 11 Oct 1939, the warnings ('extremely powerful bombs of a new type', German uranium/Czechoslovakia), FDR 'Pa, this requires action!', the $6,000 committee, Einstein's Newsweek 1947 regret ('had I known... I would have done nothing').","reliability":0.85},{"name":"Atomic Heritage Foundation / Nuclear Museum","type":"scholarly-history","url":"https://ahf.nuclearmuseum.org","what_used_for":"Britain's early input, MAUD report detail, Einstein-Szilard letter, Klaus Fuchs profile, women & African-Americans on the project, atomic culture; corroborates the institutional and personnel facts.","reliability":0.85},{"name":"US National Park Service, Manhattan Project National Historical Park","type
