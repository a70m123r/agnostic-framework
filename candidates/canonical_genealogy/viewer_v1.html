y/datagram seam S) to exercise v2's institution-actors (D2), exogenous-forcing (D4), and — its CHIEF purpose — the DEFERRED v3 refinements. Where Manhattan is the FAST crisis-pull (33 months) with ONE phantom enemy, the Internet is the SLOW institutional cascade (Sputnik 1957 -> ARPANET 1969 -> Cerf-Kahn 1974 -> flag day 1983 -> NSFNET 1986 -> commercialization 1995) whose defining dynamic is a RIVAL-STANDARD WAR — making it the natural SECOND instance for R23 (rival-lifecycle-coupling), R27 (cascade welder), and R29 (a lineage starved by its own patron state: CYCLADES)."},"generated":"2026-06-09","frames_present":["time","space","knowledge","meaning"],"layers_present":["physical","latent"],"_layers_present_comment":"(D3) BOTH layers heavily populated — like Manhattan and Keynesian, the institution/government/company actors (DARPA, NSF, BBN, IETF, CERN, ISO, the PTTs) are physical and load-bearing, while the protocols/architecture/standards (latent) are the trunk and canopy. Standards documents (RFC 675, the 1974 Cerf-Kahn paper, the OSI model, X.25) straddle — physical artifacts carrying a latent architecture.","overall_confidence":0.82,"_overall_confidence_comment":"ALWAYS read paired with fuzzy_layer — a SPLIT aggregate, never a flat scalar. The TRUNK FACTS are high (~0.9-0.95): packet-switching was invented (Baran/Davies, early-mid 1960s), internetworking/open-architecture was specified by Cerf-Kahn (1974), TCP/IP became the ARPANET standard on the 1 Jan 1983 flag day, NSFNET (1986) scaled it, and commercialization (1995) consummated it as the global network-of-networks. The CHILD indisputably EXISTS and works (unlike QG). The figure is pulled DOWN from Manhattan's 0.90 by genuinely-contested frontier zones: (a) the PRIORITY DISPUTE over who invented packet-switching (Kleinrock's contested claim vs the Baran/Davies attribution — a live, bitter dispute); (b) the CONTESTED GENEALOGY of what 'the Internet' even IS (the ARPANET-as-origin whig narrative vs the internetworking-weld reading); (c) the WHIG-VS-REVISIONIST historiography of the protocol wars (was TCP/IP's victory inevitable-on-merit or contingent-and-political? — Russell's revisionist thesis); (d) the strawman-framing of OSI by the winners. High-confidence core, honestly-contested frontier — and the fuzz here is in ATTRIBUTION and HISTORIOGRAPHY (who/why), not in whether the child was born.","schema_capabilities":{"_comment":"(D3+D5) Declared render capabilities. Static block — announces what a v2 render supports.","layer_filter":{"_comment":"(D3) The render is FILTERABLE on the physical/latent axis; actors are the bridge. EXERCISED here: see _layer_filter_hand_check below.","supported":true,"axes":["physical","latent"],"bridge_via":"actors","note":"A render may show the PHYSICAL view (actors, agencies, labs, companies, the IMPs/routers, the backbone, the standards bodies) OR the LATENT view (the protocols, the open-architecture principle, the end-to-end principle, the network-of-networks idea); every node declares frame_layer; actors straddle and connect the two."},"graded_membership":{"_comment":"(D5) Fuzzy edges by design — graded membership is the pervasive default. The signature D5 demonstrations here: the W_B parent ('open-architecture internetworking') is ~0.7 as a single parent but ~0.95 decomposed into Kahn's four ground rules + the datagram + the end-to-end principle; a single forcing event (national PTT/government standards policy) PULLS the OSI/X.25 lineage while SQUEEZING TCP/IP, then inverts after 1992; the priority of packet-switching is graded across Baran/Davies/Kleinrock.","supported":true,"default":"graded","applies_to":["node membership","weld extent (sub_welds)","actor role-strength (carrier/inhabitant)","forcing-event influence (acted_on.strength)","frame-layer straddle (physical/latent membership)","lifecycle phase membership","weld_type weight"],"note":"Every boundary is a membership/confidence in [0,1]; the certain core is just where membership ~1.0. Crisp = the membership happens to be ~0/1."}},"_layer_filter_hand_check":{"_comment":"(D3, SCHEMA_v2.md §6 item 5) Hand-check that the specimen is renderable under each filter. PHYSICAL-only view = {actors of kind individual/government/agency/lab/company/university + the IMPs/gateways/routers + the NSFNET backbone + the PTT telco networks + forcing_events of kind war/funding/politics/economic}. LATENT-only view = {child (the Internet-as-network-of-networks idea, TCP/IP, the open-architecture & end-to-end principles) + harvest descendants (the Web, the platform economy) + sub_wrappers of kind knowledge (packet-switching, the datagram, queueing theory)}. STRADDLE / bridge = actors (every actor carries a latent protocol/principle UP and inhabits physical+latent institutions WITHIN); the 1974 Cerf-Kahn paper / RFC 675 / the OSI reference model / the X.25 recommendation straddle (physical documents carrying a latent architecture). Both views are non-empty and connected through actors — the filter is satisfied.","physical_view_nodes":["all kind:individual/government/institution/lab/company/university actors (Baran, Davies, Cerf, Kahn, Pouzin; DARPA, NSF, BBN, RAND, NPL, CERN, ISO, CCITT, IETF, the PTTs)","the IMPs / gateways / routers (Cisco)","the ARPANET + NSFNET backbones + the X.25 public data networks (Transpac/Minitel)","forcing_events: Sputnik/Cold War, the Mansfield-era defense-research climate, GOSIP mandates, NSF commercialization/deregulation"],"latent_view_nodes":["child W_C (the Internet = the network-of-networks; TCP/IP; the open-architecture + end-to-end principles)","sub_wrappers tagged knowledge (packet-switching, distributed/survivable routing, the datagram, queueing theory, layering)","harvest descendants (the World Wide Web, e-commerce/the platform economy, social media, the cloud)"],"bridge_nodes":["every actor (carrier_of UP into latent protocols/principles; inhabitant_of WITHIN physical agencies/labs/companies)","the 1974 Cerf-Kahn paper + RFC 675 + the OSI reference model + the X.25 recommendation (physical documents carrying a latent architecture); RFCs as the genre that IS the bridge"]},"child":{"_comment":"W_C — THE INTERNET (the network of networks, running TCP/IP). The trunk node, and — like Manhattan and unlike QG — it is SOLID (the crown is not hollow). NOT the ARPANET (that is a parent-substrate); the CHILD is the internetworking layer that lets HETEROGENEOUS, independently-owned networks interconnect with no central control. The thing born in this merge is the open, end-to-end, network-of-networks ARCHITECTURE — which is why the WEB, e-commerce and social media are harvest (descendants), not the child.","id":"child-internet","name":"The Internet (TCP/IP — the network of networks)","kernel":"A global, decentralized network-of-networks: independently-owned heterogeneous packet networks interconnected through gateways/routers by a common protocol suite (TCP/IP), under the open-architecture principle (each network stands on its own, no internal change required to join) and the end-to-end principle (intelligence at the hosts, not in the network). CRUCIAL contrast with QG's kernel: this is a description of an EXISTING, deployed object (billions of hosts; the substrate of the world economy), not a specification of a sought target. CRUCIAL contrast with the ARPANET: the child is NOT a single packet network but the INTERNETWORKING layer that federates many.","frame":["space","time","knowledge","meaning"],"_frame_note":"knowledge (the protocol architecture), space+time (a planet-spanning infrastructure built over ~3 decades), and a real {meaning} engagement: the Internet became a moral/political object (the 'two visions' of standardization — decentralized open process vs centralized state/PTT control; later net-neutrality, surveillance, platform power). The meaning-frame engagement here is for 'WHO governs the network and by what process' (the protocol wars as a power struggle), echoing QG's meaning-frame 'which child is winning' and Manhattan's 'was the child's use justified'.","frame_layer":{"_comment":"(D3) The child STRADDLES: the PROTOCOL/architecture (TCP/IP, open-architecture, end-to-end) is latent, while the deployed network (routers, fiber, the backbone) is a physical artifact. Graded toward latent because the genealogy treats W_C primarily as the latent architectural wrapper, with a strong physical limb (the deployed infrastructure).","layer":"straddle","physical_membership":0.5,"latent_membership":0.9},"status":"risen","_status_enum":"one of: risen | active | dormant | resurrected | stale | open-conjecture. Here UNAMBIGUOUSLY 'risen' (and hardened) — the consummated antithesis of QG's 'open-conjecture', and like Manhattan a monotone-hardening trajectory. The child rose (1974 specification), consolidated (1983 flag day -> 1986 NSFNET), WON its rival war (the protocol wars, ~1990-95), and HARDENED irreversibly into the global communications baseline. No dormancy after firing.","status_trajectory":[{"_comment":"(R5) the child as a TRAJECTORY — a MONOTONE-HARDENING one (like Manhattan, the inverse of QG and unlike Keynesian's die-and-reincarnate). It rises, wins its standards war, and hardens; it does not go dormant or reincarnate method-incompatibly. continuity stays high throughout (default ~1.0): TCP/IP at scale in 2026 is method-CONTINUOUS with the 1974-83 design (the same datagram/end-to-end architecture) — explicitly NOT the Keynesian/deep-learning identity_break. This is itself a graduation datum (see R24, already-ratified).","state":"specified (Cerf-Kahn 1974 'A Protocol for Packet Network Intercommunication'; the internetworking architecture drawn)","when":"1974","by":"Vint Cerf & Bob Kahn (with the Stanford/BBN/UCL group; Gerard Le Lann + Pouzin's CYCLADES concepts)","confidence":0.95,"continuity":1},{"state":"consolidated (ARPANET 'flag day' 1 Jan 1983: NCP -> TCP/IP cutover; the internetwork becomes the operational baseline)","when":"1 Jan 1983","by":"DARPA / DCA; the ARPANET community","confidence":0.95,"continuity":1},{"state":"won-its-rival-war + scaled (NSFNET 1986 -> the protocol wars decided ~1990-95: TCP/IP displaces OSI and X.25)","when":"1986-1995","by":"NSF; the IETF; the commercial-ISP market; CERN's Web as the killer harvest","confidence":0.9,"continuity":1},{"state":"hardened (irreversible global baseline: commercialization 1995, the dot-com build-out, the mobile/cloud era; the substrate of the world economy)","when":"1995 -> present","by":"the global ISP/telecom/platform industry; ICANN/IETF/ISOC governance","confidence":0.92,"continuity":1}],"confidence":0.92,"_confidence_note":"0.92 = confidence the child is a real, distinct emergent that EXISTS and works (billions of hosts; the substrate of modern life). Slightly below Manhattan's 0.95 only because the BOUNDARY of 'the Internet' as the child (vs the ARPANET substrate vs the Web harvest) is itself a contested-genealogy frontier (discrepancies). NOTE the v2 pattern (cf. Manhattan): child.confidence HIGH while the SURPRISE is the subtler axis — packet-switching ALONE implied a single network; the genuine joint-surprise is INTERNETWORKING (that independently-owned, heterogeneous, mutually-distrusting networks could federate with NO central control). R9 confirmed: surprise_confidence (0.85) and child.confidence (0.92) are orthogonal.","utility":{"_comment":"Pav's three utility legs. Like Manhattan (and unlike QG's largely-prospective utility), the utility is overwhelmingly REALIZED.","unifier":"Fused two previously-separate wrappers — single-network packet-switching + the open-architecture internetworking principle — into one operational system that UNIFIES all prior heterogeneous networks (ARPANET, SATNET, PRNET, Ethernet LANs, X.25 publics, later cellular) under one address+transport scheme, AND became the universal substrate the Web, e-commerce, the cloud and social media all sit on. passesW_CTest: YES — the network-of-networks is genuinely unreachable from either parent alone: packet-switching alone yields ISOLATED single networks (the ARPANET, NPL, CYCLADES, X.25 publics — each a silo); the open-architecture/end-to-end PRINCIPLE alone is an empty design stance with nothing to connect. Only TOGETHER do they yield a federating internetwork.","compressor":"QUALITATIVE ONLY (no fabricated bits). TCP/IP 'compresses' the entire heterogeneity of the world's networks into one thin waist ('IP on everything' — Cerf's 1992 slogan): every application above and every link-layer below need know only the narrow IP datagram interface (the hourglass/narrow-waist architecture). It also compresses 'how to add a new network' into a single rule (run IP at the gateway), distinct from QG's PRINCIPLED-null compressor: here the compression is REAL but still assessed qualitatively (MDL-in-bits needs latent embeddings — a later step).","action_spaces_unlocked":["The World Wide Web (Berners-Lee, CERN, 1989-91) — the dominant harvest application.","Electronic commerce + the platform economy (Amazon, eBay, Google, and the entire digital economy).","Email/messaging/VoIP and the collapse of distance in personal + business communication.","Cloud computing + streaming media + the mobile-app ecosystem.","Social media + the modern public sphere (and its pathologies: misinformation, platform power, surveillance).","A new domain of statecraft + conflict (cyberwar, internet governance, the splinternet/sovereignty debates)."]}},"weld":{"_comment":"The merge: parents -> child. THE HEART OF THE SPECIMEN. Here the weld is a CONSUMMATED, institution-cascade-welded, exogenously-forced merge whose distinctive feature (vs Manhattan) is that consummation ran through a RIVAL-STANDARD WAR. The clean 2-parent diagram (packet-switching x internetworking) is present and faithful as a projection, but (R1/R27) the welding agent is NEITHER parent: it is an ORDERED CASCADE of mediating institutions (ARPA -> IPTO -> BBN -> universities-under-contract -> INWG -> IAB/IETF -> ISOC), with the human welders (Cerf & Kahn) sitting a layer up from both packet-switching and the open-architecture stance. See mediating_wrapper and discrepancies.","id":"weld-main","parents":[{"_role":"W_A","name":"Packet-switching (distributed, survivable, store-and-forward data networking)","kernel":"The technique of chopping messages into addressed blocks (packets) and routing them independently, store-and-forward, over a decentralized mesh: Baran's distributed-adaptive-message-block / survivable-network design at RAND (1959-64, 'On Distributed Communications'); Davies' independent NPL invention that COINED 'packet' (1965-66); Kleinrock's queueing theory; realized in the ARPANET (BBN's IMPs, 1969) and the NPL network (1970). The technology that makes data networking efficient and robust. frame {knowledge}.","frame":["knowledge"],"confidence":0.95,"parent_kind":"content","_parent_kind_note":"(R4) the CONTENT parent — the core networking technology. Itself multiply-rooted + priority-disputed (Baran/Davies/Kleinrock); see parents_full + discrepancies."},{"_role":"W_B","name":"Open-architecture internetworking (the network-of-networks principle)","kernel":"Kahn's open-architecture stance (1973): connect INDEPENDENTLY-OWNED, heterogeneous networks with no internal change required to any of them, via gateways, with reliability pushed to the end hosts (the end-to-end principle) and a connectionless datagram core (Pouzin's CYCLADES contribution). The design philosophy + the datagram + the end-to-end principle that turn many isolated packet networks into ONE internetwork. frame {knowledge, meaning}.","frame":["knowledge","meaning"],"confidence":0.92,"_confidence_note":"0.92 that the open-architecture/internetworking principle EXISTED and was load-bearing; BUT only ~0.7 that it is faithfully ONE parent rather than a composite (Kahn's four ground rules + Pouzin's datagram + Saltzer-Reed-Clark's end-to-end principle + the gateway concept) — see parents_full. The D5 graded-membership signature, milder than Manhattan's 0.6 war-state because internetworking is a more coherent single idea than 'the war-state'.","parent_kind":"method","_parent_kind_note":"(R4) the METHOD parent — a design philosophy / architectural principle, not a physical technology. Contrast W_A's CONTENT (the packet-switching technique)."}],"_parents_comment":"(v1, kept) The clean BINARY projection [packet-switching, open-architecture internetworking]. Present and useful as the framework's canonical visualization. Both parents decompose (W_A into Baran/Davies/Kleinrock; W_B into Kahn's ground rules + the datagram + end-to-end) — see parents_full + discrepancies.","parents_full":[{"_comment":"(R1) The honest N-ary parent set. BOTH parents decompose. W_A (packet-switching) is itself a priority-disputed multi-root; W_B (internetworking) is a composite of an architectural stance + the datagram + the end-to-end principle + the gateway. This is the specimen's R1 instance — milder than Manhattan's institutional assemblage but real.","id":"pf-baran","name":"Baran's distributed/survivable packet network (RAND, 1959-64)","kernel":"Distributed-adaptive-message-block 'hot-potato' store-and-forward routing over a survivable mesh, motivated by surviving a nuclear first strike ('On Distributed Communications', RAND P-2626 1962 / RM-3420 1964). The survivability + distributed-routing root of W_A.","frame":["knowledge","meaning"],"confidence":0.95,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.15,"latent_membership":0.9}},{"id":"pf-davies","name":"Davies' NPL packet-switching (1965-66)","kernel":"Independent invention of packet-switching at the National Physical Laboratory; COINED the word 'packet'; proposed a UK national data network; built the NPL network (1970). The civil/commercial root of W_A (and the term itself).","frame":["knowledge"],"confidence":0.95,"parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.15,"latent_membership":0.9}},{"id":"pf-kleinrock","name":"Kleinrock's queueing theory of message/packet networks","kernel":"Doctoral queueing-theoretic analysis of message-switched networks (1961-62, book 1964); later analytic work on the ARPANET. CONTESTED as a packet-switching origin (Davies/Baran/Taylor dispute the claim) — recorded as a parent at reduced confidence + a priority-dispute discrepancy.","frame":["knowledge"],"confidence":0.6,"_confidence_note":"0.6, NOT because the queueing-theory work is doubtful (it is real and load-bearing for ARPANET performance) but because the CLAIM that it ORIGINATED packet-switching is contested (Davies 2001: 'I can find no evidence that he understood the principles of packet switching'; McKenzie: 'nothing in the entire 1964 book...alludes to the idea of packetization'; Kleinrock 2023 acknowledged the early work was about MESSAGE switching). Graded membership as a PARENT.","parent_kind":"method","frame_layer":{"layer":"latent","physical_membership":0.1,"latent_membership":0.95}},{"id":"pf-kahn-openarch","name":"Kahn's open-architecture principle (1973)","kernel":"The four ground rules: each network stands on its own; no internal change required to connect; best-effort with end-host recovery; no global control. The architectural stance that defines W_B.","frame":["knowledge","meaning"],"confidence":0.92,"parent_kind":"method","frame_layer":{"layer":"latent","physical_membership":0.1,"latent_membership":0.95}},{"id":"pf-datagram","name":"Pouzin's datagram / connectionless model (CYCLADES, early 1970s)","kernel":"The CONNECTIONLESS datagram (Pouzin coined 'datagram'); CYCLADES was the first to push reliable delivery to the END HOSTS rather than the network. Cerf & Kahn explicitly acknowledged CYCLADES in the 1974 paper; Gerard Le Lann carried the concepts into the Transmission Control Program. The datagram leg of W_B.","frame":["knowledge"],"confidence":0.92,"parent_kind":"content","_parent_kind_note":"(R4) borderline content/method — the datagram is a concrete construct (content) embodying the end-to-end stance (method). Load-bearing AND a dormancy/forcing story in its own right (CYCLADES was defunded — see forcing_events + R29).","frame_layer":{"layer":"latent","physical_membership":0.15,"latent_membership":0.9}},{"id":"pf-e2e","name":"The end-to-end principle (Saltzer-Reed-Clark, articulated 1981)","kernel":"Put function at the endpoints, keep the network simple (the design rationale later articulated formally in 'End-to-End Arguments in System Design', 1981/84). Present in practice in CYCLADES/TCP from the early 1970s; the principle that justifies the thin-waist architecture. The methodological spine of W_B.","frame":["knowledge","meaning"],"confidence":0.88,"parent_kind":"method","frame_layer":{"layer":"latent","physical_membership":0.05,"latent_membership":0.97}}],"mediating_wrapper":{"_comment":"(R1, R27) The agent that PERFORMED the weld, sitting a layer up from BOTH parents — and here, as in Manhattan, it is NOT a single node but an ORDERED TEMPORAL CASCADE of institutional hand-offs. THIS IS THE SPECIMEN'S CHIEF GRADUATION TARGET: a SECOND independent instance of the Manhattan 'welder-as-cascade' pattern (R27). Modeled here as an ORDERED SEQUENCE (the gap R27 asks for). The human welders Cerf & Kahn sit a layer up from both packet-switching and the open-architecture stance.","name":"The institutional welding cascade (ORDERED): Sputnik-shock -> ARPA (1958) -> IPTO/Licklider's 'Intergalactic Network' (1962-63) -> Taylor+Roberts launch the ARPANET (1966) -> BBN builds the IMPs (1969) -> the academic Network Working Group / RFC process (Crocker, 1969) -> Cerf-Kahn internetworking (1974) -> INWG attempts international reconciliation (1972-76) -> DARPA/DCA mandate TCP/IP (flag day 1983) -> IAB/IETF institutionalize the standards (1986) -> NSF scales it (NSFNET 1986) -> ISOC/commercialization hand it to the world (1992-95)","ordered_sequence":[{"step":1,"stage":"ARPA created (post-Sputnik)","who_or_what":"the US DoD / Eisenhower","when":"Feb 1958","confidence":0.95},{"step":2,"stage":"IPTO + the 'Intergalactic Network' vision","who_or_what":"J.C.R. Licklider (IPTO)","when":"1962-63","confidence":0.9},{"step":3,"stage":"the ARPANET launched + RFP","who_or_what":"Bob Taylor + Larry Roberts (IPTO)","when":"1966-68","confidence":0.92},{"step":4,"stage":"the IMPs / the subnet built","who_or_what":"BBN (Kahn, Heart, Walden, Crowther)","when":"1969","confidence":0.95},{"step":5,"stage":"the Network Working Group / RFC process (the open standards genre)","who_or_what":"Steve Crocker + the graduate-student NWG (RFC 1, 1969)","when":"1969-","confidence":0.9},{"step":6,"stage":"internetworking specified (TCP)","who_or_what":"Vint Cerf + Bob Kahn (Stanford/BBN/UCL; Le Lann)","when":"1973-74","confidence":0.95},{"step":7,"stage":"INWG attempts international reconciliation (FAILS)","who_or_what":"INWG (Cerf chair, then Barber); Zimmermann, McKenzie, Scantlebury","when":"1972-76","confidence":0.85},{"step":8,"stage":"TCP/IP mandated on the ARPANET (flag day)","who_or_what":"DARPA / the Defense Communications Agency","when":"1 Jan 1983","confidence":0.95},{"step":9,"stage":"standards institutionalized","who_or_what":"the IAB + the IETF","when":"1986","confidence":0.9},{"step":10,"stage":"scaled to the research/education world","who_or_what":"the NSF (NSFNET)","when":"1986-","confidence":0.92},{"step":11,"stage":"handed to the world (governance + commercialization)","who_or_what":"ISOC (1992) + NSF backbone retirement (1995); later ICANN (1998)","when":"1992-95","confidence":0.9}],"kernel":"An ORDERED relay of mediating institutions and documents, each handing the weld to the next, that fused the packet-switching parent to the open-architecture parent and carried the consummated child from a defense research project to a global public utility. No single one is the welder; the SEQUENCE is. STRONGLY recurs the Manhattan cascade pattern (R27).","who_or_what":"Cerf & Kahn (the human internetworking welders, a layer up from both parents); the cascade of agencies/labs/bodies above","confidence":0.92,"_disowned_note":"(R31-adjacent, WEAK) the INWG stage (step 7) produced a 1976 compromise international protocol (Cerf-McKenzie-Scantlebury-Zimmermann) that NEITHER the CCITT NOR the ARPANET adopted — Cerf 'could not persuade the TCP community to adopt the compromise'. A mediating stage that was effectively BYPASSED/superseded by its own constituency — a faint echo of Keynesian's disowned-IS-LM-mediator (R31), but NOT a clean second instance (no named author repudiated his own creation; the stage was abandoned, not disowned). See R31 graduation verdict."},"shared_sub_object_S":"S = the GATEWAY/DATAGRAM INTERCONNECTION POINT at the exact place where the PACKET-SWITCHING technique (efficient routing WITHIN a network) meets the OPEN-ARCHITECTURE requirement to join INDEPENDENT networks WITHOUT a common owner or internal change. Three faces: (1) the GATEWAY (later 'router') — the box that sits BETWEEN networks and forwards datagrams across the boundary (the literal seam, Cerf-Kahn 1974); (2) the COMMON DATAGRAM FORMAT (IP) — a single address+packet format every network agrees to carry, embodying the narrow waist; (3) the END-TO-END principle — reliability lives at the hosts, so the heterogeneous, unreliable networks in the middle need not be changed. Genuine overlap, not a pile: packet-switching owns intra-network routing, open-architecture owns the no-central-control federation, and ONLY at the gateway+datagram do they fuse into an internetwork.","_shared_sub_object_S_confidence":0.9,"_shared_sub_object_S_note":"HIGH confidence the seam is genuine. Contrast QG (direction-of-weld disputed) and Darwin+Mendel (fractured S): here S is multi-faceted but AGREED among the Internet engineers. The CONTEST at the seam is EXTERNAL — the rival OSI/X.25 camps proposed a DIFFERENT seam (virtual circuits + strict layering + connection-oriented network service), which is the protocol-wars discrepancy, NOT an internal fracture of THIS S.","S_structure":{"_comment":"(R12) OPTIONAL — S here is multi-faceted but AGREED among the welders (like Manhattan's S and QG's S; unlike Darwin+Mendel's fractured S). The three faces (gateway / common datagram / end-to-end) are mutually-reinforcing, not in conflict. agreed:true WITHIN the Internet lineage. The DISAGREEMENT is BETWEEN lineages (TCP/IP's datagram seam vs OSI/X.25's virtual-circuit seam) — recorded as the protocol-wars rival-coupling + a frame-ownership discrepancy, NOT as an internal conflict of S.","components":["the gateway/router — the box between networks (Cerf-Kahn 1974)","the common datagram format (IP) — the narrow waist every network carries","the end-to-end principle — reliability at the hosts, simple network in the middle"],"internal_conflict":"","agreed":true},"surprise":"The genuine JOINT-surprise (reachable only from BOTH parents) is NOT that a data network exists — single packet networks (the ARPANET, NPL, CYCLADES, the X.25 publics) were implied by packet-switching ALONE (W_A). The genuine joint-surprise is INTERNETWORKING: that INDEPENDENTLY-OWNED, HETEROGENEOUS, MUTUALLY-DISTRUSTING networks could be federated into one seamless whole with NO central control, NO common owner, and NO internal change to any member network — and that this open, end-to-end, 'dumb-network/smart-edges' architecture would SCALE to a planet and outcompete every centrally-planned alternative. Neither parent predicts this alone: packet-switching alone yields SILOS (each network a walled garden); the open-architecture PRINCIPLE alone is an empty stance with nothing to connect. STANDOUT SUB-SURPRISE: the winning architecture was the LESS-CONTROLLED one — the camp with no central authority, no government mandate, and 'rough consensus and running code' beat the camp (OSI/X.25) backed by ISO, the CCITT, the PTTs and government procurement mandates (GOSIP). The PHANTOM here (cf. Manhattan's phantom enemy): the heavily-funded, officially-mandated OSI stack was widely believed INEVITABLE ('OSI is now inevitable' — Metcalfe 1989) and never shipped at scale — a real institutional force defeated by a child it had dismissed. META-SURPRISE: a consummated weld can be carried to global victory NOT by the best-funded mediating institutions but by the FASTEST-ITERATING, least-governed ones — and a rival lineage's STATE BACKING can be the very thing that SLOWS it (OSI's committee process; CYCLADES killed by its own PTT in favor of Minitel).","surprise_confidence":0.85,"_surprise_confidence_note":"0.85 (cf. QG 0.85, Manhattan 0.80). DELIBERATELY DECOUPLED from child.confidence (0.92) per R9. The internetworking surprise (federating heterogeneous networks with no central control) is well-attested and genuinely unforeseeable from either parent; the 'less-controlled camp won' sub-surprise is strongly documented (Russell; the GOSIP-mandate failure). Slightly below a maximal score only because, like Manhattan, a PORTION of 'the Internet' (some data network) was forecastable from W_A alone — the joint-surprise is the FEDERATION-without-control, not the existence of networking. Populates the (surprise x child) plane near Manhattan (high-child / high-but-tempo-or-means-surprise), distinct from QG (low-child).","surprise_priority":{"_comment":"(R15) OPTIONAL the CONJECTURE-IN-A-PARENT. The internetworking surprise pre-existed the quantitative weld as a low-confidence vision inside the W_B lineage: Licklider's 'Intergalactic Computer Network' memos (1962-63) imagined a globe-spanning interconnected network of computers ~11 years before the 1974 TCP specification and ~21 before the flag day — a 'drawn but not confirmed' weld living inside the IPTO vision, analogous to Faraday's 1846 light-guess inside Maxwell's W_A and Szilard's 1933 chain-reaction patent inside Manhattan's W_A.","first_conjectured_by":"J.C.R. Licklider ('Intergalactic Computer Network' memos, IPTO)","when":"1962-1963","dormant_interval":"1963 -> 1973 (the vision sat inside the IPTO/ARPA culture until packet-switching was deployed (ARPANET 1969) and Kahn's open-architecture problem (1973) made internetworking concrete)","confidence":0.85},"bits_note":"QUALITATIVE ONLY. The Internet is a REAL compression — the IP 'narrow waist' collapses the heterogeneity of every link-layer below and every application above into one thin datagram interface ('IP on everything'), and 'how to add a network' compresses to 'run IP at the gateway'. Distinct from QG's PRINCIPLED-null (QG could not be MDL-scored because the child did not exist); here the child exists, so the compression is real, but it is still assessed QUALITATIVELY (MDL-in-bits needs latent embeddings — a later step). NO numeric bit values fabricated.","survived":["Packet-switching itself (Baran/Davies) — survived as the core transport of every Internet link.","The DATAGRAM / connectionless model (Pouzin/CYCLADES) — survived as IP, defeating the rival virtual-circuit model (X.25/OSI CONS).","The END-TO-END principle (CYCLADES->TCP; Saltzer-Reed-Clark 1981) — survived as the Internet's defining architectural commitment.","Baran's distributed/no-central-control survivability — survived as the Internet's decentralization and its governance ethos.","The RFC / 'rough consensus and running code' open-process method (Crocker 1969; Clark 1992) — survived as the IETF's standardization culture."],"dropped":["Baran's ORIGINAL motivation (surviving a nuclear first strike) — DROPPED as the operative rationale; the survivability MECHANISM (decentralization) survived, the COLD-WAR PURPOSE did not (the network became civil then commercial).","The VIRTUAL-CIRCUIT / connection-oriented network model (X.25, the CCITT/PTT approach) — DROPPED/defeated by the rival lineage (the datagram won).","OSI's STRICT SEVEN-LAYER model + connection-oriented network service — DROPPED/defeated (TCP/IP's looser four-layer + connectionless IP won the protocol wars).","NCP (the original ARPANET host protocol) — DROPPED at the 1983 flag day, replaced by TCP/IP.","NOTE (D5): unlike QG, 'dropped' here is essentially SINGLE-VALUED (one consummated child), so the per-candidate feature_ledger DEFAULTS EMPTY per the design law — there are no rival CHILDREN dropping DIFFERENT features. The 'drops' here are of RIVAL ARCHITECTURES/LINEAGES (X.25, OSI, NCP), recorded via the rival-lifecycle-coupling + forcing_events.direction being lineage-relative — see weld_type rival-coupling note + gaps."],"feature_ledger":[],"_feature_ledger_comment":"(R7) EMPTY by design — a single consummated child (TCP/IP) makes the flat survived[]/dropped[] sufficient. The per-candidate matrix is a frontier-case (QG) device; this consummated case correctly leaves it empty. The rival ARCHITECTURES (OSI/X.25) are RELATIVES (relation:rival), not candidate_children of THIS weld.","frame_of_weld":["space","time","knowledge","meaning"],"_frame_of_weld_note":"The weld holds in {knowledge} (the protocol architecture), {space} (a planet-spanning physical infrastructure), {time} (the active operator — a multi-decade institutional cascade + a late deregulation pull; see weld_operator), and {meaning}: because the child is also a GOVERNANCE object, the VALENCE of its consummation is observer- and era-relative (the 'two visions' of standardization — open bottom-up process vs centralized state/PTT control; Russell's contested historiography). Same meaning-frame relativity QG showed for 'which child is winning' and Manhattan for 'was the use justified', here for 'WHO should govern the network and by what process'.","weld_operator":"TIME-AS-INSTITUTIONAL-CASCADE + LATE EXOGENOUS DEREGULATION-PULL. The active frame-ingredient is not a physics operator (cf. Maxwell's d/dt) but the multi-decade RELAY OF INSTITUTIONS that carried the weld (ARPA->IPTO->BBN->INWG->IETF->NSF->ISOC), accelerated at the end by an EXOGENOUS policy pull (NSF lifting the commercial-traffic on killed the network (echoing QG/Bronstein's physical-frame squeeze and Keynesian's neoliberal-movement squeeze, NOT a theorem). The IDEAS survived (the datagram + end-to-end were carried into TCP/IP), so this is a dormancy of the NETWORK/lineage, not of the concept. The external cause is recorded once in forcing_events[fe-cyclades-defund]."}],"_dormancy_intervals_extra_note":"(R32) CONTESTED-flag NOT set on this interval: the CYCLADES defunding is a well-documented FACT (not a disputed narrative like the AI winters or Mendel-neglect). The contested-dormancy phenomenon does NOT recur cleanly in this specimen — see the R32 verdict in the .md (R32 is already RATIFIED via deep-learning+Darwin-Mendel, so this specimen need not re-attest it; it simply does not supply a third).","revival":{"_comment":"(v1, R10, R19) The MAIN weld was not dormant, so it was not 'revived'. The nearest revival is the datagram CONCEPT surviving CYCLADES' death by being carried into TCP/IP — kind = SAME (the datagram was carried forward UNCHANGED, not reinterpreted). method_continuity ~1.0. UNLIKE Keynesian (reinterpreted x2) and deep learning (reinterpreted x3) — the Internet does NOT supply a method-incompatible multi-revival, so it does not re-stress R19 (which is already ratified). Recorded as a single same-kind carry-forward.","when":"1974-1983 (the datagram carried from dying CYCLADES into TCP/IP)","by":"Cerf & Kahn (acknowledging CYCLADES); Gerard Le Lann","trigger":"the internetworking weld needed a connectionless core; the datagram was the available, proven construct","kind":"same","method_continuity":1,"_kind_note":"(R10/R19) SAME, method_continuity ~1.0 — the datagram was carried forward method-CONTINUOUS into IP, not re-framed. This specimen is a MONOTONE-CONTINUOUS case (like Manhattan), the deliberate contrast with the Keynesian/deep-learning method-incompatible multi-revivals. It therefore does NOT add a second instance of R19's multi-revival stressor (R19 is already ratified anyway)."},"reattribution":{"_comment":"(R10) OPTIONAL — DEFAULTS EMPTY for the WELD as a whole ('the Internet' / TCP/IP is not mis-named; it names the producer-architecture). BUT a CREDIT/PRIORITY tension exists at the PARENT level (who invented packet-switching: Kleinrock's contested claim vs the Baran/Davies attribution) — recorded as a priority-dispute discrepancy + graded parent-confidence, NOT here, because it is a dispute over CREDIT for a PARENT, not a structural re-welding of the child. Leaving this field empty is the correct design-law signal (cf. Manhattan's empty reattribution + its credit-dispute discrepancy).","named_after":"","actually_produced_by":"","why":""},"weld_chain":[],"_weld_chain_comment":"(R10) EMPTY — a single-birth weld (no birth-2 re-welding of the Maxwell raw-form->Maxwellian-form kind). The Internet consummated once (1974 draw -> 1983 fire -> 1995 harden) and hardened; it was not re-forged into a structurally-different re-attributed object. (The IPv4->IPv6 transition is a within-child upgrade, not a re-weld — and is method-continuous.)","candidate_children":[],"_candidate_children_comment":"(R6) EMPTY BY DESIGN — this is a CONSUMMATED single-child weld (TCP/IP), the antithesis of QG's rival-children frontier. CRUCIAL DISTINCTION: OSI and X.25 are NOT candidate_children of THIS weld (they are not rival outputs of packet-switching x open-architecture); they are RIVAL ARCHITECTURES from adjacent lineages, recorded as relatives (relation:rival) + a rival-lifecycle-coupling. The weld that produced TCP/IP produced ONE winner. Leaving candidate_children empty (and unresolved:false, weld_necessity_confidence empty->1.0) is the load-bearing design-law contrast with QG.","unresolved":false,"contest_axis":"","weld_necessity_confidence":null,"_weld_necessity_confidence_comment":"(R8) EMPTY => read as 1.0. There is no serious position that 'no internetworking child was needed' — the Internet demonstrably exists. (Contrast QG's semiclassical dissent "membership":0.95,"from":"1 Jan 1983","to":"1986","note":"The NCP->TCP/IP flag day consummates the weld operationally; NSFNET (1986) scales it. Indexes sw-flag-day + sw-nsfnet."},{"phase":"rival-war (the protocol wars) — a phase the batch's other consummated welds lack","membership":0.8,"from":"1986","to":"1995","note":"A distinctive RIVAL-WAR phase: TCP/IP fights OSI + X.25 for ~a decade and wins (~1990-95). This phase is where the rival-lifecycle-coupling (R23) lives — one standard's rise IS another's fall. Indexes sw-protocol-wars-won + the rival relatives + the rival-coupling forcing events."},{"phase":"hardening","membership":0.92,"from":"1995","to":null,"note":"Commercialization (NSF backbone retired 30 Apr 1995) + the dot-com build-out + mobile/cloud HARDEN the Internet into the global communications baseline. to=null marks an OPEN hardening (still the baseline in 2026) — same 'never-stops-mattering' null as Manhattan's, the OPPOSITE of QG's never-born null."}],"pre_weld_relationship":{"_comment":"(R14) COMPLEMENTARITY (weight ~0.85) — like Manhattan (mutually-needy parents), NOT antagonism (Darwin+Mendel / deep learning). Packet-switching had the transport technology but no federation principle; the open-architecture stance had the federation vision but no transport to federate. Each held what the other lacked. This is the SINGLE HOME for the relationship strength (the phase_trajectory pre_weld entry marks only WHEN).","kind":"complementarity","membership":0.85,"note":"Mutually-needy parents: packet-switching held the intra-network transport, open-architecture held the no-central-control federation principle. NOTE: the ANTAGONISM in this specimen is BETWEEN RIVAL LINEAGES (TCP/IP vs OSI/X.25), not between the two PARENTS — a structural difference from Darwin+Mendel (where the parents themselves were antagonists)."},"weld_type":[{"_comment":"(D1) WEIGHTED classification — a weld is several types at once. All listed types are from the CORE controlled vocabulary (no NEW vocabulary term proposed, so no discrepancy row needed for vocabulary — unlike Keynesian/deep-learning which proposed new terms). The dominant types (mediator-welded + state/funding-mobilized + crisis-pulled) are exactly the cascade/institution/Cold-War features this specimen was chosen to instantiate.","type":"mediator-welded","weight":0.95,"note":"Welded by a non-parent ORDERED CASCADE a layer up (ARPA->IPTO->BBN->INWG->IETF->NSF->ISOC). The CHIEF graduation target: a SECOND instance of Manhattan's cascade welder (R27). Indexes mediating_wrapper.ordered_sequence."},{"type":"state/war-mobilized-weld","weight":0.85,"note":"The defense state (ARPA/DARPA/DCA) mobilized the weld — funding, the ARPANET testbed, the 1983 flag-day mandate; then the NSF (a civilian agency) scaled it. A state/funding-mobilized weld (the 'war' sense is the Cold-War research climate, not a hot war). TRIPLE-attests D2's government-actor finding (with Manhattan + Keynesian)."},{"type":"crisis-pulled-weld","weight":0.7,"note":"The Cold-War crisis (Sputnik) PULLED ARPA into existence and funded the whole enterprise; a late DEREGULATION pull (NSF commercialization) accelerated consummation. A milder, slower crisis-pull than Manhattan's (decades, not 33 months) — but the second crisis-pulled instance the batch was seeking."},{"type":"instrument-enabled-weld","weight":0.7,"note":"Enabling instruments: the ARPANET/IMPs (the deployable packet testbed), cheap minicomputers + UNIX/BSD shipping TCP/IP (1983), and later Ethernet LANs + Cisco routers (the gateway-as-product). The instruments made the open-architecture principle deployable at scale."},{"type":"unifier-weld","weight":0.85,"note":"Fused packet-switching with the open-architecture principle into one operational system that UNIFIES all prior heterogeneous networks under one protocol suite — the classic unifier leg."},{"type":"rival-coupled-weld (CANDIDATE NEW TERM — proposed in discrepancy #5 BEFORE use, per SCHEMA_v2 §6 item 7)","weight":0.7,"note":"NOVEL candidate type, flagged in discrepancies BEFORE use: this weld's consummation was COUPLED to the DECLINE of rival architectures (OSI, X.25/Minitel) — one standard's rise IS another's fall (the protocol wars). The existing vocabulary (foil-constructed-weld covers a strawman PARENT; this is a strawman/defeat of a RIVAL) does not hold it. This is the lifecycle-side companion to the DEFERRED R23 (rival_lifecycle_coupling). Proposed, NOT adopted — pending ratification alongside R23."}]}},"roots":{"_comment":"DOWN, in the PHYSICAL frame. The recursive descent from W_C toward people and place. Confidence FADES and depth RISES as you go deeper. The ground kernel '(0)' lives in actors[] (kind:individual + agencies/labs/companies), NOT here. The deep frontier roots are the PRIORITY DISPUTE (who invented packet-switching) and the CONTESTED GENEALOGY (what counts as 'the Internet'), which sit in fuzzy_layer.frontier.","sub_wrappers":[{"id":"sw-packet-concept","name":"Packet-switching (the technique)","kernel":"Chop messages into addressed packets, route them independently store-and-forward over a decentralized mesh. Baran (RAND, 1959-64) + Davies (NPL, 1965-66, coined 'packet'), independently.","frame":["knowledge"],"depth":1,"confidence":0.93,"who_called_it":"Paul Baran (RAND) + Donald Davies (NPL); Davies coined 'packet'","parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.15,"latent_membership":0.92}},{"id":"sw-distributed-survivable","name":"Distributed / survivable no-central-control routing","kernel":"Baran's survivable-network insight: a distributed mesh with redundant paths and no single point of failure (motivated by surviving a nuclear first strike). The decentralization root.","frame":["knowledge","meaning"],"depth":2,"confidence":0.9,"who_called_it":"Paul Baran ('On Distributed Communications', RAND)","parent_kind":"content","frame_layer":{"layer":"latent","physical_membership":0.15,"latent_membership":0.9}},{"id":" bution (Davies 2001 rebuttal; McKenzie; Taylor). A live, bitter dispute (~0.5 on Kleinrock's origin claim; ~0.9 on the Baran/Davies attribution). The specimen's deepest frontier root.","THE CONTESTED GENEALOGY of 'the Internet' — is the child the internetworking WELD (this render) or is it just the ARPANET grown up (the popular conflation)? The boundary of the child is itself fuzzy (~0.6 that 'ARPANET = the Internet' is wrong-but-popular).","THE WHIG-VS-REVISIONIST historiography of the protocol wars — was TCP/IP's victory inevitable-on-technical-merit (the winners' story) or contingent-and-political (Russell's revisionist thesis: government subsidy + commercialization timing + OSI's self-inflicted committee paralysis)? (~0.5, observer-relative).","THE STRAWMAN-FRAMING of OSI by the winners — Internet engineers 'lampooned OSI as a misguided monstrosity created by clueless European bureaucrats' (Russell); Russell's own 2006 article 'presented OSI as a foil'. The clean 'TCP/IP simply better' rendering is part-constructed (~0.6).","W_B as a SINGLE parent (vs the composite of Kahn's ground rules + datagram + end-to-end) — a lossy projection (~0.7)."],"core_boundary_locus":"The certain-core/frontier boundary does NOT fall horizontally across the trunk (as in QG, where it sinks below the child). Like Manhattan, it runs VERTICALLY ALONGSIDE a solid trunk: the entire main lineage (parents -> seam -> weld -> child -> hardening) is certain core, and the frontier is a thin sheath of (a) the PRIORITY DISPUTE + CONTESTED GENEALOGY beneath/around the parents (who invented what; what the child even is) and (b) the WHIG-VS-REVISIONIST historiography + the OSI strawman hovering beside the consummated child (why it won). The boundary's location is itself the diagnostic: a consummated weld keeps its core all the way up the trunk and pushes the fuzz OUT to attribution (the roots) and historiography (the periphery) — the same geometric inverse of QG's hollow crown that Manhattan showed, with the difference that here BOTH the roots (priority) AND the periphery (historiography) carry fuzz (Manhattan's roots were clean; only its moral periphery was fuzzy)."},"discrepancies":[{"_comment":"discrepancy[0] — the central framework-vs-record tension, and the SPECIMEN'S CHIEF GRADUATION DATUM: a SECOND independent instance of Manhattan's welder-as-cascade (R27).","what":"The schema renders parents -> ONE child via a weld, but here (as in Manhattan) the welding agent is NEITHER parent — it is an ORDERED CASCADE of mediating institutions and documents (Sputnik -> ARPA -> IPTO/Licklider -> Taylor/Roberts -> BBN -> the NWG/RFC process -> Cerf-Kahn -> INWG -> DARPA/DCA flag-day mandate -> IAB/IETF -> NSF -> ISOC), with the human welders (Cerf & Kahn) sitting a layer up from both packet-switching and the open-architecture stance. The clean 2-parent diagram cannot name the relay that did the welding.","sources_in_conflict":["Wikipedia 'ARPANET' (the institutional chain)","Internet Society 'Brief History of the Internet'","Wikipedia 'Internet Engineering Task Force' / 'Internet Architecture Board'"],"type":"framework-vs-record-tension","why_interesting":"STRONGLY supplies the SECOND independent instance of R27 (mediating_wrapper as an ordered sequence): the Manhattan 'relay of war-state institutions did the welding' pattern recurs as 'a relay of defense+civilian agencies + standards bodies did the welding'. Two crisis-pulled/institutional specimens now BOTH have a cascade welder -> R27 GRADUATES (ready to fold). Rendered here AS an ordered_sequence (the gap R27 asked for). Caps nothing on child-confidence (the child is real). -> motivates folding R27 (mediating_wrapper may be an ordered sequence).","confidence_impact":"Holds the clean-dyad-welds-itself reading at ~0.25; the ordered-cascade reading at ~0.92. No impact on child.confidence."},{"_comment":"discrepancy[1] — the priority dispute (the specimen's deepest frontier root).","what":"WHO invented packet-switching? Kleinrock has claimed priority (and to have convinced Roberts to adopt it); Donald Davies (posthumously, 2001) denied Kleinrock's early-1960s work was about packet-switching ('I can find no evidence that he understood the principles of packet switching'); Alex McKenzie ('nothing in the entire 1964 book...alludes to packetization'); Bob Taylor ('the Kleinrock-Roberts claims are not believed'). Historians + the US National Inventors Hall of Fame credit Baran AND Davies, independently. Kleinrock (2023) acknowledged the early work was about MESSAGE switching.","sources_in_conflict":["Wikipedia 'Packet switching' (priority section)","Wikipedia 'Leonard Kleinrock'","Davies' 2001 posthumous paper; McKenzie; Taylor (via Isaacson)"],"type":"priority-dispute","why_interesting":"A LIVE, BITTER priority dispute over a PARENT — analogous to deep learning's Schmidhuber-vs-the-laureates and Maxwell's re-attribution, and to Manhattan's Szilard-vs-Einstein/Oppenheimer credit. Recorded via graded parent-confidence (Kleinrock's packet-switching carrier-strength 0.35) + this row, NOT via weld.reattribution (it is a dispute over CREDIT for a parent, not a structural re-welding). Notably the dispute 'has affected sources on the topic, creating methodological challenges in the historiography' — the dispute contaminates the record itself.","confidence_impact":"Holds Kleinrock's packet-switching-origin claim at ~0.5; the Baran/Davies attribution at ~0.9. Pulls overall_confidence down via the contested root."},{"_comment":"discrepancy[2] — the contested genealogy of the child itself.","what":"WHAT is 'the Internet'? The popular narrative conflates it with the ARPANET ('the ARPANET became the Internet'). This render distinguishes them: the ARPANET is a PARENT-SUBSTRATE (one packet network), and the CHILD is the INTERNETWORKING layer (TCP/IP, the network-of-networks) that federates many networks — which is why the ARPANET could be decommissioned (1990) while the Internet grew. The boundary of the child is itself contested.","sources_in_conflict":["Internet Society 'Brief History' (internetworking framing)","popular 'ARPANET = the Internet' narratives","Cerf-Kahn 1974 / RFC 675 (the internetworking definition)"],"type":"contested-genealogy","why_interesting":"A framework-vs-record tension about node IDENTITY: the framework needs the child to be the WELD'S output (internetworking), but the popular record draws the child boundary around the substrate (the ARPANET). Recorded by making the ARPANET a relation:influence relative (not the child, not a rival). Echoes Manhattan's 'is the child the device or the nuclear order' straddle and Keynesian's 'what is Keynesianism' instability — but here the instability is DEFINITIONAL (what counts), not diachronic.","confidence_impact":"Holds 'the child = the internetworking weld' at ~0.85; the popular 'ARPANET = the Internet' conflation at ~0.6 (wrong-but-widespread). Child existence unaffected (~0.92)."},{"_comment":"discrepancy[3] — the whig-vs-revisionist historiography of the protocol wars.","what":"WAS TCP/IP's victory inevitable? The winners' (whig) narrative: TCP/IP simply had superior technology + 'rough consensus and running code'. Russell's revisionist thesis: OSI's defeat was CONTINGENT and POLITICAL — TCP/IP rode US government subsidy, the timing of NSF commercialization (1992), free UNIX/BSD bundling, and OSI's self-inflicted committee paralysis; OSI was 'also designed to be open'. 'History is written by the winners.'","sources_in_conflict":["Andrew L. Russell, 'OSI: The Internet That Wasn't' (IEEE Spectrum) + his 'Rough Consensus and Running Code'","the standard whig narrative (TCP/IP won on merit)","Wikipedia 'Protocol Wars'"],"type":"whig-vs-revisionist","why_interesting":"Engages the {meaning} frame (the 'two visions' of standardization — open bottom-up vs centralized state/PTT) more than any technology specimen, and is the SECOND batch instance (with QG's forked historiography) of a frame-ownership-style contest -> bears on the DEFERRED R22 (contested_frame_ownership) and the whig-vs-revisionist type. The valence of the consummation ('the open Internet triumphed') is observer- and era-relative. -> shows frame_of_weld must engage {meaning} for any weld whose child is a governance object.","confidence_impact":"Child existence ~0.92; the 'inevitable-on-merit' valence ~0.5 (contingent vs inevitable — observer-relative; placed in fuzzy_layer.frontier)."},{"_comment":"discrepancy[4] — the strawman/foil tension (the SECOND-INSTANCE test for R26).","what":"STRAWMAN / foil framing of the RIVAL: Internet engineers 'frequently misconstrued OSI, lampooning it as a misguided monstrosity created by clueless European bureaucrats' (Russell); Marshall Rose's 1990 textbook called OSI 'ugly'; the Internet community 'reject[ed] any technical insights from OSI' even where OSI had merit. Russell admits his OWN 2006 article 'presented OSI as a foil'. The clean 'TCP/IP was simply better' rendering is part-CONSTRUCTED by the winners.","sources_in_conflict":["Russell 'OSI: The Internet That Wasn't' (the lampoon quotes)","Marshall Rose's 1990 textbook","the standard 'TCP/IP > OSI' rendering"],"type":"framework-vs-record-tension","why_interesting":"Tests the DEFERRED R26 (parent.reconstructed_by_welder / strawman). Keynesian's R26 instance was a strawman PARENT ('classical economics' as a foil Keynes built). HERE the foil is a strawman RIVAL (OSI), not a parent — SAME mechanism (a foil constructed by the winning lineage) but a DIFFERENT structural slot (relatives, not parents). This is a PARTIAL second instance: it re-confirms the strawman PHENOMENON but NOT specifically R26's parent-slot. -> R26 graduates ONLY IF the field is generalized from 'reconstructed_by_welder on a parent' to 'reconstructed_by_winner on any node (parent OR rival)'; as written (parent-only) it does NOT cleanly graduate. See the R26 verdict.","confidence_impact":"Holds the clean 'TCP/IP simply better' rendering at ~0.6; the part-constructed-foil reading at ~0.85 (Russell's own admission). Does not touch surprise_confidence (the internetworking synergy is real regardless of how OSI was framed)."},{"_comment":"discrepancy[5] — rival-lifecycle-coupling (the SPECIMEN'S OTHER CHIEF GRADUATION DATUM: the second instance of R23).","what":"RIVAL-LIFECYCLE-COUPLING: the protocol wars are a case where one architecture's RISE IS another's FALL. GOSIP mandates + ISO backing PULLED OSI/X.25 while SQUEEZING TCP/IP (1985-88); then NSF commercialization (1992-95) + the Web + UNIX-bundling PULLED TCP/IP while OSI/X.25 COLLAPSED. The deepest instance: France's PTT KILLED its own datagram pioneer (CYCLADES, defunded 1978) to back the connection-oriented Minitel/Transpac — and the datagram CYCLADES pioneered then won globally as IP, while Minitel was eventually shut down (2012). One lineage suppressed the winning idea at home and lost to it abroad.","sources_in_conflict":["Wikipedia 'Protocol Wars'","Russell 'OSI: The Internet That Wasn't'","Wikipedia 'CYCLADES' / 'Louis Pouzin' (the defunding + Minitel choice)"],"type":"framework-vs-record-tension","why_interesting":"Supplies the SECOND independent instance of the DEFERRED R23 (rival_lifecycle_coupling — a signed phase-relation between two rival welds' lifecycles). Deep learning's R23 instance was 'connectionism's winter = symbolic AI's spring' (anti-correlated fortunes). HERE it is 'TCP/IP's rise = OSI/X.25/Minitel's fall', explicitly mediated by lineage-relative forcing (GOSIP, commercialization). TWO independent instances (deep learning + the Internet) of a signed rival-lifecycle coupling -> R23 GRADUATES (ready to fold). Also proposes (in weld_type) a companion 'rival-coupled-weld' vocabulary term BEFORE use, per §6 item 7. -> motivates folding R23.","confidence_impact":"Holds the rival-coupling reading at ~0.85. No impact on child.confidence; strengthens the rival relatives (rel-osi, rel-x25, rel-minitel)."},{"_comment":"discrepancy[6] — t
