<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Genotype / phenotype split</title>
  <desc id="desc">Two-panel diagram. Left panel labeled genotype contains the canon graph, fuzzy candidate field, and observer slice. Right panel labeled phenotype contains carrier artifacts and observable behavior. An arrow labeled "render" runs from genotype to phenotype. A second arrow underneath labeled "carrier propagation transmits genotype, not phenotype" shows what crosses between observers.</desc>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="480" fill="#0a0a0a"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#ececec">Genotype / phenotype split</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#8a8a8a">Carriers transmit the code, not the render</text>
  <rect x="40" y="84" width="280" height="280" rx="10" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="60" y="108" font-size="11" font-weight="700" fill="#ececec" letter-spacing="0.6">GENOTYPE</text>
  <text x="60" y="124" font-size="10" fill="#8a8a8a">the compressed code that determines mapping</text>
  <g font-size="11">
    <rect x="60" y="140" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="72" y="156" font-weight="600" fill="#ececec">Canon graph</text>
    <text x="72" y="170" font-size="10" fill="#8a8a8a">admitted beliefs · rules · memory</text>
    <rect x="60" y="184" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="72" y="200" font-weight="600" fill="#ececec">Fuzzy candidate field</text>
    <text x="72" y="214" font-size="10" fill="#8a8a8a">in-flight possibilities being scouted</text>
    <rect x="60" y="228" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="72" y="244" font-weight="600" fill="#ececec">Observer slice</text>
    <text x="72" y="258" font-size="10" fill="#8a8a8a">harness · wrapper · current parameters</text>
    <rect x="60" y="272" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="72" y="288" font-weight="600" fill="#ececec">A⁺ / A⁻ operators</text>
    <text x="72" y="302" font-size="10" fill="#8a8a8a">the generation + check disciplines</text>
  </g>
  <text x="180" y="345" text-anchor="middle" font-size="10" fill="#8a8a8a" font-style="italic">internal · not directly observable</text>
  <line x1="330" y1="220" x2="395" y2="220" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="362" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">render</text>
  <text x="362" y="240" text-anchor="middle" font-size="10" fill="#8a8a8a">compile loop runs</text>
  <rect x="400" y="84" width="280" height="280" rx="10" fill="#141414" stroke="#4ade80" stroke-width="2"/>
  <text x="420" y="108" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="0.6">PHENOTYPE</text>
  <text x="420" y="124" font-size="10" fill="#8a8a8a">what is produced when the code is run</text>
  <g font-size="11">
    <rect x="420" y="140" width="240" height="48" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="432" y="158" font-weight="600" fill="#ececec">Carrier artifacts</text>
    <text x="432" y="172" font-size="10" fill="#8a8a8a">words · tools · equations · rituals</text>
    <text x="432" y="184" font-size="10" fill="#8a8a8a">institutions · AI models</text>
    <rect x="420" y="196" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="432" y="212" font-weight="600" fill="#ececec">Observable behavior</text>
    <text x="432" y="226" font-size="10" fill="#8a8a8a">Asks · Gives · actions emitted</text>
    <rect x="420" y="240" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="432" y="256" font-weight="600" fill="#ececec">Rendered surface</text>
    <text x="432" y="270" font-size="10" fill="#8a8a8a">the agent as it appears from outside</text>
    <rect x="420" y="284" width="240" height="36" rx="5" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1"/>
    <text x="432" y="300" font-weight="600" fill="#ececec">Phantom action-space</text>
    <text x="432" y="314" font-size="10" fill="#8a8a8a">what observers attribute to this agent</text>
  </g>
  <text x="540" y="345" text-anchor="middle" font-size="10" fill="#8a8a8a" font-style="italic">external · what other observers see</text>
  <line x1="180" y1="408" x2="540" y2="408" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="360" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#a1a1aa">carrier propagation transmits the genotype, not the phenotype</text>
  <text x="360" y="430" text-anchor="middle" font-size="10" fill="#8a8a8a">the receiving observer re-renders at their own harness</text>
  <text x="360" y="446" text-anchor="middle" font-size="10" fill="#8a8a8a" font-style="italic">→ why the same teaching produces different students; why the same training data produces different models</text>
</svg>
