<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Diagram 06 — version 1</title>
  <desc id="desc">First version of the two-observers diagram. Two stylized heads facing each other, the word "home" as a carrier between them, each with a personal canon graph and an imagine engine. Render annotations underneath each person show what "home" meant for them.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ececec"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#0a0a0a"/>
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#ececec">v1 — Two observers in conversation</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#8a8a8a">first pass · two heads · a word between them · personal canons</text>

  <!-- Person A -->
  <circle cx="140" cy="140" r="32" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <path d="M 96 192 Q 96 175 116 170 L 164 170 Q 184 175 184 192 L 184 208 L 96 208 Z" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="140" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#ececec">Person A</text>

  <rect x="60" y="252" width="160" height="60" rx="6" fill="#141414" stroke="#4ade80" stroke-width="1.5"/>
  <text x="70" y="268" font-size="9" font-weight="700" fill="#4ade80">CANON</text>
  <g fill="#4ade80" opacity="0.7"><circle cx="90" cy="285" r="3"/><circle cx="120" cy="280" r="3"/><circle cx="155" cy="290" r="3"/><circle cx="190" cy="282" r="3"/><circle cx="105" cy="300" r="2.5"/><circle cx="145" cy="302" r="2.5"/><circle cx="180" cy="298" r="2.5"/></g>

  <rect x="60" y="320" width="160" height="44" rx="6" fill="#141414" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="70" y="336" font-size="9" font-weight="700" fill="#a78bfa">IMAGINE ENGINE</text>
  <g stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.6"><path d="M 90 358 Q 92 350 88 342"/><path d="M 115 358 Q 119 348 115 340"/><path d="M 145 358 Q 142 348 150 342"/><path d="M 175 358 Q 178 348 174 340"/></g>

  <text x="140" y="390" text-anchor="middle" font-size="9" fill="#a1a1aa" font-style="italic">her "home" renders as:</text>
  <text x="140" y="404" text-anchor="middle" font-size="9" fill="#ececec">kitchen, mother, smell of bread</text>

  <!-- Carrier -->
  <line x1="190" y1="140" x2="290" y2="140" stroke="#ececec" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="118" width="140" height="44" rx="22" fill="#4ade80"/>
  <text x="370" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">"home"</text>
  <text x="370" y="154" text-anchor="middle" font-size="8" fill="#0a0a0a" opacity="0.85">CARRIER</text>
  <line x1="450" y1="140" x2="550" y2="140" stroke="#ececec" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Person B -->
  <circle cx="600" cy="140" r="32" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <path d="M 556 192 Q 556 175 576 170 L 624 170 Q 644 175 644 192 L 644 208 L 556 208 Z" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="600" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#ececec">Person B</text>

  <rect x="520" y="252" width="160" height="60" rx="6" fill="#141414" stroke="#4ade80" stroke-width="1.5"/>
  <text x="530" y="268" font-size="9" font-weight="700" fill="#4ade80">CANON</text>
  <g fill="#4ade80" opacity="0.7"><circle cx="545" cy="288" r="3"/><circle cx="580" cy="282" r="3"/><circle cx="615" cy="292" r="3"/><circle cx="650" cy="284" r="3"/><circle cx="560" cy="302" r="2.5"/><circle cx="600" cy="304" r="2.5"/><circle cx="640" cy="300" r="2.5"/></g>

  <rect x="520" y="320" width="160" height="44" rx="6" fill="#141414" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="530" y="336" font-size="9" font-weight="700" fill="#a78bfa">IMAGINE ENGINE</text>
  <g stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.6"><path d="M 550 358 Q 552 350 548 342"/><path d="M 580 358 Q 584 348 580 340"/><path d="M 610 358 Q 607 348 615 342"/><path d="M 640 358 Q 643 348 639 340"/></g>

  <text x="600" y="390" text-anchor="middle" font-size="9" fill="#a1a1aa" font-style="italic">his "home" renders as:</text>
  <text x="600" y="404" text-anchor="middle" font-size="9" fill="#ececec">a quiet flat in a city he left</text>

  <line x1="40" y1="450" x2="760" y2="450" stroke="#3a3a3a" stroke-width="1"/>
  <text x="400" y="470" text-anchor="middle" font-size="11" fill="#8a8a8a" font-style="italic">Translation is not repeating the same thing louder.</text>
</svg>
