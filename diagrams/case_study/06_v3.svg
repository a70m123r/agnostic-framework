<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Diagram 06 — version 3</title>
  <desc id="desc">Third version. Major reframe after Pav's feedback that "home" is a shared kernel canon, not split-by-observer. What varies is the dial setting. The diagram now has three tiers: kernel canon at top, dial in middle, meaning range at bottom from literal place to paradigm shift.</desc>
  <defs>
    <linearGradient id="range3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="33%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="66%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#0a0a0a"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#ececec">v3 — Kernel canon + the dial + meaning range</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#8a8a8a">reframed: "home" is shared kernel canon; the dial modulates it; output ranges across</text>

  <!-- Tier 1: Kernel canon -->
  <rect x="60" y="68" width="680" height="76" rx="8" fill="#141414" stroke="#4ade80" stroke-width="2"/>
  <text x="76" y="86" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="0.5">KERNEL CANON  ·  shared latent anchor</text>
  <rect x="330" y="98" width="140" height="38" rx="19" fill="#4ade80"/>
  <text x="400" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">"home"</text>
  <text x="400" y="133" text-anchor="middle" font-size="8" fill="#0a0a0a" opacity="0.85">grounded in habitation</text>
  <text x="76" y="116" font-size="9" fill="#8a8a8a" font-style="italic">everyone has one — nomads too</text>

  <!-- Person A small -->
  <circle cx="80" cy="240" r="18" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="80" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#ececec">A</text>

  <!-- Person B small -->
  <circle cx="720" cy="240" r="18" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="720" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#ececec">B</text>

  <!-- Tier 2: THE DIAL (single shared, in v3) -->
  <rect x="140" y="170" width="520" height="150" rx="10" fill="#141414" stroke="#fbbf24" stroke-width="2"/>
  <text x="160" y="190" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="0.5">THE DIAL  ·  modulates kernel into meaning</text>

  <g><circle cx="220" cy="240" r="22" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1.5"/><line x1="220" y1="240" x2="232" y2="228" stroke="#fbbf24" stroke-width="2"/><text x="220" y="282" text-anchor="middle" font-size="9" fill="#a1a1aa">overlap</text></g>
  <g><circle cx="320" cy="240" r="22" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1.5"/><line x1="320" y1="240" x2="335" y2="244" stroke="#fbbf24" stroke-width="2"/><text x="320" y="282" text-anchor="middle" font-size="9" fill="#a1a1aa">intent</text></g>
  <g><circle cx="420" cy="240" r="22" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1.5"/><line x1="420" y1="240" x2="410" y2="254" stroke="#fbbf24" stroke-width="2"/><text x="420" y="282" text-anchor="middle" font-size="9" fill="#a1a1aa">situation</text></g>
  <g><circle cx="520" cy="240" r="22" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1.5"/><line x1="520" y1="240" x2="508" y2="228" stroke="#fbbf24" stroke-width="2"/><text x="520" y="282" text-anchor="middle" font-size="9" fill="#a1a1aa">context</text></g>

  <text x="400" y="310" text-anchor="middle" font-size="9" fill="#a1a1aa" font-style="italic">dial is dynamic — moves through the exchange</text>

  <!-- Tier 3: Meaning range -->
  <rect x="60" y="340" width="680" height="120" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="76" y="358" font-size="9" font-weight="700" fill="#ececec">MEANING PRODUCED  ·  along its range</text>
  <rect x="80" y="372" width="640" height="14" rx="7" fill="url(#range3)"/>
  <text x="80" y="406" font-size="10" font-weight="700" fill="#4ade80">literal place</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" font-weight="700" fill="#fbbf24">belonging</text>
  <text x="480" y="406" text-anchor="middle" font-size="10" font-weight="700" fill="#a78bfa">self</text>
  <text x="720" y="406" text-anchor="end" font-size="10" font-weight="700" fill="#93c5fd">paradigm shift</text>
  <text x="400" y="432" text-anchor="middle" font-size="10" fill="#a1a1aa">same kernel · different dial setting · different meaning</text>
  <text x="400" y="448" text-anchor="middle" font-size="10" fill="#8a8a8a" font-style="italic">framework has scope for the whole range</text>
</svg>
