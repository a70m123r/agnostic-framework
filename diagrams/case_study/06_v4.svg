<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Diagram 06 — version 4</title>
  <desc id="desc">Fourth version. Each observer has their own private dial (not shared). Each renders the other within their wrapper. Wrappers project to each other. Elevation planes stack on the right side. Resolution band at the bottom runs from struggle through negotiation to union.</desc>
  <defs>
    <linearGradient id="res4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#0a0a0a"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#ececec">v4 — Each observer's own dial · mutual render · elevation planes · resolution</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#8a8a8a">added: per-observer dials · mutual render insets · elevation planes stack · struggle ↔ union</text>

  <text x="120" y="70" font-size="10" font-weight="700" fill="#a1a1aa">PERSON A</text>
  <rect x="40" y="78" width="280" height="280" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="50" y="94" font-size="8" font-weight="700" fill="#ececec">WRAPPER</text>
  <rect x="200" y="84" width="80" height="40" rx="4" fill="#0a0a0a" stroke="#a78bfa" stroke-width="1"/>
  <text x="240" y="100" text-anchor="middle" font-size="7" font-weight="700" fill="#a78bfa">RENDER OF B</text>
  <text x="240" y="114" text-anchor="middle" font-size="7" fill="#8a8a8a">her model</text>
  <rect x="50" y="132" width="260" height="48" rx="5" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="60" y="148" font-size="8" font-weight="700" fill="#fbbf24">HER DIAL</text>
  <g><circle cx="80" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="80" y1="166" x2="86" y2="161" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="130" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="130" y1="166" x2="135" y2="170" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="180" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="180" y1="166" x2="175" y2="172" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="230" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="230" y1="166" x2="236" y2="161" stroke="#fbbf24" stroke-width="1.5"/></g>
  <rect x="50" y="188" width="260" height="32" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="60" y="200" font-size="8" font-weight="700" fill="#4ade80">PERCEIVED GLOBAL CANON</text>
  <text x="60" y="212" font-size="7" fill="#8a8a8a">past · present · future · fuzzy</text>
  <rect x="50" y="228" width="260" height="48" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="60" y="240" font-size="8" font-weight="700" fill="#4ade80">PERSONAL CANON</text>
  <g fill="#4ade80" opacity="0.7"><circle cx="80" cy="258" r="2"/><circle cx="120" cy="252" r="2"/><circle cx="170" cy="262" r="2"/><circle cx="220" cy="254" r="2"/><circle cx="270" cy="262" r="2"/><circle cx="100" cy="266" r="2"/><circle cx="150" cy="268" r="2"/></g>
  <rect x="50" y="284" width="260" height="32" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="298" font-size="8" font-weight="700" fill="#fbbf24">HER ACTION-SPACE</text>
  <rect x="50" y="324" width="260" height="28" rx="4" fill="#0a0a0a" stroke="#a78bfa" stroke-width="1"/>
  <text x="60" y="340" font-size="7" font-weight="700" fill="#a78bfa">HER LATENT "HOME"</text>

  <!-- Wrappers project to each other -->
  <line x1="320" y1="104" x2="360" y2="104" stroke="#ececec" stroke-width="1.5"/>
  <text x="340" y="96" text-anchor="middle" font-size="7" fill="#8a8a8a">projects</text>

  <!-- Person B mirror -->
  <text x="450" y="70" font-size="10" font-weight="700" fill="#a1a1aa">PERSON B</text>
  <rect x="360" y="78" width="280" height="280" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="370" y="94" font-size="8" font-weight="700" fill="#ececec">WRAPPER</text>
  <rect x="520" y="84" width="80" height="40" rx="4" fill="#0a0a0a" stroke="#a78bfa" stroke-width="1"/>
  <text x="560" y="100" text-anchor="middle" font-size="7" font-weight="700" fill="#a78bfa">RENDER OF A</text>
  <text x="560" y="114" text-anchor="middle" font-size="7" fill="#8a8a8a">his model</text>
  <rect x="370" y="132" width="260" height="48" rx="5" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="380" y="148" font-size="8" font-weight="700" fill="#fbbf24">HIS DIAL</text>
  <g><circle cx="400" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="400" y1="166" x2="395" y2="172" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="450" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="450" y1="166" x2="456" y2="161" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="500" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="500" y1="166" x2="506" y2="160" stroke="#fbbf24" stroke-width="1.5"/></g>
  <g><circle cx="550" cy="166" r="8" fill="#1c1c1c" stroke="#fbbf24" stroke-width="1"/><line x1="550" y1="166" x2="544" y2="170" stroke="#fbbf24" stroke-width="1.5"/></g>
  <rect x="370" y="188" width="260" height="32" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="380" y="200" font-size="8" font-weight="700" fill="#4ade80">PERCEIVED GLOBAL CANON</text>
  <rect x="370" y="228" width="260" height="48" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="380" y="240" font-size="8" font-weight="700" fill="#4ade80">PERSONAL CANON</text>
  <g fill="#4ade80" opacity="0.7"><circle cx="400" cy="258" r="2"/><circle cx="440" cy="252" r="2"/><circle cx="490" cy="262" r="2"/><circle cx="540" cy="254" r="2"/><circle cx="590" cy="262" r="2"/></g>
  <rect x="370" y="284" width="260" height="32" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="380" y="298" font-size="8" font-weight="700" fill="#fbbf24">HIS ACTION-SPACE</text>
  <rect x="370" y="324" width="260" height="28" rx="4" fill="#0a0a0a" stroke="#a78bfa" stroke-width="1"/>
  <text x="380" y="340" font-size="7" font-weight="700" fill="#a78bfa">HIS LATENT "HOME"</text>

  <!-- Elevation planes (right side) -->
  <rect x="650" y="78" width="120" height="280" rx="6" fill="#141414" stroke="#fbbf24" stroke-width="1"/>
  <text x="660" y="94" font-size="8" font-weight="700" fill="#fbbf24">PLANES</text>
  <rect x="658" y="106" width="104" height="22" rx="3" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="710" y="121" text-anchor="middle" font-size="8" fill="#ececec">cultural</text>
  <rect x="658" y="134" width="104" height="22" rx="3" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="710" y="149" text-anchor="middle" font-size="8" fill="#ececec">shared reality</text>
  <rect x="658" y="162" width="104" height="22" rx="3" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="710" y="177" text-anchor="middle" font-size="8" fill="#ececec">personal</text>
  <rect x="658" y="190" width="104" height="22" rx="3" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="710" y="205" text-anchor="middle" font-size="8" fill="#ececec">local</text>
  <rect x="658" y="218" width="104" height="22" rx="3" fill="#0a0a0a" stroke="#a78bfa" stroke-width="1"/>
  <text x="710" y="233" text-anchor="middle" font-size="8" fill="#a78bfa">latent</text>
  <text x="710" y="270" text-anchor="middle" font-size="9" fill="#fbbf24" font-style="italic">↑ elevate</text>

  <!-- Resolution band -->
  <rect x="40" y="380" width="720" height="20" rx="10" fill="url(#res4)"/>
  <text x="40" y="424" font-size="11" font-weight="700" fill="#ef4444">STRUGGLE</text>
  <text x="400" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">NEGOTIATION</text>
  <text x="760" y="424" text-anchor="end" font-size="11" font-weight="700" fill="#4ade80">UNION</text>
  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">resolution depends on whether the dials reconcile</text>
</svg>
