<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Diagram 06 — version 5</title>
  <desc id="desc">Fifth version. Added explicit idea domain panel (imagine engine + fuzzy field + personal canon) and body domain panel (harness with evolved + memory + instinct). The asymmetry of action made explicit: action takes space in both domains; neither alone produces action.</desc>
  <rect x="0" y="0" width="800" height="500" fill="#0a0a0a"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#ececec">v5 — Idea domain + body domain + asymmetry of action</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#8a8a8a">added: imagine engine + fuzzy field · evolved + memory + instinct · both domains needed</text>

  <text x="200" y="74" font-size="10" font-weight="700" fill="#a1a1aa">PERSON A</text>
  <rect x="40" y="80" width="320" height="290" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- Wrapper -->
  <rect x="50" y="92" width="300" height="26" rx="4" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="60" y="108" font-size="8" font-weight="700" fill="#ececec">WRAPPER</text>
  <!-- Dial -->
  <rect x="50" y="124" width="300" height="26" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="140" font-size="8" font-weight="700" fill="#fbbf24">HER DIAL</text>
  <!-- Global canon -->
  <rect x="50" y="156" width="300" height="22" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="60" y="170" font-size="8" font-weight="700" fill="#4ade80">PERCEIVED GLOBAL CANON</text>
  <!-- IDEA DOMAIN (NEW in v5) -->
  <rect x="50" y="184" width="300" height="92" rx="5" fill="#0a0a0a" stroke="#a78bfa" stroke-width="2"/>
  <text x="60" y="200" font-size="9" font-weight="700" fill="#a78bfa">IDEA DOMAIN</text>
  <text x="60" y="212" font-size="7" fill="#8a8a8a">imagine engine · fuzzy field · personal canon</text>
  <rect x="60" y="220" width="280" height="22" rx="3" fill="#1c1c1c" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="70" y="234" font-size="7" font-weight="600" fill="#a78bfa">FUZZY FIELD</text>
  <g fill="#a78bfa" opacity="0.6"><circle cx="180" cy="232" r="2.5"/><circle cx="210" cy="234" r="2"/><circle cx="240" cy="231" r="2.5"/><circle cx="270" cy="234" r="2"/><circle cx="300" cy="232" r="2.5"/></g>
  <text x="190" y="252" font-size="7" fill="#4ade80" font-style="italic">↑ lift to canon</text>
  <rect x="60" y="250" width="280" height="22" rx="3" fill="#1c1c1c" stroke="#4ade80" stroke-width="1"/>
  <text x="70" y="264" font-size="7" font-weight="600" fill="#4ade80">PERSONAL CANON</text>
  <g fill="#4ade80" opacity="0.7"><circle cx="180" cy="265" r="2"/><circle cx="210" cy="263" r="2"/><circle cx="240" cy="267" r="2"/><circle cx="270" cy="263" r="2"/></g>
  <!-- BODY DOMAIN (NEW in v5) -->
  <rect x="50" y="284" width="300" height="58" rx="5" fill="#0a0a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="300" font-size="9" font-weight="700" fill="#ef4444">BODY DOMAIN · HARNESS</text>
  <rect x="60" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="104" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">evolved</text>
  <rect x="156" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">memory</text>
  <rect x="252" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="296" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">instinct</text>
  <!-- Action -->
  <rect x="50" y="348" width="300" height="20" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="362" font-size="8" font-weight="700" fill="#fbbf24">HER ACTION-SPACE</text>

  <!-- Person B mirror -->
  <text x="580" y="74" font-size="10" font-weight="700" fill="#a1a1aa">PERSON B</text>
  <rect x="420" y="80" width="320" height="290" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <rect x="430" y="92" width="300" height="26" rx="4" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/>
  <text x="440" y="108" font-size="8" font-weight="700" fill="#ececec">WRAPPER</text>
  <rect x="430" y="124" width="300" height="26" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="440" y="140" font-size="8" font-weight="700" fill="#fbbf24">HIS DIAL</text>
  <rect x="430" y="156" width="300" height="22" rx="4" fill="#0a0a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="440" y="170" font-size="8" font-weight="700" fill="#4ade80">PERCEIVED GLOBAL CANON</text>
  <rect x="430" y="184" width="300" height="92" rx="5" fill="#0a0a0a" stroke="#a78bfa" stroke-width="2"/>
  <text x="440" y="200" font-size="9" font-weight="700" fill="#a78bfa">IDEA DOMAIN</text>
  <rect x="440" y="220" width="280" height="22" rx="3" fill="#1c1c1c" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="450" y="234" font-size="7" font-weight="600" fill="#a78bfa">FUZZY FIELD</text>
  <g fill="#a78bfa" opacity="0.6"><circle cx="560" cy="232" r="2.5"/><circle cx="590" cy="234" r="2"/><circle cx="620" cy="231" r="2.5"/><circle cx="650" cy="234" r="2"/><circle cx="680" cy="232" r="2.5"/></g>
  <rect x="440" y="250" width="280" height="22" rx="3" fill="#1c1c1c" stroke="#4ade80" stroke-width="1"/>
  <text x="450" y="264" font-size="7" font-weight="600" fill="#4ade80">PERSONAL CANON</text>
  <rect x="430" y="284" width="300" height="58" rx="5" fill="#0a0a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="300" font-size="9" font-weight="700" fill="#ef4444">BODY DOMAIN · HARNESS</text>
  <rect x="440" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="484" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">evolved</text>
  <rect x="536" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">memory</text>
  <rect x="632" y="308" width="88" height="26" rx="3" fill="#1c1c1c" stroke="#ef4444" stroke-width="1"/>
  <text x="676" y="324" text-anchor="middle" font-size="8" font-weight="600" fill="#ef4444">instinct</text>
  <rect x="430" y="348" width="300" height="20" rx="4" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="440" y="362" font-size="8" font-weight="700" fill="#fbbf24">HIS ACTION-SPACE</text>

  <!-- Asymmetry callout -->
  <rect x="40" y="388" width="720" height="70" rx="8" fill="#141414" stroke="#ef4444" stroke-width="2"/>
  <text x="56" y="406" font-size="10" font-weight="700" fill="#ef4444">THE ASYMMETRY OF ACTION</text>
  <text x="56" y="422" font-size="10" fill="#ececec">Action takes space in both domains.</text>
  <text x="56" y="438" font-size="9" fill="#a78bfa">↔ IDEA SIDE (imagine + fuzzy + canon)</text>
  <text x="420" y="438" font-size="9" fill="#ef4444">↔ BODY SIDE (harness + evolved + memory + instinct)</text>
  <text x="400" y="452" text-anchor="middle" font-size="9" fill="#8a8a8a" font-style="italic">A pure mind cannot act; a pure body cannot mean.</text>
</svg>
