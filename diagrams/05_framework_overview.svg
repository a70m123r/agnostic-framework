<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Framework overview map</title>
  <desc id="desc">A landscape grouping of the framework's canon primitives in five regions — substrate, observer, mechanics, propagation, and discipline. Each region contains its primary primitives. Edges connect the most load-bearing relationships only. The A-minus operator is marked as the primary compilation discipline at the center.</desc>
  <rect x="0" y="0" width="900" height="600" fill="#0a0a0a"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#ececec">Framework overview map</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#8a8a8a">Canon primitives, grouped — load-bearing edges only</text>
  <rect x="30" y="78" width="240" height="160" rx="8" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="48" y="98" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="0.6">SUBSTRATE</text>
  <rect x="630" y="78" width="240" height="200" rx="8" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="648" y="98" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="0.6">OBSERVER</text>
  <rect x="290" y="78" width="320" height="280" rx="8" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
  <text x="308" y="98" font-size="10" font-weight="700" fill="#ececec" letter-spacing="0.6">MECHANICS</text>
  <rect x="30" y="258" width="240" height="160" rx="8" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="48" y="278" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="0.6">DISCIPLINE</text>
  <rect x="630" y="298" width="240" height="180" rx="8" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="648" y="318" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="0.6">PROPAGATION</text>
  <g font-size="11" fill="#ececec">
    <text x="48" y="125">• Ω (the substrate)</text>
    <text x="48" y="143">• Latent space</text>
    <text x="48" y="161">• 0 / not-0 distinction</text>
    <text x="48" y="179">• Spiral substrate cycle</text>
    <text x="48" y="197">• Cross-scale mediation</text>
    <text x="48" y="215">• Computational irreducibility</text>
  </g>
  <g font-size="11" fill="#ececec">
    <text x="648" y="125">• Observer</text>
    <text x="648" y="143">• Harness</text>
    <text x="648" y="161">• Wrapper</text>
    <text x="648" y="179">• Action-space</text>
    <text x="648" y="197">• Cone profile</text>
    <text x="648" y="215">• Genotype / phenotype</text>
    <text x="648" y="233">• AU matrix</text>
    <text x="648" y="251">• Internal canon-as-observer</text>
  </g>
  <g font-size="11" fill="#ececec">
    <text x="308" y="125" font-weight="600">• Fuzzy candidate field</text>
    <text x="308" y="143" font-weight="600">• Canon</text>
    <text x="308" y="161">• Carrier artifact</text>
    <text x="308" y="179">• A⁺ operator (generator)</text>
  </g>
  <rect x="308" y="190" width="282" height="42" rx="6" fill="#4ade80"/>
  <text x="449" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">A⁻ operator (checker)</text>
  <text x="449" y="223" text-anchor="middle" font-size="10" fill="#0a0a0a" opacity="0.85">PRIMARY COMPILATION DISCIPLINE</text>
  <g font-size="11" fill="#ececec">
    <text x="308" y="252">• Multi-possibility deposition</text>
    <text x="308" y="270">• Ask · Give · Ping · Pong</text>
    <text x="308" y="288">• Imagine Engine</text>
    <text x="308" y="306">• Charge-product algebra</text>
    <text x="308" y="324">• Membrane</text>
    <text x="308" y="342">• Squeeze event</text>
  </g>
  <g font-size="11" fill="#ececec">
    <text x="48" y="305">• Viability band</text>
    <text x="48" y="323">• Criticality Γ</text>
    <text x="48" y="341">• Wolfram four-class</text>
    <text x="48" y="359">• Emergent garden</text>
    <text x="48" y="377">• Engineered emergence</text>
    <text x="48" y="395">• Canon ≠ truth (7 types)</text>
