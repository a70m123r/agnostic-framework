    <text x="648" y="435">• Internet as observer-class</text>
  </g>
  <g stroke="#8a8a8a" stroke-width="1" fill="none" opacity="0.55">
    <line x1="270" y1="158" x2="305" y2="158"/>
    <line x1="595" y1="158" x2="628" y2="158"/>
    <line x1="270" y1="338" x2="305" y2="211"/>
    <line x1="595" y1="290" x2="628" y2="362"/>
    <line x1="750" y1="278" x2="750" y2="298"/>
  </g>
  <rect x="30" y="498" width="840" height="78" rx="8" fill="#141414" stroke="#4ade80" stroke-width="1.5"/>
  <text x="50" y="520" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="0.5">THE FRAMEWORK HAS THREE COMPATIBLE LENSES ON THE SUBSTRATE</text>
  <g font-size="11" fill="#ececec">
    <text x="50" y="544"><tspan font-weight="600">Graph lens</tspan> — canon as a discrete graph of typed nodes + edges (the structural view)</text>
    <text x="50" y="560"><tspan font-weight="600">Algebraic lens</tspan> — A⁺ / A⁻ as latent dimensions with charge-product algebra (the symmetry view)</text>
    <text x="490" y="544"><tspan font-weight="600">Function-space lens</tspan> — substrate as a function over high-dimensional inputs (the geometric view)</text>
    <text x="490" y="560" fill="#a1a1aa" font-style="italic">all three view the same thing; reach for whichever fits the question</text>
  </g>
  <text x="450" y="592" text-anchor="middle" font-size="10" fill="#8a8a8a">~25 of the framework's load-bearing canon primitives shown · candidates and speculations omitted for clarity</text>
</svg>
