<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Diagram 06b — three friction states between two observers (casual)</title>
  <desc id="desc">Casual companion to diagram 06. Three panels showing two-observer interactions at three friction states: freeze (too little friction, observers diffuse apart), viability (productive friction, body-membranes hold shape while exchanging), and explode (too much friction, wrappers burn down). The framework regulates the substrate between these poles, not toward any particular outcome.</desc>
  <rect x="0" y="0" width="800" height="420" fill="#0a0a0a"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#ececec">Two observers and the friction between them</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#8a8a8a">The framework regulates friction in the viability band — not any particular outcome</text>
  <g>
    <rect x="20" y="72" width="240" height="240" rx="10" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="140" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd">FREEZE / DIFFUSE</text>
    <text x="140" y="108" text-anchor="middle" font-size="10" fill="#8a8a8a">too little friction</text>
    <circle cx="80" cy="170" r="26" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.7"/>
    <circle cx="200" cy="170" r="26" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.7"/>
    <g fill="#93c5fd" opacity="0.45">
      <circle cx="50" cy="130" r="1.5"/><circle cx="40" cy="155" r="1.5"/><circle cx="38" cy="190" r="1.5"/>
      <circle cx="55" cy="215" r="1.5"/><circle cx="120" cy="145" r="1.5"/><circle cx="115" cy="200" r="1.5"/>
      <circle cx="160" cy="145" r="1.5"/><circle cx="165" cy="200" r="1.5"/><circle cx="230" cy="135" r="1.5"/>
      <circle cx="240" cy="160" r="1.5"/><circle cx="245" cy="195" r="1.5"/><circle cx="230" cy="215" r="1.5"/>
    </g>
    <line x1="80" y1="170" x2="40" y2="130" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="80" y1="170" x2="40" y2="210" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="200" y1="170" x2="240" y2="130" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="200" y1="170" x2="240" y2="210" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <text x="140" y="248" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">nothing holds shape</text>
    <text x="140" y="262" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">no inertia · no signal</text>
    <text x="140" y="282" text-anchor="middle" font-size="9" fill="#8a8a8a">e.g. small-talk so polite</text>
    <text x="140" y="294" text-anchor="middle" font-size="9" fill="#8a8a8a">nothing actually exchanges</text>
    <text x="140" y="306" text-anchor="middle" font-size="9" fill="#8a8a8a">— both leave unchanged</text>
  </g>
  <g>
    <rect x="280" y="72" width="240" height="240" rx="10" fill="#141414" stroke="#4ade80" stroke-width="2"/>
    <text x="400" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">VIABILITY</text>
    <text x="400" y="108" text-anchor="middle" font-size="10" fill="#a1a1aa">generative friction</text>
    <circle cx="340" cy="170" r="28" fill="#1c1c1c" stroke="#ef4444" stroke-width="2"/>
    <text x="340" y="174" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">body</text>
    <circle cx="460" cy="170" r="28" fill="#1c1c1c" stroke="#ef4444" stroke-width="2"/>
    <text x="460" y="174" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">body</text>
    <line x1="368" y1="160" x2="432" y2="160" stroke="#4ade80" stroke-width="1.5"/>
    <line x1="432" y1="180" x2="368" y2="180" stroke="#4ade80" stroke-width="1.5"/>
    <polygon points="432,160 425,156 425,164" fill="#4ade80"/>
    <polygon points="368,180 375,176 375,184" fill="#4ade80"/>
    <text x="400" y="148" text-anchor="middle" font-size="8" fill="#4ade80">exchange</text>
    <text x="340" y="218" text-anchor="middle" font-size="8" fill="#fbbf24">A⁺ generates</text>
    <text x="340" y="230" text-anchor="middle" font-size="8" fill="#4ade80">A⁻ checks</text>
    <text x="460" y="218" text-anchor="middle" font-size="8" fill="#fbbf24">A⁺ generates</text>
    <text x="460" y="230" text-anchor="middle" font-size="8" fill="#4ade80">A⁻ checks</text>
    <text x="400" y="262" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">each holds their shape</text>
    <text x="400" y="276" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">friction produces signal</text>
    <text x="400" y="294" text-anchor="middle" font-size="9" fill="#8a8a8a">e.g. honest disagreement</text>
    <text x="400" y="306" text-anchor="middle" font-size="9" fill="#8a8a8a">— both leave changed</text>
  </g>
  <g>
    <rect x="540" y="72" width="240" height="240" rx="10" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="660" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">EXPLODE / BURN</text>
    <text x="660" y="108" text-anchor="middle" font-size="10" fill="#8a8a8a">too much friction</text>
    <circle cx="600" cy="170" r="28" fill="#1c1c1c" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
    <circle cx="720" cy="170" r="28" fill="#1c1c1c" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
    <line x1="590" y1="155" x2="600" y2="170" stroke="#ef4444" stroke-width="1"/>
    <line x1="600" y1="170" x2="610" y2="190" stroke="#ef4444" stroke-width="1"/>
    <line x1="710" y1="155" x2="720" y2="170" stroke="#ef4444" stroke-width="1"/>
    <line x1="720" y1="170" x2="730" y2="190" stroke="#ef4444" stroke-width="1"/>
    <g stroke="#ef4444" stroke-width="1.2" opacity="0.7">
      <path d="M 628 160 Q 645 153 660 160 Q 675 167 692 160"/>
      <path d="M 628 170 Q 645 163 660 170 Q 675 177 692 170"/>
      <path d="M 628 180 Q 645 173 660 180 Q 675 187 692 180"/>
    </g>
    <text x="660" y="218" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="600">wrapper burns down</text>
    <text x="660" y="230" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="600">membrane breach</text>
    <text x="660" y="262" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">wrapper can't contain it</text>
    <text x="660" y="276" text-anchor="middle" font-size="10" fill="#a1a1aa" font-style="italic">signal becomes attack</text>
    <text x="660" y="294" text-anchor="middle" font-size="9" fill="#8a8a8a">e.g. escalation into harm</text>
    <text x="660" y="306" text-anchor="middle" font-size="9" fill="#8a8a8a">— both leave injured</text>
  </g>
  <line x1="40" y1="340" x2="760" y2="340" stroke="#3a3a3a" stroke-width="1"/>
  <text x="400" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#ececec">The framework's discipline: stay in the viable band.</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#a1a1aa" font-style="italic">struggle is not the enemy — too-little friction is. so is too-much.</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#8a8a8a">A⁺ releases friction (admits new). A⁻ absorbs friction (prunes excess). Together they keep the band.</text>
</svg>
