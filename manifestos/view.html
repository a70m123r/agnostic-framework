<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifesto — Agnostic Framework</title>
<meta name="description" content="A manifesto edition of the Agnostic Framework, rendered live from its source markdown.">
<script src="https://hypothes.is/embed.js" async></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --border-strong: #3a3a3a;
    --text: #ececec;
    --text-dim: #8a8a8a;
    --text-faint: #555;
    --accent-canon: #4ade80;
    --accent-candidate: #fbbf24;
    --accent-speculative: #a78bfa;
    --accent-link: #93c5fd;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Top bar */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text-dim);
  }
  .topbar a {
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-faint);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .topbar a:hover { color: var(--accent-link); border-bottom-color: var(--accent-link); }
  .topbar .sep { color: var(--text-faint); margin: 0 10px; }
  .topbar .source-link { float: right; }

  /* Content */
  main {
    padding: 56px 0 96px;
  }

  /* Headings */
  h1 {
    font-family: Georgia, "Source Serif Pro", "Charter", serif;
    font-weight: 400;
    font-size: 44px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
  }
  h2 {
    font-family: Georgia, "Source Serif Pro", "Charter", serif;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.3;
    color: var(--text-dim);
    letter-spacing: 0;
    margin: 0 0 48px;
    font-style: italic;
  }
  h3 {
    font-family: Georgia, "Source Serif Pro", "Charter", serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 64px 0 20px;
    color: var(--text);
  }
  h4, h5, h6 {
    font-family: Georgia, "Source Serif Pro", "Charter", serif;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.3;
    margin: 40px 0 16px;
    color: var(--text);
  }

  /* Body text */
  p {
    margin: 0 0 20px;
    color: var(--text);
  }
  p + p { margin-top: 0; }

  /* Emphasis */
  em { color: var(--text); font-style: italic; }
  strong { color: var(--text); font-weight: 600; }

  /* Links */
  a {
    color: var(--accent-link);
    text-decoration: none;
    border-bottom: 1px solid rgba(147, 197, 253, 0.3);
    transition: border-color 0.15s ease;
  }
  a:hover { border-bottom-color: var(--accent-link); }

  /* Blockquote — pulled-quote style matching index.html */
  blockquote {
    border-left: 2px solid var(--border-strong);
    padding: 6px 0 6px 22px;
    margin: 28px 0;
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--text);
    font-size: 17px;
    line-height: 1.55;
  }
  blockquote p { margin: 0 0 12px; }
  blockquote p:last-child { margin-bottom: 0; }

  /* Lists */
  ul, ol {
    margin: 0 0 20px;
    padding-left: 26px;
  }
  li {
    margin: 0 0 10px;
    line-height: 1.7;
  }
  li > p { margin: 0 0 10px; }
  li > ul, li > ol { margin: 10px 0; }

  /* Horizontal rule — section breaks */
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 56px 0;
  }

  /* Inline code */
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88em;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 6px;
    color: var(--text);
  }

  /* Code blocks */
  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    line-height: 1.55;
    margin: 24px 0;
  }
  pre code {
    background: transparent;
    border: none;
    padding: 0;
    font-size: inherit;
  }

  /* Tables */
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 24px 0;
    font-size: 15px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 10px 14px;
    text-align: left;
  }
  th {
    background: var(--surface);
    font-weight: 600;
    color: var(--text);
  }

  /* Loading + error states */
  .status {
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    padding: 48px 0;
    text-align: center;
  }
  .status.error { color: #f87171; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 32px 0 64px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
  }
  footer a { color: var(--text-dim); border-bottom-color: var(--text-faint); }
  footer a:hover { color: var(--accent-link); border-bottom-color: var(--accent-link); }

  /* Mobile */
  @media (max-width: 640px) {
    body { font-size: 16px; }
    h1 { font-size: 34px; }
    h3 { font-size: 24px; }
    .wrap { padding: 0 18px; }
    main { padding: 32px 0 64px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a href="../index.html">← agnostic framework</a>
    <span class="sep">·</span>
    <span id="crumb">manifesto</span>
    <a class="source-link" id="source-link" href="#" target="_blank" rel="noopener">view source ↗</a>
  </div>
</div>

<main class="wrap">
  <article id="content">
    <div class="status" id="status">loading…</div>
  </article>
</main>

<footer>
  <div class="wrap">
    Agnostic Framework · <a href="https://github.com/a70m123r/agnostic-framework">github</a> · <a href="../index.html">live site</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var file = params.get('f') || 'casual_v5.md';
    // Allow only safe filenames — letters, digits, dot, underscore, dash
    if (!/^[A-Za-z0-9_\-]+\.md$/.test(file)) {
      document.getElementById('status').textContent = 'invalid file';
      document.getElementById('status').className = 'status error';
      return;
    }

    var sourceLink = document.getElementById('source-link');
    sourceLink.href = 'https://github.com/a70m123r/agnostic-framework/blob/main/manifestos/' + file;

    var crumb = document.getElementById('crumb');
    crumb.textContent = 'manifestos / ' + file;

    fetch(file, { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        marked.setOptions({
          gfm: true,
          breaks: false,
          headerIds: true,
          mangle: false
        });
        var html = marked.parse(md);
        var content = document.getElementById('content');
        content.innerHTML = html;
        // Set title from first H1 if found
        var firstH1 = content.querySelector('h1');
        if (firstH1) {
          document.title = firstH1.textContent + ' — Agnostic Framework';
        }
      })
      .catch(function (err) {
        var s = document.getElementById('status');
        s.textContent = 'failed to load ' + file + ' (' + err.message + ')';
        s.className = 'status error';
      });
  })();
</script>

</body>
</html>
